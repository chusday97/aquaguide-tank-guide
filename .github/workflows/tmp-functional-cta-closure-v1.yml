name: Temporary functional CTA closure v1
on:
  push:
    branches: [agent/functional-cta-closure-v1]
permissions:
  contents: write
jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/functional-cta-closure-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply patches
        run: |
          python scripts/tmp_cta_patch_ui.py
          python scripts/tmp_cta_patch_meta.py
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Contracts and build
        run: |
          npm run test:product-evaluation
          npm run test:product-actions
          npm run lint
          npm run build
      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/preview.log 2>&1 &
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/preview.log
          exit 1
      - name: Collection CTA regression
        run: PREVIEW_URL=http://127.0.0.1:4173 npm run test:collection-hub-ui
      - name: Commit verified patch and self-delete
        run: |
          rm scripts/tmp_cta_patch_ui.py scripts/tmp_cta_patch_meta.py tmp-cta-test.txt .github/workflows/tmp-functional-cta-closure-v1.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix fake building feature affordance"
          git push origin HEAD:agent/functional-cta-closure-v1