name: Temporary PUI-BC-035 Registry Append

on:
  push:
    branches:
      - agent/care-card-promise-closure

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/care-card-promise-closure
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Append PUI-BC-035
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          path = Path('evaluation/product/badcases.v1.jsonl')
          text = path.read_text()
          if '"PUI-BC-035"' in text:
              raise SystemExit(0)

          record = {
              "id": "PUI-BC-035",
              "featureId": "care",
              "discoveredAt": "2026-08-18",
              "source": "functional_cta_audit",
              "severity": "medium",
              "symptom": "Care 的本地养护卡已经能真实预览和复制，但生成卡片 Dialog 仍宣称“可复制、可保存”，实际没有任何保存/下载动作；footer 还保留双列布局，唯一真实“复制文字”动作只占半栏。",
              "trigger": "进入 /care?topic=guide_safe_water_change，打开文章详情并点击“生成养护卡”。",
              "expected": "本地养护卡只承诺当前真实可执行的能力；没有保存/下载动作时不得写“可保存”，且唯一 footer 主动作应占据主要操作宽度。",
              "actual": "旧 Dialog 中文说明写“提取关键步骤，生成可复制、可保存的移动端卡片”，但 footer 只有“复制文字”按钮且使用 grid-cols-2；Product Golden Path #608 在 contracts/typecheck/build/preview 全 PASS 后由 browser regression 明确失败。",
              "rootCauseLayer": "ui_affordance",
              "status": "regression_verified",
              "fixedBy": "b4c0453c487681c3b188682f3774565d1468641a",
              "regression": "Fail-before-fix: Product Golden Path #608 / run 32104159714 — Care card action regression FAIL：没有真实保存动作时，养护卡说明不得承诺“可保存”；product contracts、typecheck、build、preview 均先 PASS。Product fix: Product Golden Path #611 / run 32104536496 on head 3c8bae3594ae052907d800d040b3261f11a050d5 — Care card action regression PASS；typecheck/build 与 GP-001～GP-005 all PASS。Permanent browser guard also requires a lone real footer action to occupy >=85% of footer width and preserves real clipboard verification."
          }
          with path.open('a') as f:
              if text and not text.endswith('\n'):
                  f.write('\n')
              f.write(json.dumps(record, ensure_ascii=False, separators=(',', ':')) + '\n')
          PY
      - name: Commit registry
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evaluation/product/badcases.v1.jsonl
          git commit -m "test: register PUI-BC-035"
          git push origin HEAD:agent/care-card-promise-closure
