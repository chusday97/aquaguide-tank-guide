name: One-time species category migration

on:
  push:
    branches: [fix/marine-invertebrate-water-type]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/marine-invertebrate-water-type
          fetch-depth: 0
      - name: Validate migration rules
        run: |
          python3 scripts/test_species_taxonomy_rules.py
          python3 scripts/test_species_category_normalizer.py
      - name: Guard migration scope
        run: |
          python3 scripts/normalize_species_categories.py --dry-run > /tmp/species-category-plan.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          plan = json.loads(Path('/tmp/species-category-plan.json').read_text(encoding='utf-8'))
          count = plan['pendingCategoryChanges']
          print(f'pending_category_changes={count}')
          if count != 49:
              raise SystemExit(f'Expected exactly 49 audited category changes, got {count}; refusing to mutate catalog.')
          PY
      - name: Apply migration
        run: |
          python3 scripts/normalize_species_categories.py
          rm .github/workflows/migrate-species-categories-once.yml
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' '.github/workflows/migrate-species-categories-once.yml' 'src/data/fishData.ts' | sort)"
          if [ "$changed" != "$expected" ]; then
            echo "Unexpected files changed:"
            printf '%s\n' "$changed"
            exit 1
          fi
      - name: Commit normalized catalog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/fishData.ts .github/workflows/migrate-species-categories-once.yml
          git commit -m 'data: normalize legacy species categories'
          git push origin HEAD:fix/marine-invertebrate-water-type
