name: Audit Relocation Dialog Topology Once

on:
  push:
    branches:
      - agent/canonical-care-relocation-wiring
    paths:
      - '.github/workflows/audit-relocation-dialog-topology-once.yml'

permissions:
  contents: write

jobs:
  audit-and-journal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/canonical-care-relocation-wiring
      - name: Print real dialog topology context
        shell: bash
        run: |
          set -euo pipefail
          echo '--- Care page InterventionComparisonPanel contexts ---'
          grep -n -C 14 'InterventionComparisonPanel' src/pages/CareEncyclopedia.tsx || true
          echo '--- Care page RelocationConfirmationDialog contexts ---'
          grep -n -C 18 'RelocationConfirmationDialog' src/pages/CareEncyclopedia.tsx || true
          echo '--- Intervention panel Dialog roots ---'
          grep -n -C 10 '<Dialog' src/components/compatibility/InterventionComparisonPanel.tsx || true
      - name: Journal latest browser evidence
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          fs.appendFileSync('HANDOFF.md', [
            '',
            '## 2026-08-17 Relocation topology convergence — checkpoint 10',
            '',
            '- Latest Chromium run `31995724881` tested head `1cbd4f9...`. The permanent Base UI close-lock static gate passed, GP-REL-01/02 and GP-REL-03 passed again, but GP-REL-04 still failed on `Escape must not dismiss uncertain dialog`.',
            '- This disproves the narrower hypothesis that the confirmation Dialog Root alone owned the Escape lifecycle. The child confirmation now correctly calls `eventDetails.cancel()` and sets `disablePointerDismissal={!canClose}`, yet the rendered confirmation is still removed after Escape.',
            '- Failure screenshot falls back to the underlying Care detail surface rather than leaving the intervention/confirmation stack visible. Current leading hypothesis is multi-dialog topology: the sibling/ancestor InterventionComparisonPanel also handles the same Escape and its close callback tears down the confirmation controller/intent.',
            '- PUI-BC-028 remains open. Next repair must lock the intervention comparison layer while a relocation confirmation is active/reconciliation-locked, using the same explicit state rather than another independent boolean guess.',
            '- This checkpoint also starts a one-shot source audit that prints the real Care-page mount/callback context before editing, so the next patch is anchored to actual component topology.',
            '',
          ].join('\n'));

          const path = 'evaluation/product/badcases.v1.jsonl';
          const lines = fs.readFileSync(path, 'utf8').trimEnd().split('\n').map(line => {
            const item = JSON.parse(line);
            if (item.id === 'PUI-BC-028') {
              return JSON.stringify({
                ...item,
                actual: 'Base UI child close-lock patch 已通过静态/type/build，但真实 Chromium run 31995724881 仍在同一 Escape 断言失败。截图回落到下层 Care detail，说明确认层卸载很可能由多 Dialog 拓扑中的 InterventionComparisonPanel close 触发，而非确认 Dialog Root 自身单点失守。',
                status: 'open_topology_root_cause_under_audit',
                regression: 'GP-REL-04 must keep both confirmation and its owning intervention context mounted across Escape/outside until canonical reconcile; then GP-REL-05 must still pass',
              });
            }
            return line;
          });
          fs.writeFileSync(path, `${lines.join('\n')}\n`);
          NODE
      - name: Remove one-shot workflow
        run: rm .github/workflows/audit-relocation-dialog-topology-once.yml
      - name: Commit journal update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HANDOFF.md evaluation/product/badcases.v1.jsonl .github/workflows/audit-relocation-dialog-topology-once.yml
          git commit -m "Journal relocation dialog topology evidence"
          git push origin HEAD:agent/canonical-care-relocation-wiring
