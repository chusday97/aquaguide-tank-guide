name: Temporary Rebuild Batch 2 Final

on:
  push:
    branches:
      - agent/compatibility-evidence-batch-2-final
    paths:
      - '.github/workflows/tmp-rebuild-batch2-final.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/compatibility-evidence-batch-2-final
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Copy five audited non-Handoff Batch 2 files
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/compatibility-evidence-batch-2-clean
          git checkout origin/agent/compatibility-evidence-batch-2-clean -- \
            evaluation/product/badcases.v1.jsonl \
            evaluation/product/compatibility-coverage-v1.json \
            scripts/test-compatibility-evidence-coverage.ts \
            src/data/compatibilityEvidence.ts \
            src/lib/tankCompatibilityEngine.ts
      - name: Patch latest-main Handoff without overwriting PUI-BC-023 challenge expansion
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'HANDOFF-2026-08-17.md';
          let source = fs.readFileSync(path, 'utf8');

          const replacements = [
            [
              '- **Knowledge Coverage：仍 limited，但 reviewed profile 有真实增长**。486 个目录对象 / 411 个 compatibility-eligible species / 7 个 reviewed profile / 2 条 reviewed pair rule；priority cohort 132 个有向组合仍只有 2 个 recordable direction。',
              '- **Knowledge Coverage：仍 limited，但 pair-level reviewed evidence 开始真实增长**。486 个目录对象 / 411 个 compatibility-eligible species / 7 个 reviewed profile / **3 条 reviewed pair rule**；priority cohort 132 个有向组合仍只有 2 个 recordable direction。'
            ],
            [
              '准确说法：**混养继续保持“宁可不知道，也不乱判”的安全稳定；reviewed species profile 从 5 扩到 7，但未经 pair evidence 支持的组合没有被伪装成可混养。**',
              '准确说法：**混养继续保持“宁可不知道，也不乱判”的安全稳定；reviewed species profile 保持 7，reviewed pair rule 从 2 增到 3；新增的是有直接 predator–prey 实验证据支持的阻断型 pair，不代表 broad compatibility coverage 已完成。**'
            ],
          ];
          for (const [from, to] of replacements) {
            const count = source.split(from).length - 1;
            if (count !== 1) throw new Error(`Expected one Handoff anchor, found ${count}: ${from}`);
            source = source.replace(from, to);
          }

          const batch2Anchor = '**当前证据边界：**telemetry 只是让下一批 evidence 能逐步从“common cohort 猜测”切换到“真实用户查询”；telemetry 本身不计入 knowledge coverage。';
          if (!source.includes(batch2Anchor)) throw new Error('Batch 2 prioritization boundary anchor missing');
          if (!source.includes('### Evidence Batch 2 — direct pair research')) {
            const section = `\n\n### Evidence Batch 2 — direct pair research\n\n最终分支：\`agent/compatibility-evidence-batch-2-final\`，从包含 PUI-BC-023 Challenge expansion 的 latest main 重建，不覆盖其 connected/regression/challenge 证据。\n\n首个 fallback research group 为 \`sp_0451 / 地图鱼 / Astronotus ocellatus\`。本批不新增 Oscar species profile，而是找到 \`sp_0451 地图鱼 + sp_0435 斑马鱼 / Danio rerio\` 的直接 predator–prey 实验证据并新增 reviewed pair rule：\n\n- verdict：\`not_recommended\`\n- riskType：\`predation_threat\`\n- basis：\`pair_rule\`\n- confidence：\`medium\`\n- reviewStatus：\`reviewed\`\n- 证据限制：实验支持直接 predator–prey / predation-threat 关系，但不是家庭水族箱长期同缸吞食试验，不得外推为“已观察到长期同缸捕食”。\n\nCoverage 边界：reviewed profiles **7 → 7**；reviewed pair rules **2 → 3**；priority recordable directions 继续 **2 / 132**；priority statuses 继续 \`108 insufficient_data / 22 not_recommended / 2 caution\`。这是阻断型 pair knowledge 扩张，不是放宽 \`insufficient_data\`。\n\nCompatibility evidence regression 已锁定 pair-rule floor >=3、audit 中必须存在 Oscar–zebrafish direct pair rule、authoritative decision=\`not_recommended\`、reviewed citations 保留、direct evidence 不得被错误标成“并非直接配对实验”、且必须保留 lab→home-aquarium 限制。`;
            source = source.replace(batch2Anchor, batch2Anchor + section);
          }

          const pui026 = '## PUI-BC-026 — Sparse species profile incorrectly clears pair evidence';
          if (!source.includes(pui026)) throw new Error('PUI-BC-026 anchor missing');
          if (!source.includes('## PUI-BC-027 — Direct pair evidence provenance mislabeled')) {
            const pui027 = `## PUI-BC-027 — Direct pair evidence provenance mislabeled\n\n状态：**regression_verified**。\n\nengine 过去对所有 reviewed pair rule 都追加“由两侧资料推断、并非直接配对实验”，会把 \`basis=pair_rule\` 的直接证据错误降级。修复后：\`rule_inference\` 保留间接推断 disclaimer；\`pair_rule\` 明确存在直接 pair/predation-risk 实验支持，同时保留“实验条件不等于家庭水族箱长期同缸”的限制。\n\n回归证据：direct-pair guard \`32037647831\`、Product Golden Path #552 以及 clean merge-ref Product Golden Path #565 均通过；#565 记录 27 Badcases / 7 profiles / 3 pair rules / priority recordable=2 / statuses 108-22-2，GP-001～GP-005 全 PASS。\n\n`;
            source = source.replace(pui026, pui027 + pui026);
          }

          const oldNext1 = '1. **Evidence Batch 2 开始做真实 pair-level research**：在 usage 样本不足期间，从 research-only queue 启动；首个 research group 为 `Astronotus ocellatus / 地图鱼`。只能把可审计的直接/明确配对证据写成 reviewed pair rule；若只有物种级行为资料，则最多补 species profile，不能把“未记录风险”升级为 pair safety。';
          const newNext1 = '1. **Evidence Batch 2 已完成首条 direct pair research，进入最终合并门禁**：地图鱼 `sp_0451` + 斑马鱼 `sp_0435` 已有 reviewed `not_recommended / predation_threat / basis=pair_rule`；最终 PR 必须在 current main merge-ref 上保持 27 Badcases / 7 profiles / 3 pair rules / recordable=2 / statuses 108-22-2 / GP-001～GP-005 全 PASS。';
          if (!source.includes(oldNext1)) throw new Error('Expected compatibility next-step line missing');
          source = source.replace(oldNext1, newNext1);

          fs.writeFileSync(path, source);
          NODE
      - name: Verify final rebuild
        run: |
          npm run test:product-evaluation
          npm run test:compatibility-evidence-coverage
          npm run lint
      - name: Commit six-file final rebuild and self-delete workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-rebuild-batch2-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            HANDOFF-2026-08-17.md \
            evaluation/product/badcases.v1.jsonl \
            evaluation/product/compatibility-coverage-v1.json \
            scripts/test-compatibility-evidence-coverage.ts \
            src/data/compatibilityEvidence.ts \
            src/lib/tankCompatibilityEngine.ts \
            .github/workflows/tmp-rebuild-batch2-final.yml
          git diff --cached --check
          git commit -m "Rebuild compatibility evidence Batch 2 on latest main"
          git push origin HEAD:agent/compatibility-evidence-batch-2-final
