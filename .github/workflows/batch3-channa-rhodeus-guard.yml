name: Batch 3 Channa Rhodeus Guard

on:
  push:
    branches:
      - agent/compatibility-evidence-batch-3-channa-rhodeus

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/compatibility-evidence-batch-3-channa-rhodeus
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply exact-anchor Batch 3 patch
        run: python3 scripts/_tmp_batch3_channa_rhodeus_patch.py
      - name: Product registry regression
        run: npm run test:product-evaluation
      - name: Compatibility evidence regression
        run: npm run test:compatibility-evidence-coverage
      - name: Compatibility coverage scorecard
        run: npm run test:compatibility-coverage-scorecard
      - name: TypeScript
        run: npm run lint
      - name: Commit guarded Batch 3 and self-delete temporary tooling
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/batch3-channa-rhodeus-guard.yml scripts/_tmp_batch3_channa_rhodeus_patch.py
          git add src/data/compatibilityEvidence.ts scripts/test-compatibility-evidence-coverage.ts scripts/test-compatibility-coverage-scorecard.ts evaluation/product/badcases.v1.jsonl
          git commit -m 'feat: add Channa Rhodeus compatibility evidence'
          git push origin HEAD:agent/compatibility-evidence-batch-3-channa-rhodeus
