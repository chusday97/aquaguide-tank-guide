name: Interactive Atlas Re-entry V1

on:
  pull_request:
    branches:
      - integration/aquaguide-rc1

permissions:
  contents: read

jobs:
  verify-interactive-atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Atlas authority contract
        run: node scripts/test-interactive-atlas-authority-contract.mjs
      - name: Mobile Encyclopedia entry contract
        run: node scripts/test-mobile-encyclopedia-entry-contract.mjs
      - name: Product contracts
        run: |
          npm run test:product-evaluation
          npm run test:golden-path-contract
      - name: P0 decision-boundary regressions
        run: |
          npm run test:p0-compatibility
          npm run test:p0-tank-state
          npm run test:p0-water-change
      - name: Type check
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4208 > /tmp/aquaguide-interactive-atlas.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4208 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/aquaguide-interactive-atlas.log
          exit 1
      - name: Interactive atlas responsive browser regression
        env:
          PREVIEW_URL: http://127.0.0.1:4208
        run: node scripts/verify-interactive-atlas-detail-v2.mjs
