name: Core flow state evaluation v1
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  validate:
    if: github.head_ref == 'agent/core-flow-state-eval-v1-validation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:product-evaluation
      - run: npm run test:core-flow-state-eval
      - run: npm run test:compatibility
      - run: npm run test:addition-intents
      - run: npm run test:livestock-recording
      - run: npm run test:atomic-livestock-addition
      - run: npm run lint
      - run: npm run build
