name: Phase1 Unresolved Livestock UI Patch

on:
  push:
    branches:
      - agent/unresolved-existing-livestock
    paths:
      - scripts/phase1-patch-unresolved-livestock-ui.mjs
      - scripts/phase1-fix-unresolved-ui-patch-anchor.mjs
      - scripts/test-unresolved-livestock-ui-contract.mjs
      - scripts/verify-unresolved-livestock-ui.mjs
      - .github/workflows/phase1-unresolved-livestock-ui-patch.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/unresolved-existing-livestock
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Disambiguate guarded patch anchor
        run: node scripts/phase1-fix-unresolved-ui-patch-anchor.mjs
      - name: Apply guarded unresolved livestock UI patch
        run: node scripts/phase1-patch-unresolved-livestock-ui.mjs
      - name: Unresolved livestock UI contract
        run: node scripts/test-unresolved-livestock-ui-contract.mjs
      - name: Unresolved existing-livestock core contract
        run: npx tsx scripts/test-unresolved-existing-livestock.ts
      - name: Livestock state surface regression
        run: npm run test:livestock-state-surface
      - name: App type check
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/aquaguide-unresolved-preview.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/aquaguide-unresolved-preview.log
          exit 1
      - name: Existing livestock drawer browser regression
        env:
          PREVIEW_URL: http://127.0.0.1:4173
        run: npm run test:livestock-state-drawer-ui
      - name: Unresolved livestock browser regression
        env:
          PREVIEW_URL: http://127.0.0.1:4173
        run: node scripts/verify-unresolved-livestock-ui.mjs
      - name: Commit verified UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Aquarium.tsx src/components/aquarium/LivestockRosterDialog.tsx
          git commit -m "Expose unresolved existing livestock in aquarium UI"
          git push origin HEAD:agent/unresolved-existing-livestock
