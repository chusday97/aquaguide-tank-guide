name: One-shot Sync PUI-BC-023 Persona Readiness

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-shot-sync-pui-bc-023-persona-ready.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch handoff from current main
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'HANDOFF-2026-08-17.md';
          let handoff = fs.readFileSync(path, 'utf8');

          const anchor = '- 当前状态严格为 **candidate_not_run**；没有新 connected execution，就不能声称 Challenge coverage PASS。';
          if (!handoff.includes(anchor)) throw new Error('PUI-BC-023 candidate_not_run anchor not found.');
          const readiness = `${anchor}\n\n### Low-patience persona Challenge — executable harness ready, not run\n\n- EvalPilot runner commit **c833a03b0c44ab331cd8e7eb1e31d5839da712a5** 已让现有 Daily runner 支持显式 \`--challenge persona\`；默认 Daily retest 路径保持兼容。\n- 手动 workflow **Connected AquaGuide Daily Persona Challenge** 已被 GitHub 注册为 active；只允许 \`workflow_dispatch\`，没有 push / schedule 自动执行。\n- workflow 默认仍 pin AquaGuide **3d73c033b6899e3a92144f6de99a05db8babde78**、DeepSeek \`deepseek-v4-flash\`、\`max_steps=12\`、screenshots=false、prerequisite remote calls=0；provider timeout 保持现有 45s，不为 Challenge 放宽。\n- 显式付费授权串：\`RUN_CONNECTED_AQUAGUIDE_DAILY_PERSONA_CHALLENGE\`。没有精确授权就必须在 remote-call gate 退出。\n- verdict contract：protocol unhealthy 才是 harness failure；healthy + trustworthy Product FAIL 是有效产品评测结果，不得误分类为 evaluator failure；只有 trustworthy PASS 才能把该 Challenge 计入 verified coverage。\n- 永久测试 commit **250d2d9c730f552ad84d1af66bafb1aa0e917c19**；CI Run **32040107854** 完整 PASS：Node 20 / Node 24 / Chromium 全绿，persona workflow test 3 / 3 PASS，Chromium real-benchmark / evaluator-regression / browser / runner / dashboard / public-example 全部实际执行。\n- 当前仍为 **ready_but_not_executed / candidate_not_run / paid calls=0**。本次 harness 准备不能被写成产品 PASS，也不能更新 PUI-BC-023 的 \`regression_verified\` badcase 状态。`;
          handoff = handoff.replace(anchor, readiness);

          const nextPattern = /^4\. \*\*PUI-BC-023[^\n]*$/m;
          const matches = handoff.match(nextPattern) ?? [];
          if (matches.length !== 1) throw new Error(`Expected one PUI-BC-023 next-step line, found ${matches.length}.`);
          handoff = handoff.replace(nextPattern, '4. **PUI-BC-023 low-patience persona Challenge 已准备好手动执行**：workflow `Connected AquaGuide Daily Persona Challenge` 已 active，EvalPilot CI `32040107854` 全绿；当前仍是 `candidate_not_run / paid calls=0`。只有用户显式授权并触发后，才读取真实 connected evidence 决定 PASS / Product FAIL / Inconclusive。');

          fs.writeFileSync(path, handoff);
          NODE

      - name: Commit handoff and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-sync-pui-bc-023-persona-ready.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add HANDOFF-2026-08-17.md .github/workflows/one-shot-sync-pui-bc-023-persona-ready.yml
          git diff --cached --check
          git commit -m 'docs: record persona Challenge readiness'
          git push origin HEAD:main
