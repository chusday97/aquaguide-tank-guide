name: Canonical Decision Integration Audit

on:
  push:
    branches:
      - integration/canonical-decision-support-audit
    paths:
      - '.github/workflows/canonical-decision-integration-audit.yml'
      - '.integration-audit/water-change.service.resolved.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-run-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/canonical-decision-support-audit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dry-run merge and resolve only audited conflicts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "integration-audit"
          git config user.email "integration-audit@users.noreply.github.com"
          git rev-parse HEAD > /tmp/integration_audit_base_head
          git fetch origin agent/quick-diagnosis-conflict-augmentation

          set +e
          git merge --no-commit --no-ff origin/agent/quick-diagnosis-conflict-augmentation
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U | sort)
            expected=(
              ".github/workflows/product-golden-path.yml"
              "src/services/aquarium/water-change.service.ts"
            )
            printf '%s\n' "${expected[@]}" | sort > /tmp/expected_conflicts
            printf '%s\n' "${conflicts[@]}" | sort > /tmp/actual_conflicts
            echo "Observed integration conflicts:"
            cat /tmp/actual_conflicts
            if ! diff -u /tmp/expected_conflicts /tmp/actual_conflicts; then
              echo "Unexpected conflict set; audit refuses to guess a resolution."
              exit 1
            fi

            # Product Golden Path is CI orchestration rather than runtime code.
            # Keep the canonical-stack version inside this disposable merge and
            # run the decision-stack gates explicitly below.
            git checkout --ours .github/workflows/product-golden-path.yml

            # Runtime water-change conflict has an audited semantic-union template:
            # canonical care-event hydration + future/invalid date normalization.
            cp .integration-audit/water-change.service.resolved.ts src/services/aquarium/water-change.service.ts
            git add .github/workflows/product-golden-path.yml src/services/aquarium/water-change.service.ts
          fi

          remaining_conflicts="$(git diff --name-only --diff-filter=U)"
          if [ -n "$remaining_conflicts" ]; then
            echo "Unresolved conflicts remain:"
            printf '%s\n' "$remaining_conflicts"
            exit 1
          fi

          test -f .git/MERGE_HEAD
          echo "Dry-run merge tree resolved locally. No merge commit will be created or pushed."
          git status --short

      - name: Install merged-tree dependencies
        run: npm ci

      - name: Canonical water-change repository boundary
        run: node --import tsx scripts/test-water-change-repository-boundary.ts

      - name: Future-date water-change regression
        run: node --import tsx scripts/test-water-change-history.ts

      - name: Unresolved livestock contract on merged tree
        run: node --import tsx scripts/test-unresolved-existing-livestock.ts

      - name: Livestock recording regression on merged tree
        run: node --import tsx scripts/test-livestock-recording.ts

      - name: Tank decision context on merged tree
        run: node --import tsx scripts/test-tank-decision-context.ts

      - name: Decision support orchestration on merged tree
        run: node --import tsx scripts/test-tank-decision-support-orchestrator.ts

      - name: Quick Diagnosis augmentation on merged tree
        run: node --import tsx scripts/test-quick-diagnosis-conflict-augmentation.ts

      - name: Reviewed severe-risk regression on merged tree
        run: node --import tsx scripts/test-reviewed-severe-risk-regression.ts

      - name: Type check merged tree
        run: npm run lint

      - name: Production build merged tree
        run: npm run build

      - name: Confirm audit did not create a merge commit
        shell: bash
        run: |
          set -euo pipefail
          test -f .git/MERGE_HEAD
          test "$(git rev-parse HEAD)" = "$(cat /tmp/integration_audit_base_head)"
          echo "Merge remained uncommitted inside the disposable runner as intended."
