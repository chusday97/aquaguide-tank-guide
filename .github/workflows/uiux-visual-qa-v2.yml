name: UI UX Visual QA V2

on:
  pull_request:
    branches: [integration/aquaguide-rc1, main]
    paths:
      - 'src/**'
      - 'components/**'
      - 'scripts/capture-uiux-visual-baseline.mjs'
      - '.github/workflows/uiux-visual-qa-v2.yml'

permissions:
  contents: read

jobs:
  visual-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install CJK snapshot font
        run: |
          timeout 120s sudo apt-get update
          timeout 120s sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-match 'Noto Sans CJK SC'
      - name: Type check
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/aquaguide-uiux-visual.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/aquaguide-uiux-visual.log
          exit 1
      - name: Capture cross-surface visual baseline
        env:
          PREVIEW_URL: http://127.0.0.1:4173
        run: node scripts/capture-uiux-visual-baseline.mjs
      - name: Upload visual baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aquaguide-uiux-visual-baseline-v2
          path: artifacts/uiux-visual-baseline/**
          if-no-files-found: error
          retention-days: 7
