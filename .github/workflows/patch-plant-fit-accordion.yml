name: Patch Plant Fit Accordion

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/patch-plant-fit-accordion.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/environment-decision-v1
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Hide legacy fish-fit explanation from plants
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/SpeciesDetailDialog.tsx')
          source = path.read_text()

          container_marker = '<div className="mt-4 grid gap-2" data-species-detail-sections>'
          container_index = source.index(container_marker)
          fit_section_start = source.index('                    <section', container_index)
          compatibility_guard = "                    {!isPlant && (\n                    <section"
          compatibility_index = source.index(compatibility_guard, fit_section_start)
          fit_block = source[fit_section_start:compatibility_index]

          if fit_block.lstrip().startswith('{!isPlant && ('):
              print('fit accordion already guarded')
              raise SystemExit(0)

          wrapped = "                    {!isPlant && (\n" + fit_block + "                    )}\n\n"
          source = source[:fit_section_start] + wrapped + source[compatibility_index:]
          path.write_text(source)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Care boundary regression
        run: node scripts/test-species-detail-care-boundary.mjs

      - name: Typecheck
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Commit patch and remove one-shot workflow
        run: |
          rm .github/workflows/patch-plant-fit-accordion.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/SpeciesDetailDialog.tsx .github/workflows/patch-plant-fit-accordion.yml
          git commit -m "Hide legacy fish fit accordion for plants"
          git push origin HEAD:agent/environment-decision-v1
