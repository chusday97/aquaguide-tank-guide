name: RC1 Integrate Search Show All

on:
  push:
    branches:
      - integration/aquaguide-rc1

permissions:
  contents: write

jobs:
  integrate-search-show-all:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RC1
        uses: actions/checkout@v4
        with:
          ref: integration/aquaguide-rc1
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply Search show-all behavior
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_BRANCH=agent/functional-cta-search-show-all
          git fetch origin "$SOURCE_BRANCH"
          SOURCE_HEAD="$(git rev-parse FETCH_HEAD)"

          if grep -q 'const \[showAllSpecies, setShowAllSpecies\]' src/pages/Search.tsx \
             && test -f scripts/verify-search-and-inline-filter.mjs \
             && grep -q '"id":"PUI-BC-033"' evaluation/product/badcases.v1.jsonl; then
            echo 'Search show-all already integrated; validating existing RC1 state.'
            exit 0
          fi

          git show "$SOURCE_HEAD:scripts/verify-search-and-inline-filter.mjs" > scripts/verify-search-and-inline-filter.mjs
          git show "$SOURCE_HEAD:HANDOFF-2026-08-18.md" > HANDOFF-2026-08-18-PUI-BC-033.md

          python - <<'PY'
          from pathlib import Path
          import subprocess

          path = Path('src/pages/Search.tsx')
          source = path.read_text()

          def replace_once(before: str, after: str, label: str):
              global source
              count = source.count(before)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one anchor, found {count}')
              source = source.replace(before, after, 1)

          replace_once(
              "const originalValue = (record: object, key: string) => String((record as Record<string, unknown>)[key] ?? '');\n\nexport default function SearchPage() {",
              """const originalValue = (record: object, key: string) => String((record as Record<string, unknown>)[key] ?? '');
const getSpeciesSearchResults = (value: string) => {
  const normalizedQuery = normalize(value);
  if (!normalizedQuery) return [];
  return fishData.filter(fish => normalize([
    fish.name,
    fish.scientificName,
    fish.category,
    fish.description,
    originalValue(fish, '_originalName'),
    originalValue(fish, '_originalCategory'),
    originalValue(fish, '_originalDescription'),
    englishTranslations[fish.id]?.name,
    englishTranslations[fish.id]?.description,
    autoTranslations[fish.id]?.name,
    autoTranslations[fish.id]?.description,
  ].join(' ')).includes(normalizedQuery));
};

export default function SearchPage() {""",
              'shared species search matcher',
          )
          replace_once(
              "  const [selectedSpecies, setSelectedSpecies] = useState<SearchSuggestion | null>(null);\n  const normalizedQuery = normalize(query);",
              "  const [selectedSpecies, setSelectedSpecies] = useState<SearchSuggestion | null>(null);\n  const [showAllSpecies, setShowAllSpecies] = useState(false);\n  const normalizedQuery = normalize(query);",
              'show-all state',
          )
          replace_once(
              "  }), [draft, isEn, ownedQuantityBySpeciesId]);\n\n  useEffect(() => {",
              "  }), [draft, isEn, ownedQuantityBySpeciesId]);\n  const draftSpeciesMatchCount = useMemo(() => getSpeciesSearchResults(draft).length, [draft]);\n\n  useEffect(() => {",
              'draft match count',
          )
          old_results = """  const allSpeciesResults = useMemo(() => normalizedQuery
    ? fishData.filter(fish => normalize([
      fish.name,
      fish.scientificName,
      fish.category,
      fish.description,
      originalValue(fish, '_originalName'),
      originalValue(fish, '_originalCategory'),
      originalValue(fish, '_originalDescription'),
      englishTranslations[fish.id]?.name,
      englishTranslations[fish.id]?.description,
      autoTranslations[fish.id]?.name,
      autoTranslations[fish.id]?.description,
    ].join(' ')).includes(normalizedQuery))
    : [], [normalizedQuery]);
  const speciesResults = allSpeciesResults.slice(0, 18);"""
          replace_once(
              old_results,
              """  const allSpeciesResults = useMemo(() => getSpeciesSearchResults(query), [query]);
  const speciesResults = showAllSpecies ? allSpeciesResults : allSpeciesResults.slice(0, 18);""",
              'species results expansion',
          )
          replace_once(
              """  const submit = (event: FormEvent) => {
    event.preventDefault();
    const next = draft.trim();
    setSearchParams(next ? { q: next } : {});
  };""",
              """  const submit = (event: FormEvent) => {
    event.preventDefault();
    const next = draft.trim();
    setShowAllSpecies(false);
    setSearchParams(next ? { q: next } : {});
  };""",
              'submit reset',
          )
          replace_once(
              """  const submitValue = (value: string) => {
    const next = value.trim();
    setSearchParams(next ? { q: next } : {});
  };

  const selectSuggestion""",
              """  const submitValue = (value: string) => {
    const next = value.trim();
    setShowAllSpecies(false);
    setSearchParams(next ? { q: next } : {});
  };

  const showAllSpeciesResults = () => {
    const next = draft.trim();
    if (!next) return;
    setSearchParams({ q: next });
    setShowAllSpecies(true);
  };

  const selectSuggestion""",
              'show-all handler',
          )
          replace_once(
              "          totalSpeciesMatches={suggestionResult.totalSpeciesMatches}",
              "          totalSpeciesMatches={draftSpeciesMatchCount}",
              'shared advertised count',
          )
          replace_once(
              """          onValueChange={value => {
            setDraft(value);
            setSelectedSpecies(null);
          }}""",
              """          onValueChange={value => {
            setDraft(value);
            setSelectedSpecies(null);
            setShowAllSpecies(false);
          }}""",
              'editing resets show-all',
          )
          replace_once(
              "          onViewAllSpecies={() => submitValue(draft)}",
              "          onViewAllSpecies={showAllSpeciesResults}",
              'real show-all action',
          )
          path.write_text(source)

          badcases = Path('evaluation/product/badcases.v1.jsonl')
          current = badcases.read_text()
          if '"id":"PUI-BC-033"' not in current:
              upstream = subprocess.check_output(['git','show','FETCH_HEAD:evaluation/product/badcases.v1.jsonl'], text=True)
              matches = [line for line in upstream.splitlines() if '"id":"PUI-BC-033"' in line]
              if len(matches) != 1:
                  raise SystemExit(f'expected exactly one PUI-BC-033 source line, found {len(matches)}')
              badcases.write_text(current.rstrip('\n') + '\n' + matches[0] + '\n')
          PY

      - name: Validate Search behavior with RC1
        run: |
          npm run test:product-evaluation
          node scripts/test-aquarium-delete-repository-contract.mjs
          node scripts/test-aquarium-settings-repository-contract.mjs
          node scripts/test-water-change-cloud-persistence-contract.mjs
          node scripts/test-data-storage-repository-mode-contract.mjs
          node scripts/test-ui-interaction-repair-v1.mjs
          node scripts/verify-ui-v2-dashboard-ia.mjs
          npm run lint
          npm run build

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/aquaguide-search-rc1-preview.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/search >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/aquaguide-search-rc1-preview.log
          exit 1

      - name: Search show-all browser regression
        env:
          PREVIEW_URL: http://127.0.0.1:4173
          SEARCH_UI_GROUP: entries
        run: node scripts/verify-search-and-inline-filter.mjs

      - name: Commit RC1 Search show-all integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Search.tsx scripts/verify-search-and-inline-filter.mjs evaluation/product/badcases.v1.jsonl HANDOFF-2026-08-18-PUI-BC-033.md
          if git diff --cached --quiet; then
            echo "No Search product changes to commit."
            exit 0
          fi
          git commit -m "Integrate Search show-all behavior into RC1"
          git pull --rebase origin integration/aquaguide-rc1
          git push origin HEAD:integration/aquaguide-rc1
