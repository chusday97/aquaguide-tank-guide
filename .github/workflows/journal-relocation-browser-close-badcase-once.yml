name: Journal Relocation Browser Close Badcase Once

on:
  push:
    branches:
      - agent/relocation-confirmation-surface
    paths:
      - '.github/workflows/journal-relocation-browser-close-badcase-once.yml'

permissions:
  contents: write

jobs:
  journal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/relocation-confirmation-surface
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Append browser locator badcase and handoff
        shell: bash
        run: |
          cat >> evaluation/product/badcases.v1.jsonl <<'EOF'
          {"id":"PUI-BC-026","featureId":"compatibility","discoveredAt":"2026-08-17","source":"browser_golden_path","severity":"medium","symptom":"Care relocation 浏览器 Golden Path 在成功迁移后的收尾关闭步骤失败：文本 locator `button` + /^关闭$/ 同时匹配页脚业务按钮和 Radix Dialog 自带 Close，Playwright strict mode 拒绝点击。","trigger":"GP-REL-01/02 已完成一次成功迁移并显示 completed 状态后，测试按中文文本查找关闭按钮。","expected":"业务页脚关闭动作具有稳定、唯一、语义明确的 data locator；浏览器验收不依赖框架内部同名 Close，也不使用 `.first()` 隐式选择。","actual":"最新 canonical head `7e21632a...` 的 run 31994745260 在迁移成功后因 2 个 `关闭` 按钮定位歧义失败；日志确认 mutation/canonical success 已先发生，失败属于 browser-test locator 层。","rootCauseLayer":"browser_test_locator","status":"open","regression":"Care relocation browser Golden Path + confirmation surface static contract"}
          EOF
          cat >> HANDOFF.md <<'EOF'

          ## 2026-08-17 Care relocation browser acceptance — checkpoint 6

          - 最新 canonical Care branch `7e21632a...` 的 module/controller gate 已通过 controller、fresh policy、mutation uncertainty、confirmation surface、#65 entrypoint、TypeScript、API TypeScript 与 production build。
          - 真实浏览器 run `31994745260` 仍为红，但失败点发生在 GP-REL-01/02 **成功迁移之后**：测试用 `button` + `/^关闭$/` 同时匹配页脚“关闭”和 Radix Dialog 内建 Close，Playwright strict mode 报 2 elements。
          - 新登记 `PUI-BC-026`，状态 `open`。这是 browser-test locator 歧义，不是 mutation/fresh gate/canonical refresh 失败；但 browser acceptance 未全绿前，PUI-BC-025 仍不能标记收敛完成。
          - 修复原则：给页脚业务关闭按钮增加专用 `data-close-relocation-confirmation="true"`，browser test 只点击该 locator；禁止用 `.first()` / nth 猜按钮，避免未来 UI DOM 变化掩盖错误。
          EOF
      - name: Validate product registry
        run: npm run test:product-evaluation
      - name: Commit journal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HANDOFF.md evaluation/product/badcases.v1.jsonl
          git commit -m "Journal relocation browser close locator badcase"
          git push origin HEAD:agent/relocation-confirmation-surface
