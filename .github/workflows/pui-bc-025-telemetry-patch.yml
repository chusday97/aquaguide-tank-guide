name: PUI-BC-025 Telemetry One-Shot Patch

on:
  push:
    branches: [agent/compatibility-pair-telemetry]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/compatibility-pair-telemetry
          fetch-depth: 1
      - name: Patch Badcase and validate JSONL
        run: node scripts/patch-pui-bc-025-telemetry.mjs
      - name: Commit Badcase update and self-delete tooling
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add evaluation/product/badcases.v1.jsonl scripts/patch-pui-bc-025-telemetry.mjs .github/workflows/pui-bc-025-telemetry-patch.yml
          git diff --cached --exit-code && { echo 'No Badcase patch produced'; exit 1; } || true
          git commit -m "Update PUI-BC-025 usage-prioritization evidence"
          git push origin HEAD:agent/compatibility-pair-telemetry
