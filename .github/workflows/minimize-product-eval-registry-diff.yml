name: Minimize product eval registry diff

on:
  push:
    branches:
      - agent/product-eval-registry-drift-fix

permissions:
  contents: write

jobs:
  minimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch main baseline
        run: git fetch origin main:refs/remotes/origin/main --depth=1
      - name: Rebuild compact registry diff
        run: node scripts/minimize-product-eval-registry-diff.mjs
      - name: Validate product evaluation registry
        run: node scripts/test-product-evaluation.mjs
      - name: Validate diff
        run: git diff --check
      - name: Commit minimized registry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evaluation/product/feature-states.v1.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "eval: minimize product registry state diff"
          git push
