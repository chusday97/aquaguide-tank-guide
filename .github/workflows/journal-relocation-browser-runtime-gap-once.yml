name: Journal Relocation Browser Runtime Gap Once

on:
  push:
    branches:
      - agent/canonical-care-relocation-wiring
    paths:
      - '.github/workflows/journal-relocation-browser-runtime-gap-once.yml'

permissions:
  contents: write

jobs:
  journal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/canonical-care-relocation-wiring
      - name: Persist latest browser and TypeScript evidence
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          fs.appendFileSync('HANDOFF.md', [
            '',
            '## 2026-08-17 Relocation topology convergence — checkpoint 8',
            '',
            '- Latest real Chromium run `31995177363` on head `a515736...` passed the permanent close-locator uniqueness gate, GP-REL-01/02 success flow, and GP-REL-03 stale-destination blocking.',
            '- GP-REL-04 failed with `Escape must not dismiss uncertain dialog`: the confirmation surface was already marked `data-relocation-close-locked=true`, yet Escape detached it before canonical reconciliation. This is a distinct runtime lifecycle defect, not the earlier text-locator ambiguity.',
            '- `PUI-BC-026` locator ambiguity is therefore regression-verified as a subproblem, while the full browser suite remains blocked by new `PUI-BC-028`.',
            '- A guarded repair attempt (`31995381732`) proved the new blank-operation-id regression fails on the old controller and passes after adding a synchronous non-empty operation identity guard. However the same runner was stopped by TypeScript before commit because this project\'s `DialogContent` exposes `DialogPopupProps`, which does not accept the assumed Radix `onEscapeKeyDown` prop.',
            '- Consequently the operation-id and uncertain-dialog product patches from that runner are **not committed**. `PUI-BC-027` has fail-before-fix + runner-only post-fix evidence but remains pending a type-correct committed implementation; `PUI-BC-028` remains open.',
            '- Next step is to inspect the project\'s actual Dialog implementation / underlying UI library and fix close locking with supported lifecycle primitives, then rerun controller/static/type/build and the real Chromium GP-REL-04/05 path.',
            '',
          ].join('\n'));

          const path = 'evaluation/product/badcases.v1.jsonl';
          const lines = fs.readFileSync(path, 'utf8').trimEnd().split('\n');
          let has028 = false;
          const updated = lines.map(line => {
            const item = JSON.parse(line);
            if (item.id === 'PUI-BC-026') {
              return JSON.stringify({
                ...item,
                actual: '永久 close-locator uniqueness gate 在 Chromium run 31995177363 通过；同一 run 继续通过 GP-REL-01/02 与 GP-REL-03。后续失败属于独立的 uncertain-dialog Escape 生命周期问题 PUI-BC-028，而不是 locator 歧义。',
                status: 'locator_regression_verified',
                verification: 'run 31995177363: close-locator uniqueness + GP-REL-01/02 + GP-REL-03 passed',
              });
            }
            if (item.id === 'PUI-BC-027') {
              return JSON.stringify({
                ...item,
                actual: 'run 31995381732 已证明 blank operationId regression 在旧 controller 上先失败，并在 runner-only guard 后通过；但同一 workflow 随后被 Dialog TypeScript 错误阻断，最终 commit 未发生，因此主分支仍未获得该修复。',
                status: 'fix_validated_in_runner_not_committed',
              });
            }
            if (item.id === 'PUI-BC-028') has028 = true;
            return line;
          });
          if (!has028) {
            updated.push(JSON.stringify({
              id: 'PUI-BC-028',
              featureId: 'compatibility',
              discoveredAt: '2026-08-17',
              source: 'browser_golden_path',
              severity: 'critical',
              symptom: '迁移处于 mutation_state_unknown / reconciliation-required 时，确认层已经显示 close-locked，但按 Escape 仍会卸载 Dialog，可能丢失原 operationId/controller 上下文并形成盲重试风险。',
              trigger: 'GP-REL-04 强制本地持久化异常进入不确定态后，在 canonical reconcile 前按 Escape；overlay dismiss 同属必须核验的关闭向量。',
              expected: 'reconciliation-required 时所有 dismiss 向量都受同一 canClose predicate 控制；只有 canonical reconcile 成功后才能 Escape/overlay/footer close。',
              actual: 'Chromium run 31995177363 中 data-relocation-close-locked=true 后按 Escape，Dialog 仍 detached。仅在 Dialog.onOpenChange 拒绝 close 不足以保证当前 UI 库/嵌套 Dialog 生命周期不会卸载确认层。',
              rootCauseLayer: 'ui_modal_lifecycle_and_operation_identity',
              status: 'open',
              regression: 'Care relocation Chromium GP-REL-04 Escape + overlay + reconcile unlock; supported Dialog lifecycle static/type contract',
            }));
          }
          fs.writeFileSync(path, `${updated.join('\n')}\n`);
          NODE
      - name: Remove one-shot workflow
        run: rm .github/workflows/journal-relocation-browser-runtime-gap-once.yml
      - name: Commit journal update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HANDOFF.md evaluation/product/badcases.v1.jsonl .github/workflows/journal-relocation-browser-runtime-gap-once.yml
          git commit -m "Journal relocation browser runtime gap"
          git push origin HEAD:agent/canonical-care-relocation-wiring
