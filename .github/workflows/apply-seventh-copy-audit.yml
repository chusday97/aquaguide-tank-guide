name: Apply Seventh UI Copy Audit

on:
  push:
    branches:
      - agent/seventh-copy-audit

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/seventh-copy-audit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply approved copy changes
        run: node scripts/apply-seventh-copy-audit.mjs
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Copy regression checks
        shell: bash
        run: |
          set -euo pipefail
          ! grep -nE '自然水族册|未匹配生物|已复盘|待补充原因' src/pages/CollectionHub.tsx
          ! grep -nE '自动解锁与下一步|喚养|喚食|骨灰级' src/i18n/index.ts
          ! grep -n 'identify.match.' src/pages/Identify.tsx
          ! grep -nE 'AI 正在为您分析|输入您的问题|const SUGGESTED_QUESTIONS =|>发送<|>清空<' src/pages/AIAssistant.tsx
          ! grep -n 'AquaGuide</div>' src/components/visual-result/VisualResultCard.tsx
          echo 'Seventh-copy regression checks passed.'
      - name: Remove one-time migration files
        run: rm -f scripts/apply-seventh-copy-audit.mjs .github/workflows/apply-seventh-copy-audit.yml
      - name: Commit product changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "refactor(ui): apply seventh copy audit"
            git push origin HEAD:agent/seventh-copy-audit
          fi

