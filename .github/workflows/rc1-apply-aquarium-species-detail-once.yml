name: RC1 Apply Aquarium Species Detail Once

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'integration/aquaguide-rc1'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout RC1 branch
        uses: actions/checkout@v4
        with:
          ref: integration/aquaguide-rc1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Apply exact-anchor species detail repair
        run: node scripts/apply-rc1-aquarium-species-detail-v1.mjs

      - name: Species detail source contract
        run: node scripts/test-aquarium-species-detail-surface-contract.mjs

      - name: Existing UI contracts
        run: |
          node scripts/test-ui-interaction-repair-v1.mjs
          node scripts/test-ui-modal-surface-contract.mjs

      - name: Type check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Start preview
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/aquaguide-species-detail-preview.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/aquarium >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/aquaguide-species-detail-preview.log
          exit 1

      - name: Aquarium modal/detail browser regression
        env:
          PREVIEW_URL: http://127.0.0.1:4173
        run: node scripts/verify-ui-modal-surface-browser.mjs

      - name: Commit repaired Aquarium source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Aquarium.tsx
          if git diff --cached --quiet; then
            echo "No Aquarium species detail changes to commit."
            exit 0
          fi
          git commit -m "Restore Aquarium species detail surface"
          git push origin HEAD:integration/aquaguide-rc1
