name: Journal Relocation Topology Once

on:
  push:
    branches:
      - agent/relocation-confirmation-surface
    paths:
      - '.github/workflows/journal-relocation-topology-once.yml'

permissions:
  contents: write

jobs:
  journal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/relocation-confirmation-surface
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Append topology badcase and handoff
        shell: bash
        run: |
          cat >> evaluation/product/badcases.v1.jsonl <<'EOF'
          {"id":"PUI-BC-025","featureId":"compatibility","discoveredAt":"2026-08-17","source":"branch_topology_audit","severity":"high","symptom":"#64 最新分支和既有 #65/canonical Care 分支同时存在两套 canonical-species → factual record/batch 映射逻辑；若二者继续独立演进，CTA 可见性、batch fail-close、operationId 生命周期和 destination gate 可能产生行为漂移。","trigger":"一条路径使用 #64 buildRelocationConfirmationRequest，另一条路径使用 #65 buildRelocationConfirmationEntrypoint + Care controller；后续规则只修其中一边。","expected":"选择唯一 source-scope entrypoint 主线；保留一个 formal-option/source-record/batch/destination gate，operationId 与 repository fresh-load 放在单独 controller；任何冗余 mapper 在确认覆盖与回归后再移除或降级为内部复用，不允许两套独立授权语义长期共存。","actual":"已确认 #65 entrypoint 比 #64 request-builder 覆盖更完整：它同时校验 formal option、source decision context、唯一 factual record/batch 和 destination formal verdict；canonical Care controller 负责稳定 operationId + repository getAquariums + executeFreshRelocation 注入。尚未完成最新 #64 与 canonical 分支的 convergence regression，因此暂不删除任一实现。","rootCauseLayer":"branch_topology_and_duplicate_policy","status":"open","regression":"canonical relocation topology convergence audit + PUI-BC-023/024 regressions + Care controller/browser Golden Path"}
          EOF
          cat >> HANDOFF.md <<'EOF'

          ## 2026-08-17 Relocation topology convergence — checkpoint 5

          - 发现已有 Draft #65 `agent/relocation-confirmation-entrypoint` 与更后续的 `agent/canonical-care-relocation-wiring`。因此停止在 #64 上继续平行堆 Care executable wiring。
          - #65 `buildRelocationConfirmationEntrypoint(...)` 的 source-scope gate 比 #64 新 request-builder 更完整：除唯一 record/batch/quantity 外，还绑定 formal option、decision source aquarium、formal destination result 和 `compatible_by_current_evidence` opener gate；candidate 不携带 cached verdict / allowed / operationId。
          - `agent/canonical-care-relocation-wiring` 已有 `createCareRelocationConfirmationController(...)`：在 open-confirmation event 创建稳定 operationId；同一 repository 实例提供 pre/post `getAquariums()`、relocate callback 与 reconcile；实际 mutation 仍只能进入 #63 `executeFreshRelocation()`。
          - 新登记 `PUI-BC-025`：禁止 #64 request-builder 与 #65 entrypoint 长期作为两套独立 source-scope 策略并行演进。状态先保持 `open`。
          - 下一步不是删除代码，而是 convergence audit：证明 #65 + canonical controller 覆盖 PUI-BC-023/024 的全部 fail-closed case，并在当前 head 跑 Care relocation browser Golden Path；只有全部通过后才决定冗余 mapper 的收敛方式。
          - 现有 canonical browser workflow 历史最后一次自动 run 是失败状态；随后已有 `Disambiguate browser confirmation Close action` 修复，但该 bot push 未自动触发新 run。因此必须对最新 head 重新执行 browser acceptance，不能引用旧 green/旧 failure 代替。
          EOF
      - name: Validate product registry
        run: npm run test:product-evaluation
      - name: Commit journal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HANDOFF.md evaluation/product/badcases.v1.jsonl
          git commit -m "Journal relocation topology convergence risk"
          git push origin HEAD:agent/relocation-confirmation-surface
