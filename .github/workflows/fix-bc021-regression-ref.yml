name: Fix BC-021 regression reference

on:
  push:
    branches:
      - agent/golden-path-e2e-v1

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/fix-bc021-regression-ref.mjs
      - run: git diff --check
      - name: Commit badcase reference
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evaluation/product/badcases.v1.jsonl
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "eval: use durable regression reference for BC-021"
          git push
