name: Apply Third UI Copy Audit

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply approved copy audit
        run: node scripts/apply-third-copy-audit.mjs
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Remove one-time migration files
        run: rm -f scripts/apply-third-copy-audit.mjs .github/workflows/apply-third-copy-audit.yml .third-copy-audit-trigger
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "refactor(ui): apply third copy audit"
            if [ -n "${{ github.event.pull_request.head.ref }}" ]; then
              git push origin HEAD:${{ github.event.pull_request.head.ref }}
            else
              git push
            fi
          fi
