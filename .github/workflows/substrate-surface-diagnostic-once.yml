name: Substrate Surface Diagnostic Once

on:
  push:
    branches:
      - agent/substrate-surface-v1

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Substrate source contract
        run: node scripts/verify-substrate-surface-v1.mjs

      - name: Settings persistence contract
        run: node scripts/test-aquarium-settings-repository-contract.mjs

      - name: Type check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/aquaguide-substrate.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/aquaguide-substrate.log
          exit 1

      - name: Browser save-to-3D regression
        env:
          PREVIEW_URL: http://127.0.0.1:4173
        run: node scripts/verify-substrate-surface-browser.mjs

      - name: Record passing evidence and remove diagnostic
        run: |
          mkdir -p artifacts/substrate-surface
          cat > artifacts/substrate-surface/README.md <<EOF
          # Substrate Surface V1 evidence

          Run: ${GITHUB_RUN_ID}
          Commit tested: ${GITHUB_SHA}

          PASS:
          - substrate surface source contract
          - aquarium settings repository contract
          - TypeScript
          - production build
          - Chromium save-to-3D browser regression
          - bare bottom renders as none
          - selecting and saving 黑金沙 persists and becomes the 3D renderer substrate
          EOF
          rm .github/workflows/substrate-surface-diagnostic-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/substrate-surface/README.md .github/workflows/substrate-surface-diagnostic-once.yml
          git commit -m "Record substrate surface browser evidence"
          git push origin HEAD:agent/substrate-surface-v1
