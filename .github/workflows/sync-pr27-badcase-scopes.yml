name: Sync PR27 badcase scopes

on:
  push:
    branches:
      - agent/golden-path-e2e-v1

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/sync-pr27-badcase-scopes.mjs
      - run: node scripts/test-product-evaluation.mjs || true
      - run: git diff --check
      - name: Commit scope sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evaluation/product/badcases.v1.jsonl
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "eval: sync PR27 badcase feature scopes"
          git push
