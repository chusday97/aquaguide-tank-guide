name: Apply Aquarium Delete Repository Patch

on:
  push:
    branches: [agent/fix-aquarium-completion-state]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-aquarium-completion-state
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact deletion patch
        run: node scripts/patch-aquarium-delete-repository.mjs
      - name: Validate patch shape
        run: |
          git diff --check
          grep -q "async deleteAquarium(aquariumId: string)" src/services/repository/local-aquaguide.repository.ts
          grep -q "aquarium-delete:\${aquariumId}:v\${version}" src/services/repository/api-aquaguide.repository.ts
          grep -q "await repository.deleteAquarium(aquariumId);" src/pages/Aquarium.tsx
          ! grep -A12 "const confirmDeleteAquarium" src/pages/Aquarium.tsx | grep -q "saveAquariums(updated)"
      - name: Commit deletion patch and remove temporary tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/repository/local-aquaguide.repository.ts src/services/repository/api-aquaguide.repository.ts src/pages/Aquarium.tsx
          git rm scripts/patch-aquarium-delete-repository.mjs .github/workflows/apply-aquarium-delete-repository.yml
          git commit -m "fix: delete aquariums through repository"
          git push origin HEAD:agent/fix-aquarium-completion-state
