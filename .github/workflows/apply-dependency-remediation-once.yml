name: Apply Dependency Remediation Once

on:
  pull_request:
    branches:
      - agent/uiux-system-refactor-v1

permissions:
  contents: write

concurrency:
  group: aquaguide-dependency-remediation-once
  cancel-in-progress: false

jobs:
  apply:
    if: github.repository == 'chusday97/aquaguide-tank-guide' && github.event.pull_request.head.ref == 'agent/result-ux-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/result-ux-v1
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify expected remediation ancestry
        run: git merge-base --is-ancestor 7297a455c791534dfdf142c87c84d6221c5b048c HEAD

      - name: Reproduce validated remediation
        run: |
          node scripts/prepare-dependency-remediation.mjs
          npm install --package-lock-only --ignore-scripts
          npm update dompurify --package-lock-only --ignore-scripts

      - name: Validate install, types and build
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Require zero production audit findings
        shell: bash
        run: |
          npm audit --omit=dev --json > /tmp/npm-audit-prod.json
          node - <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('/tmp/npm-audit-prod.json', 'utf8'));
          const total = audit?.metadata?.vulnerabilities?.total;
          if (total !== 0) {
            console.error(`Expected zero production audit findings, got ${total}`);
            process.exit(1);
          }
          console.log('Production dependency audit: 0 findings');
          NODE

      - name: Commit validated dependency baseline and self-remove
        shell: bash
        run: |
          git config user.name 'aquaguide-release-baseline-bot'
          git config user.email 'aquaguide-release-baseline-bot@users.noreply.github.com'
          git add package.json apps/api/package.json package-lock.json
          git rm .github/workflows/apply-dependency-remediation-once.yml
          git diff --cached --stat
          git commit -m 'Land production dependency remediation baseline'
          git push origin HEAD:agent/result-ux-v1
