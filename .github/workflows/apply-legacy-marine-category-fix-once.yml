name: Apply Legacy Marine Category Fix Once

on:
  push:
    branches:
      - agent/fix-legacy-marine-category-contradictions
    paths:
      - '.github/workflows/apply-legacy-marine-category-fix-once.yml'

permissions:
  contents: write

jobs:
  patch-verify-and-self-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-legacy-marine-category-contradictions
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply exact legacy category fix
        run: node scripts/apply-legacy-marine-category-fix.mjs
      - name: Tanganyika legacy category regression
        run: node --import tsx scripts/test-legacy-marine-category-contradictions.ts
      - name: Water ambiguity regression
        run: node --import tsx scripts/test-species-water-type-ambiguity.ts
      - name: Taxonomy regression
        run: node --import tsx scripts/assert_taxonomy_rules.ts
      - name: Catalog grounding regression
        run: npx tsx scripts/test-catalog-grounding-contract.ts
      - name: Lionfish reviewed evidence regression
        run: node --import tsx scripts/test-lionfish-reviewed-evidence.ts
      - name: Reviewed severe-risk regression
        run: node --import tsx scripts/test-reviewed-severe-risk-regression.ts
      - name: Type check
        run: npm run lint
      - name: Commit verified data/evidence fix and remove write tooling
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/fishData.ts src/modules/species/speciesWaterEvidence.ts
          git rm scripts/apply-legacy-marine-category-fix.mjs
          git rm .github/workflows/apply-legacy-marine-category-fix-once.yml
          git commit -m "Fix stale marine categories for Tanganyika cichlids"
          git push origin HEAD:agent/fix-legacy-marine-category-contradictions
