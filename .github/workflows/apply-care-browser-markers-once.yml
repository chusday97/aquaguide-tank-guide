name: Apply Care Browser Markers Once

on:
  push:
    branches:
      - agent/canonical-care-relocation-wiring
    paths:
      - '.github/workflows/apply-care-browser-markers-once.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/canonical-care-relocation-wiring
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Confirm marker verifier fails before patch
        shell: bash
        run: |
          set +e
          node scripts/verify-care-browser-markers.mjs
          status=$?
          set -e
          test "$status" -ne 0
      - name: Apply exact-anchor browser marker patch
        run: node scripts/apply-care-browser-markers-once.mjs
      - name: Browser marker static contract
        run: node scripts/verify-care-browser-markers.mjs
      - name: Care hydration regression
        run: node --import tsx scripts/test-care-aquarium-hydration.ts
      - name: Care relocation wiring static contract
        run: node scripts/verify-care-relocation-confirmation-wiring.mjs
      - name: App TypeScript
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Remove one-shot marker tooling
        run: rm .github/workflows/apply-care-browser-markers-once.yml scripts/apply-care-browser-markers-once.mjs
      - name: Commit verified browser markers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No marker changes to commit"; exit 1; }
          git commit -m "Add stable Care diagnosis selectors for browser acceptance"
          git push origin HEAD:agent/canonical-care-relocation-wiring
