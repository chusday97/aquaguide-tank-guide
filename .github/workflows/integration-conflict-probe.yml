name: Aquarium Persistence Integration Probe

on:
  pull_request:
    branches:
      - integration/aquarium-persistence-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-settings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Probe source merge conflicts
        shell: bash
        run: |
          set +e
          git config user.name "aquaguide-integration-probe"
          git config user.email "integration-probe@users.noreply.github.com"
          git fetch origin "${GITHUB_HEAD_REF}"
          git checkout "${GITHUB_BASE_REF}"
          git merge --no-commit --no-ff "origin/${GITHUB_HEAD_REF}"
          status=$?
          echo "merge_exit=$status"
          echo "unmerged_files:"
          git diff --name-only --diff-filter=U
          echo "conflict_markers:"
          git diff --cc -- src/pages/Aquarium.tsx .github/workflows/product-golden-path.yml evaluation/product/badcases.v1.jsonl || true
          git merge --abort >/dev/null 2>&1 || true
          exit $status
