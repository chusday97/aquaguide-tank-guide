name: Fix Relocation Escape Capture Once

on:
  push:
    branches:
      - agent/canonical-care-relocation-wiring
    paths:
      - '.github/workflows/fix-relocation-escape-capture-once.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/canonical-care-relocation-wiring
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply locked Escape capture and journal checkpoint
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const dialogPath = 'src/components/compatibility/RelocationConfirmationDialog.tsx';
          let dialog = fs.readFileSync(dialogPath, 'utf8');
          const anchor = `  const canClose = !checking && !reconciling && !reconciliationRequired;\n\n  return (`;
          const replacement = `  const canClose = !checking && !reconciling && !reconciliationRequired;\n\n  useEffect(() => {\n    if (canClose) return undefined;\n    const blockEscape = (event: KeyboardEvent) => {\n      if (event.key !== 'Escape') return;\n      event.preventDefault();\n      event.stopPropagation();\n      event.stopImmediatePropagation();\n    };\n    window.addEventListener('keydown', blockEscape, true);\n    return () => window.removeEventListener('keydown', blockEscape, true);\n  }, [canClose]);\n\n  return (`;
          if ((dialog.split(anchor).length - 1) !== 1) throw new Error('canClose anchor must be unique');
          dialog = dialog.replace(anchor, replacement);
          fs.writeFileSync(dialogPath, dialog);

          const verifyPath = 'scripts/verify-relocation-confirmation-surface.mjs';
          let verify = fs.readFileSync(verifyPath, 'utf8');
          verify += `\n// Locked reconciliation state must stop Escape before sibling Base UI roots can consume it.\nassert.match(component, /window\\.addEventListener\\('keydown', blockEscape, true\\)/);\nassert.match(component, /event\\.stopImmediatePropagation\\(\\)/);\nassert.match(component, /window\\.removeEventListener\\('keydown', blockEscape, true\\)/);\n`;
          fs.writeFileSync(verifyPath, verify);

          fs.appendFileSync('HANDOFF.md', [
            '',
            '## 2026-08-17 Relocation topology convergence — checkpoint 12',
            '',
            '- Browser run `31996135520` tested owner-lock head `1f9a1bf...`: permanent child+owner static lock contract passed, GP-REL-01/02 and GP-REL-03 passed, but GP-REL-04 still failed at the same Escape assertion.',
            '- Source inspection confirms there is no third relocation Dialog owner around these components: InterventionComparisonPanel and RelocationConfirmationDialog are sibling roots mounted directly in the Care result section.',
            '- Repeated failure after both Base UI roots cancel close requests indicates Root-level cancellation alone is insufficient for this sibling modal topology. The next safety boundary is application-level Escape capture only while confirmation `canClose=false`.',
            '- Locked confirmation now installs a window capture-phase keydown listener that prevents default, stops propagation and stops immediate propagation for Escape; listener is removed as soon as reconciliation unlocks the dialog. Pointer dismissal remains governed by Base UI `disablePointerDismissal` at child and owner roots.',
            '- The first one-shot attempt to apply this capture (`31996252425`) failed before modifying product files because its exact anchor omitted the existing `!reconciling` term. The guarded workflow correctly aborted and committed nothing; this retry uses the actual source anchor.',
            '- PUI-BC-028 stays open until this exact latest-head Chromium GP-REL-04 passes Escape + overlay + reconcile and the suite reaches GP-REL-05.',
            '',
          ].join('\n'));

          const badcasePath = 'evaluation/product/badcases.v1.jsonl';
          const lines = fs.readFileSync(badcasePath, 'utf8').trimEnd().split('\n').map(line => {
            const item = JSON.parse(line);
            if (item.id === 'PUI-BC-028') {
              return JSON.stringify({
                ...item,
                actual: 'child Base UI lock + owner panel lock 均通过静态/type/build，但 Chromium run 31996135520 仍在 Escape 处失败；已确认两者是直接 sibling roots。下一修复在 confirmation canClose=false 时通过 window capture phase 截断 Escape。首次 one-shot 因 exact anchor 漏掉 !reconciling 而安全中止，未提交产品改动。',
                status: 'fix_in_progress_escape_capture',
              });
            }
            return line;
          });
          fs.writeFileSync(badcasePath, `${lines.join('\n')}\n`);
          NODE
      - name: Confirmation/owner static contract
        run: node scripts/verify-relocation-confirmation-surface.mjs
      - name: Controller regression
        run: node --import tsx scripts/test-care-relocation-confirmation-controller.ts
      - name: TypeScript
        run: npm run lint
      - name: API TypeScript
        run: npm run check:api
      - name: Production build
        run: npm run build
      - name: Mark escape fix committed pending Chromium
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'evaluation/product/badcases.v1.jsonl';
          const lines = fs.readFileSync(path, 'utf8').trimEnd().split('\n').map(line => {
            const item = JSON.parse(line);
            if (item.id === 'PUI-BC-028') return JSON.stringify({ ...item, status: 'fix_committed_revalidation_pending' });
            return line;
          });
          fs.writeFileSync(path, `${lines.join('\n')}\n`);
          NODE
      - name: Remove one-shot workflow
        run: rm .github/workflows/fix-relocation-escape-capture-once.yml
      - name: Commit verified Escape capture
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Capture Escape while relocation recovery is locked"
          git push origin HEAD:agent/canonical-care-relocation-wiring
