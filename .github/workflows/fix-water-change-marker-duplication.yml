name: Fix Water Change Marker Duplication

on:
  push:
    branches: [agent/fix-aquarium-completion-state]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-aquarium-completion-state
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fix-water-change-marker-duplication.mjs
      - run: |
          git diff --check
          ! grep -q "handleDailyActionPrimary = () => {  const handleDailyActionPrimary" src/pages/Aquarium.tsx
          ! grep -q "getConflicts = (_fishes: AquariumFish\[\]): string\[\] => {  const getConflicts" src/pages/Aquarium.tsx
      - name: Commit cleanup and remove temporary tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Aquarium.tsx
          git rm scripts/fix-water-change-marker-duplication.mjs .github/workflows/fix-water-change-marker-duplication.yml
          git commit -m "fix: clean water change handler markers"
          git push origin HEAD:agent/fix-aquarium-completion-state
