name: Tank Intervention Simulator

on:
  pull_request:
    paths:
      - 'src/lib/tankInterventionSimulator.ts'
      - 'src/lib/communityConflictGraph.ts'
      - 'src/lib/tankCompatibilityEngine.ts'
      - 'src/data/compatibilityEvidence.ts'
      - 'scripts/test-tank-intervention-simulator.ts'
      - 'scripts/test-community-conflict-graph.ts'
      - 'scripts/test-replacement-recommendation-engine.ts'
      - '.github/workflows/tank-intervention-simulator.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  intervention-simulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Intervention counterfactual golden cases
        run: node --import tsx scripts/test-tank-intervention-simulator.ts
      - name: Community conflict graph regression
        run: node --import tsx scripts/test-community-conflict-graph.ts
      - name: Replacement recommendation regression
        run: node --import tsx scripts/test-replacement-recommendation-engine.ts
      - name: Type check
        run: npm run lint
