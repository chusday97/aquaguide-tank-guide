name: Diagnose GP-002 safe fixture

on:
  push:
    branches:
      - agent/golden-path-e2e-v1

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run production-rule fixture matrix
        run: npx tsx scripts/diagnose-gp002-safe-fixture.ts
