name: HANDOFF UI baseline migration

on:
  push:
    branches:
      - agent/right-half-drawer-ui
    paths:
      - '.github/workflows/handoff-ui-baseline-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update HANDOFF baseline
        run: node scripts/update-handoff-ui-baseline.mjs
      - name: Remove one-shot migration files
        run: rm -f scripts/update-handoff-ui-baseline.mjs .github/workflows/handoff-ui-baseline-migration.yml
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HANDOFF.md scripts/update-handoff-ui-baseline.mjs .github/workflows/handoff-ui-baseline-migration.yml
          git commit -m "docs(ui): replace obsolete 50vw HANDOFF baseline"
          git push
