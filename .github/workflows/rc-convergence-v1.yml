name: RC Convergence V1

on:
  push:
    branches: [codex/unified-rc-visual-v1]
    paths:
      - 'src/**'
      - 'packages/**'
      - 'scripts/**'
      - '.ai/PROJECT_STATE.json'
      - '.ai/OPEN_PR_REGISTRY.md'
      - '.ai/RC_MIGRATION_LEDGER.md'
      - '.ai/TASK_QUEUE.md'
      - 'docs/PROJECT_TRUTH.md'
      - 'docs/HISTORICAL_EVIDENCE.md'
      - 'docs/01-definition/PRODUCT_TRUTH.md'
      - 'docs/01-definition/FEATURE_CATALOG.md'
      - 'docs/02-design/VISUAL_BASELINE.md'
      - 'docs/03-development/DEPLOYMENT_STATE.md'
      - 'docs/03-development/BRANCH_CONVERGENCE_AUDIT.md'
      - 'docs/03-development/PR_CLEANUP_RECORD.md'
      - 'docs/05-validation/VISUAL_ACCEPTANCE_MATRIX.md'
      - 'docs/05-validation/MODULE_FACT_INVENTORY.md'
      - 'docs/05-validation/RELEASE_READINESS.md'
      - 'docs/decisions/**'
      - 'PROGRESS.md'
      - 'HANDOFF_LATEST.md'
      - '.ai/EXECUTION_LOG.md'
      - '.ai/CHANGELOG_AI.md'
      - '40-DOCS/CHANGELOG.md'
      - '.project-journal/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/rc-convergence-v1.yml'
  pull_request:
    branches: [integration/aquaguide-rc1, main]
    paths:
      - 'src/**'
      - 'packages/**'
      - 'scripts/**'
      - '.ai/PROJECT_STATE.json'
      - '.ai/OPEN_PR_REGISTRY.md'
      - '.ai/RC_MIGRATION_LEDGER.md'
      - '.ai/TASK_QUEUE.md'
      - 'docs/PROJECT_TRUTH.md'
      - 'docs/HISTORICAL_EVIDENCE.md'
      - 'docs/01-definition/PRODUCT_TRUTH.md'
      - 'docs/01-definition/FEATURE_CATALOG.md'
      - 'docs/02-design/VISUAL_BASELINE.md'
      - 'docs/03-development/DEPLOYMENT_STATE.md'
      - 'docs/03-development/BRANCH_CONVERGENCE_AUDIT.md'
      - 'docs/03-development/PR_CLEANUP_RECORD.md'
      - 'docs/05-validation/VISUAL_ACCEPTANCE_MATRIX.md'
      - 'docs/05-validation/MODULE_FACT_INVENTORY.md'
      - 'docs/05-validation/RELEASE_READINESS.md'
      - 'docs/decisions/**'
      - 'PROGRESS.md'
      - 'HANDOFF_LATEST.md'
      - '.ai/EXECUTION_LOG.md'
      - '.ai/CHANGELOG_AI.md'
      - '40-DOCS/CHANGELOG.md'
      - '.project-journal/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/rc-convergence-v1.yml'

permissions:
  contents: read
  pull-requests: read

jobs:
  convergence-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Confirm convergence state
        run: npm run project:status
      - name: Confirm local and remote canonical parity
        if: github.event_name == 'push'
        run: npm run check:branch-convergence
      - name: Confirm project truth routing
        run: npm run check:project-truth
      - name: Confirm PR and cross-layer governance
        run: npm run check:pr-governance
      - name: Three-tier data contract
        run: npm run test:three-tier-contract
      - name: Business API contract
        run: npm run test:business-api-contract
      - name: API boundary and auth semantics
        run: npm run test:api-boundary
      - name: Compatibility engine
        run: npm run test:compatibility
      - name: Tank state engine
        run: npm run test:p0-tank-state
      - name: Daily Check rule and persistence contract
        run: npm run test:daily-check
      - name: Task entry contract
        run: npm run test:task-entry-contract
      - name: Tank evidence adapter
        run: npm run test:p0-tank-evidence
      - name: Water change engine
        run: npm run test:p0-water-change
      - name: Compatibility evidence presentation
        run: npm run test:compatibility-evidence
      - name: Recommendation authority
        run: npm run test:recommendation-authority
      - name: Discovery storage boundary
        run: npm run test:discovery-storage-boundary
      - name: Share report contract
        run: npm run test:share-report-contract
      - name: Type check
        run: npm run lint
      - name: Visual viewport contract
        run: npm run test:layout-mode
      - name: Aquarium framing contract
        run: npm run test:three-stage-framing
      - name: Production build
        run: npm run build
