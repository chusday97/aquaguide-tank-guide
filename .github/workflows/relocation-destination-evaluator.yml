name: Relocation Destination Evaluator

on:
  pull_request:
    paths:
      - 'src/lib/relocationDestinationEvaluator.ts'
      - 'src/lib/tankCompatibilityEngine.ts'
      - 'src/lib/interventionChoiceModel.ts'
      - 'src/lib/conflictActionEngine.ts'
      - 'scripts/test-relocation-destination-evaluator.ts'
      - 'scripts/test-intervention-choice-model.ts'
      - '.github/workflows/relocation-destination-evaluator.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  destination-evaluator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Destination evaluation golden cases
        run: node --import tsx scripts/test-relocation-destination-evaluator.ts
      - name: Keeper choice regression
        run: node --import tsx scripts/test-intervention-choice-model.ts
      - name: Type check
        run: npm run lint
