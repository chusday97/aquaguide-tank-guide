name: Journal Relocation Convergence Once

on:
  push:
    branches:
      - agent/canonical-care-relocation-wiring
    paths:
      - '.github/workflows/journal-relocation-convergence-once.yml'

permissions:
  contents: write

jobs:
  journal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/canonical-care-relocation-wiring
      - name: Update handoff and badcase checkpoint
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const handoff = 'HANDOFF.md';
          const checkpoint = [
            '',
            '## 2026-08-17 Relocation topology convergence — checkpoint 6',
            '',
            '- Fresh revalidation corrected a documentation timing error: commit `a28616dd...` only installed the guarded one-shot close-locator patch workflow; it was not itself the product/test locator fix.',
            '- The one-shot run `31994975816` later succeeded and produced real fix commit `8960468085bc1bf539c57076fea33357d79e4b4d` (`Disambiguate relocation confirmation footer close`). The business footer button and browser test now use `data-close-relocation-confirmation` instead of text-only `关闭` matching.',
            '- `PUI-BC-026` is therefore in **fix committed / browser revalidation pending** state, not regression-verified yet. A green static/type/build run is not sufficient; latest-head Care relocation Chromium acceptance must still pass.',
            '- Convergence work remains focused on one source-scope policy: #65 `buildRelocationConfirmationEntrypoint` + canonical Care controller. #64 `buildRelocationConfirmationRequest` must not become a second independently evolving authorization/mapping path.',
            '- The first attempt to journal this checkpoint failed before any job because the temporary workflow YAML embedded an unindented heredoc. That was a process/tooling failure, not product evidence; this corrected workflow records it rather than hiding it.',
            '- Next gate: run latest canonical Care relocation browser Golden Path with an explicit uniqueness assertion for the business footer close locator, then use that evidence to decide `PUI-BC-025/026` closure and request-builder de-duplication.',
            '',
          ].join('\n');
          fs.appendFileSync(handoff, checkpoint);

          const badcasePath = 'evaluation/product/badcases.v1.jsonl';
          const lines = fs.readFileSync(badcasePath, 'utf8').trimEnd().split('\n');
          const updated = lines.map(line => {
            const item = JSON.parse(line);
            if (item.id === 'PUI-BC-026') {
              return JSON.stringify({
                ...item,
                actual: '真实 locator 修复已由 one-shot run 31994975816 提交为 8960468085bc1bf539c57076fea33357d79e4b4d：footer 业务按钮新增 data-close-relocation-confirmation，browser test 改用唯一 data locator。尚未对该最新 head 完成 Care relocation Chromium Golden Path，因此不能提前标记 regression_verified。',
                status: 'fix_committed_revalidation_pending',
                fixedBy: '8960468085bc1bf539c57076fea33357d79e4b4d',
                regression: 'latest-head Care relocation browser Golden Path + close-locator uniqueness assertion + confirmation surface static contract',
              });
            }
            if (item.id === 'PUI-BC-025') {
              return JSON.stringify({
                ...item,
                actual: '已确认 #65 entrypoint + canonical Care controller 是更完整主线候选；当前 convergence audit 继续验证其覆盖 PUI-BC-023/024，并等待最新-head browser Golden Path。#64 request-builder 暂不删除，也不允许继续作为第二套独立授权/映射语义演进。',
              });
            }
            return line;
          });
          fs.writeFileSync(badcasePath, `${updated.join('\n')}\n`);
          NODE
      - name: Remove one-shot workflow
        run: rm .github/workflows/journal-relocation-convergence-once.yml
      - name: Commit journal updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HANDOFF.md evaluation/product/badcases.v1.jsonl .github/workflows/journal-relocation-convergence-once.yml
          git commit -m "Journal relocation convergence checkpoint"
          git push origin HEAD:agent/canonical-care-relocation-wiring
