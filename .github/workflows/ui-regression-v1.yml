name: UI Regression V1

on:
  push:
    branches:
      - codex/unified-rc-visual-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: UI ownership and stale-contract guard
        run: node scripts/verify-ui-regression-contract.mjs

      - name: Detail rail static contract
        run: npm run test:split-workspace

      - name: Aquarium stage static contract
        run: npx tsx scripts/test-aquarium-stage-layout-contract.ts

      - name: Compatibility evidence coverage audit
        run: npm run audit:compatibility-evidence

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start isolated preview
        shell: bash
        run: |
          set -euo pipefail
          nohup env API_PORT=8787 npx tsx apps/api/src/index.ts > /tmp/aquaguide-api.log 2>&1 &
          echo $! > /tmp/aquaguide-api.pid
          for i in {1..40}; do
            if curl --fail --silent http://127.0.0.1:8787/api/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8787/api/health >/dev/null
          nohup env API_PORT=8787 npx vite --host 127.0.0.1 --port 4173 > /tmp/aquaguide-preview.log 2>&1 &
          echo $! > /tmp/aquaguide-preview.pid
          for i in {1..40}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/aquaguide-preview.log
          exit 1

      - name: Persistent detail rail browser regression
        env:
          PREVIEW_URL: http://127.0.0.1:4173
        run: npm run test:split-workspace-runtime

      - name: Aquarium stage browser regression
        env:
          PREVIEW_URL: http://127.0.0.1:4173
        run: node scripts/verify-aquarium-stage-layout-runtime.mjs

      - name: Aquarium primary tools and settings search
        env:
          PREVIEW_URL: http://127.0.0.1:4173
        run: npm run test:aquarium-primary-tools

      - name: Aquarium surface runtime matrix
        env:
          PREVIEW_URL: http://127.0.0.1:4173
        run: npm run test:aquarium-surfaces

      - name: Full page runtime matrix
        env:
          AQUAGUIDE_URL: http://127.0.0.1:4173
        run: npm run test:page-runtime-matrix

      - name: Canonical UI smoke
        env:
          AQUAGUIDE_URL: http://127.0.0.1:4173
        run: npm run test:ui-smoke

      - name: Care card action regression
        env:
          AQUAGUIDE_URL: http://127.0.0.1:4173
        run: npm run test:care-card-action-ui

      - name: Settings share action regression
        env:
          AQUAGUIDE_URL: http://127.0.0.1:4173
        run: npm run test:settings-share-action-ui

      - name: Admin content Blocking regression
        env:
          AQUAGUIDE_URL: http://127.0.0.1:4173
        run: npm run test:admin-content-dialogs

      - name: Collection creature-navigation regression
        env:
          AQUAGUIDE_URL: http://127.0.0.1:4173
        run: npm run test:collection-hub-ui

      - name: Taxonomy presentation browser regression
        env:
          AQUAGUIDE_URL: http://127.0.0.1:4173
        run: node scripts/verify-taxonomy-ui.mjs

      - name: Species export Media regression
        env:
          AQUAGUIDE_URL: http://127.0.0.1:4173
        run: npm run test:species-export-card

      - name: Species detail experience regression
        env:
          AQUAGUIDE_URL: http://127.0.0.1:4173
        run: npm run test:species-detail-ui

      - name: Identify flow and unsaved navigation guard
        env:
          PREVIEW_URL: http://127.0.0.1:4173
        run: npm run test:identify-flow-separation

      - name: Mobile aquarium regression
        env:
          PREVIEW_URL: http://127.0.0.1:4173
        run: npm run test:mobile-aquarium-priorities

      - name: Preview log on failure
        if: failure()
        run: |
          cat /tmp/aquaguide-preview.log || true
          cat /tmp/aquaguide-api.log || true
