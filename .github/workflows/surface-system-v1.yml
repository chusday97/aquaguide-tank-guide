name: Surface System V1

on:
  push:
    branches:
      - codex/interactive-parity-v3
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: TypeScript
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Surface contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'surface="detail"' src/components/common/AdaptiveDetailContent.tsx
          grep -q "dialogSurface = 'detail'" src/components/common/AdaptiveDetailContent.tsx
          grep -q 'surface="task"' src/components/common/AdaptiveTaskContent.tsx
          grep -q "dialogSurface = 'task'" src/components/common/AdaptiveTaskContent.tsx
          grep -q 'disablePointerDismissal' components/ui/dialog.tsx
          grep -q 'data-dialog-surface' components/ui/dialog.tsx
          grep -q 'activeModalBodyLocks' components/ui/dialog.tsx
          grep -q 'acquireModalBodyLock' components/ui/dialog.tsx
          grep -q 'surface="media"' src/components/common/ImagePreviewModal.tsx
          grep -q 'data-surface="image-preview-media"' src/components/common/ImagePreviewModal.tsx
          if grep -q 'createPortal' src/components/common/ImagePreviewModal.tsx; then
            echo 'ImagePreviewModal must use the shared media surface, not a private portal.' >&2
            exit 1
          fi
          grep -q 'surface="blocking"' src/pages/Settings.tsx
          if grep -q 'window.confirm' src/pages/Settings.tsx; then
            echo 'Settings product confirmation must use the shared blocking surface.' >&2
            exit 1
          fi
          grep -q 'surface="blocking"' src/pages/Identify.tsx
          if grep -q 'aria-modal="true"' src/pages/Identify.tsx; then
            echo 'Identify must not reintroduce a private aria-modal confirmation.' >&2
            exit 1
          fi
          grep -q 'surface="blocking"' src/pages/AIAssistant.tsx
          if grep -Eq '(^|[^[:alnum:]_])confirm\(' src/pages/AIAssistant.tsx; then
            echo 'AIAssistant clear-history confirmation must use the shared blocking surface.' >&2
            exit 1
          fi
          grep -Fq 'max-w-[920px]' components/ui/dialog.tsx
          grep -Fq '[data-dialog-surface="detail"]:not([data-detail-viewport])' src/styles/immersive-detail-layout-v5.css
          grep -q 'data-detail-viewport="desktop-rail"' src/styles/immersive-detail-layout-v5.css
          grep -q 'data-dialog-surface="task"' src/styles/immersive-detail-layout-v5.css
          echo 'Surface contract OK'
