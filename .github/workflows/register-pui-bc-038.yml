name: Register PUI-BC-038

on:
  push:
    branches:
      - agent/water-change-cloud-persistence
  workflow_dispatch:

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/water-change-cloud-persistence
          fetch-depth: 0
      - name: Append verified badcase once
        shell: bash
        run: |
          if grep -q '"id":"PUI-BC-038"' evaluation/product/badcases.v1.jsonl; then
            echo "PUI-BC-038 already registered."
            exit 0
          fi
          cat >> evaluation/product/badcases.v1.jsonl <<'EOF'
          {"id":"PUI-BC-038","featureId":"water_change_cloud_persistence","discoveredAt":"2026-08-18","source":"fail_before_contract","severity":"critical","symptom":"换水操作会先修改 care timeline 再保存 aquarium；如果 aquarium repository 写入失败，页面虽然提示保存失败，但 canonical water_change_day 或 reversal 事件可能已经在云端留下，刷新后出现半保存状态。","trigger":"Today 换水/撤回或历史日历增删完成 care-event mutation 后，repository.saveAquarium 失败。","expected":"多步写入要么整体成功，要么在失败时逆序补偿已完成的 care-event mutation；只有 aquarium 持久化成功后才更新可见成功状态。","actual":"旧实现没有补偿事务，事件与 aquarium 可以分叉。","rootCauseLayer":"distributed_write_consistency","status":"regression_verified","fixedBy":"a2180a8118aaed041edfa49b96cdf5be54909ceb","regression":"water-change cloud persistence contract + Product Golden Path run 785 (lint/build/care-card/GP-001..GP-005 PASS)"}
          EOF
      - name: Commit registry update when needed
        run: |
          if git diff --quiet -- evaluation/product/badcases.v1.jsonl; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evaluation/product/badcases.v1.jsonl
          git commit -m "Register PUI-BC-038 water-change partial writes"
          git push origin HEAD:agent/water-change-cloud-persistence
