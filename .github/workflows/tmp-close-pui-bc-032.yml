name: Temporary close PUI-BC-032
on:
  push:
    branches:
      - agent/care-card-action-closure
permissions:
  contents: write
jobs:
  close:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/care-card-action-closure
      - name: Patch verified status
        shell: python
        run: |
          from pathlib import Path
          bad = Path('evaluation/product/badcases.v1.jsonl')
          text = bad.read_text()
          old = '"id":"PUI-BC-032","featureId":"care","discoveredAt":"2026-08-18","source":"functional_cta_audit","severity":"medium","symptom":"Care 已实现 CareShareCardPreview、养护卡 Dialog 和 copyShareText，但 shareTopic 从未被设置为具体 topic；文章详情没有“生成养护卡”入口，因此真实已有能力对用户完全不可达。","trigger":"打开 /care?topic=guide_safe_water_change 的文章详情，尝试生成可复制的养护卡。","expected":"文章详情提供明确的“生成养护卡”本地工具入口，打开现有预览 Dialog，并允许复制真实养护卡文字；不得把它描述成尚未上线的公开分享链接/隐私能力。","actual":"Fail-before-fix Run 32051446275 在 build/preview PASS 后得到“生成养护卡”按钮 count=0；代码只有关闭 Dialog 时 setShareTopic(null)，没有任何 setShareTopic(topic) 打开路径，onOpenShare 还被错误耦合到 building sharing preview。","rootCauseLayer":"ui_action_wiring","status":"fixed","fixedBy":"agent/care-card-action-closure","regression":"新增 verify-care-card-action.mjs：文章详情必须有唯一生成养护卡入口；点击打开现有卡片 Dialog；复制文字必须真实写入 clipboard；不得出现公开分享/发布能力。最终 PR head Product Golden Path 后升级 regression_verified。"'
          assert text.count(old) == 1
          new = old.replace('"status":"fixed"', '"status":"regression_verified"').replace('新增 verify-care-card-action.mjs：文章详情必须有唯一生成养护卡入口；点击打开现有卡片 Dialog；复制文字必须真实写入 clipboard；不得出现公开分享/发布能力。最终 PR head Product Golden Path 后升级 regression_verified。', 'Fail-before-fix Run 32051446275 证明入口缺失；PR #87 Product Golden Path #594 / run 32053031556 在 head 55d27af671dc1f24da811833d265dc3432aec66d 上验证 Care card action regression、31 Badcases、typecheck/build、GP-001～GP-005 全 PASS。')
          bad.write_text(text.replace(old, new, 1))

          hand = Path('HANDOFF-2026-08-17.md')
          h = hand.read_text()
          old_h = '`PUI-BC-032` 暂记 `fixed`，待最终 PR head 全绿后升级 `regression_verified`。'
          assert h.count(old_h) == 1
          new_h = '`PUI-BC-032` 已 `regression_verified`：Fail-before-fix Run `32051446275` 证明入口缺失；PR #87 Product Golden Path **#594 / run `32053031556`** 在 head `55d27af671dc1f24da811833d265dc3432aec66d` 上验证永久 Care card action regression、31 Badcases、typecheck/build、GP-001～GP-005 全 PASS。'
          hand.write_text(h.replace(old_h, new_h, 1))
      - run: npm ci
      - run: npm run test:product-evaluation
      - name: Commit and self-delete
        run: |
          rm .github/workflows/tmp-close-pui-bc-032.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add evaluation/product/badcases.v1.jsonl HANDOFF-2026-08-17.md .github/workflows/tmp-close-pui-bc-032.yml
          git commit -m "docs: close PUI-BC-032 regression"
          git push origin HEAD:agent/care-card-action-closure