name: Migrate Knowledge Result UX

on:
  push:
    branches:
      - agent/result-ux-v1
    paths:
      - .github/workflows/migrate-knowledge-result-ux.yml
      - scripts/automation/migrate-knowledge-result-ux.mjs

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/result-ux-v1
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate migration script syntax
        run: node --check scripts/automation/migrate-knowledge-result-ux.mjs

      - name: Apply guarded migration
        run: node scripts/automation/migrate-knowledge-result-ux.mjs

      - name: Guard changed-file scope
        run: |
          changed="$(git diff --name-only)"
          printf 'Changed files:\n%s\n' "$changed"
          test "$changed" = "src/pages/CareEncyclopedia.tsx"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Commit guarded product migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/CareEncyclopedia.tsx
          git commit -m "Migrate Knowledge to decision-first Result UX"
          git push origin HEAD:agent/result-ux-v1
