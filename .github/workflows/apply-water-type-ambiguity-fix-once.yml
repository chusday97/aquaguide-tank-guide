name: Apply Water-Type Ambiguity Fix Once

on:
  push:
    branches:
      - agent/fix-ambiguous-marine-water-type
    paths:
      - '.github/workflows/apply-water-type-ambiguity-fix-once.yml'

permissions:
  contents: write

jobs:
  patch-verify-and-self-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-ambiguous-marine-water-type
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply exact water-type fix
        run: node scripts/apply-water-type-ambiguity-fix.mjs
      - name: Water-type ambiguity regression
        run: node --import tsx scripts/test-species-water-type-ambiguity.ts
      - name: Taxonomy regression
        run: node --import tsx scripts/assert_taxonomy_rules.ts
      - name: Recommendation grounding regression
        run: node --import tsx scripts/test-recommendation-catalog-grounding.ts
      - name: Lionfish reviewed evidence regression
        run: node --import tsx scripts/test-lionfish-reviewed-evidence.ts
      - name: Reviewed severe-risk regression
        run: node --import tsx scripts/test-reviewed-severe-risk-regression.ts
      - name: Type check
        run: npm run lint
      - name: Commit verified product fix and remove write tooling
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/species/species.service.ts src/modules/species/speciesWaterEvidence.ts
          git rm scripts/apply-water-type-ambiguity-fix.mjs
          git rm .github/workflows/apply-water-type-ambiguity-fix-once.yml
          git commit -m "Fix ambiguous butterfly-fish water classification"
          git push origin HEAD:agent/fix-ambiguous-marine-water-type
