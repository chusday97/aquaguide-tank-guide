name: RC1 Integrate Data Storage Repository Mode

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  integrate-data-storage:
    if: github.head_ref == 'integration/aquaguide-rc1'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RC1
        uses: actions/checkout@v4
        with:
          ref: integration/aquaguide-rc1
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply repository-mode-aware data storage layer
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_BASE=ed0cf38025652db901ee81aa697ca55b1c1584b6
          SOURCE_BRANCH=agent/cloud-data-storage-promise-closure
          git fetch origin "$SOURCE_BRANCH"
          SOURCE_HEAD="$(git rev-parse FETCH_HEAD)"

          if grep -q "const \[repositoryMode, setRepositoryMode\]" src/pages/Aquarium.tsx \
             && test -f scripts/test-data-storage-repository-mode-contract.mjs \
             && grep -q '"id":"PUI-BC-039"' evaluation/product/badcases.v1.jsonl; then
            echo 'Data-storage repository-mode behavior already integrated; validating existing RC1 state.'
            exit 0
          fi

          git show "$SOURCE_HEAD:scripts/test-data-storage-repository-mode-contract.mjs" > scripts/test-data-storage-repository-mode-contract.mjs
          git show "$SOURCE_HEAD:HANDOFF-2026-08-18-PUI-BC-037.md" \
            | sed 's/PUI-BC-037/PUI-BC-039/g' \
            > HANDOFF-2026-08-18-PUI-BC-039.md

          git diff "$SOURCE_BASE" "$SOURCE_HEAD" -- src/pages/Aquarium.tsx > /tmp/data-storage.patch
          git apply --check /tmp/data-storage.patch
          git apply /tmp/data-storage.patch

          python - <<'PY'
          from pathlib import Path
          import json, subprocess

          badcases = Path('evaluation/product/badcases.v1.jsonl')
          current = badcases.read_text()
          if '"id":"PUI-BC-039"' not in current:
              source = subprocess.check_output([
                  'git','show',
                  'FETCH_HEAD:evaluation/product/badcases.v1.jsonl'
              ], text=True)
              matches = [line for line in source.splitlines() if 'Data & backup' in line and 'ui_persistence_contract' in line]
              if len(matches) != 1:
                  raise SystemExit(f'expected exactly one Data & backup badcase source line, found {len(matches)}')
              record = json.loads(matches[0])
              record['id'] = 'PUI-BC-039'
              badcases.write_text(current.rstrip('\n') + '\n' + json.dumps(record, ensure_ascii=False, separators=(',', ':')) + '\n')
          PY

      - name: Validate persistence convergence
        run: |
          npm run test:product-evaluation
          node scripts/test-aquarium-delete-repository-contract.mjs
          node scripts/test-aquarium-settings-repository-contract.mjs
          node scripts/test-water-change-cloud-persistence-contract.mjs
          node scripts/test-data-storage-repository-mode-contract.mjs
          npm run lint
          npm run build

      - name: Commit RC1 data-storage product integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/pages/Aquarium.tsx \
            evaluation/product/badcases.v1.jsonl \
            HANDOFF-2026-08-18-PUI-BC-039.md \
            scripts/test-data-storage-repository-mode-contract.mjs
          if git diff --cached --quiet; then
            echo "No product changes to commit."
            exit 0
          fi
          git commit -m "Integrate repository-aware data storage into RC1"
          git pull --rebase origin integration/aquaguide-rc1
          git push origin HEAD:integration/aquaguide-rc1
