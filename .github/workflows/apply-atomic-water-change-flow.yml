name: Apply Atomic Water Change Flow

on:
  push:
    branches: [agent/fix-aquarium-completion-state]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-aquarium-completion-state
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact water-change patch
        run: node scripts/patch-atomic-water-change-flow.mjs
      - name: Validate patch shape
        run: |
          git diff --check
          grep -q "async setWaterChange(input: WaterChangeMutation)" src/services/repository/local-aquaguide.repository.ts
          grep -q "async setWaterChange(input: WaterChangeMutation)" src/services/repository/api-aquaguide.repository.ts
          grep -q "set_aquarium_water_change_day" apps/api/src/routes/aquariums.ts
          grep -q "hydrateAquariumWaterChangeHistory" src/pages/Aquarium.tsx
          grep -q "await repository.setWaterChange" src/pages/Aquarium.tsx
          ! grep -q "const saveAquariums =" src/pages/Aquarium.tsx
          ! grep -A45 "const handleTankWaterChange" src/pages/Aquarium.tsx | grep -q "persistCareTimelineEvent\|removeCareTimelineEventBySource"
      - name: Commit flow and remove temporary tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/repository/local-aquaguide.repository.ts src/services/repository/api-aquaguide.repository.ts apps/api/src/routes/aquariums.ts src/pages/Aquarium.tsx
          git rm scripts/patch-atomic-water-change-flow.mjs .github/workflows/apply-atomic-water-change-flow.yml
          git commit -m "fix: persist water changes atomically"
          git push origin HEAD:agent/fix-aquarium-completion-state
