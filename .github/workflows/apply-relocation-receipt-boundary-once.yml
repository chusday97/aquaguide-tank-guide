name: Apply Relocation Receipt Boundary Once

on:
  push:
    branches:
      - agent/atomic-livestock-relocation-contract
    paths:
      - '.github/workflows/apply-relocation-receipt-boundary-once.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/atomic-livestock-relocation-contract
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Confirm new receipt regression fails before patch
        shell: bash
        run: |
          set +e
          node scripts/test-livestock-relocation-receipt-boundary.mjs
          status=$?
          set -e
          test "$status" -ne 0
      - name: Apply exact-anchor receipt boundary patch
        run: node scripts/apply-relocation-receipt-boundary-once.mjs
      - name: Receipt boundary regression
        run: node scripts/test-livestock-relocation-receipt-boundary.mjs
      - name: Existing relocation wiring contract
        run: node scripts/test-livestock-relocation-wiring.mjs
      - name: Pure local relocation regression
        run: node --import tsx scripts/test-livestock-relocation.ts
      - name: SQL/security relocation contract
        run: node scripts/test-livestock-relocation-contract.mjs
      - name: Existing unresolved livestock regression
        run: node --import tsx scripts/test-unresolved-existing-livestock.ts
      - name: API TypeScript
        run: npm run check:api
      - name: App TypeScript
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Remove one-shot write tooling
        run: rm .github/workflows/apply-relocation-receipt-boundary-once.yml scripts/apply-relocation-receipt-boundary-once.mjs
      - name: Commit verified receipt boundary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Separate relocation mutation receipt from canonical refresh"
          git push origin HEAD:agent/atomic-livestock-relocation-contract
