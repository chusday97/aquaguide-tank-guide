name: Apply Local Aquarium Load Race Fix

on:
  pull_request:
    branches:
      - agent/uiux-system-refactor-v1

permissions:
  contents: write

jobs:
  apply-local-load-race-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/result-ux-v1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply guarded race fix
        run: node scripts/automation/fix-local-aquarium-load-race.mjs

      - name: Install dependencies
        run: npm ci

      - name: Plant livestock contract
        run: node scripts/test-plant-livestock-edit-contract.mjs

      - name: Type check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Diff safety
        run: |
          git diff --check
          test "$(git diff --name-only)" = "src/pages/Aquarium.tsx"

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/aquaguide-load-race.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/aquaguide-load-race.log
          exit 1

      - name: Plant structured and legacy browser regression
        env:
          PREVIEW_URL: http://127.0.0.1:4173
        run: node scripts/verify-plant-livestock-edit.mjs

      - name: Existing navigation context regression
        env:
          PREVIEW_URL: http://127.0.0.1:4173
        run: node scripts/verify-navigation-context-v1.mjs

      - name: Commit race fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Aquarium.tsx
          git commit -m "Avoid stale local aquarium reload after plant edits"
          git push origin HEAD:agent/result-ux-v1
