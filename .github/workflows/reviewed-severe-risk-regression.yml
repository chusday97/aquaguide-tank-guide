name: Reviewed Severe Risk Regression

on:
  pull_request:
    paths:
      - 'src/lib/tankCompatibilityEngine.ts'
      - 'src/lib/communityConflictGraph.ts'
      - 'src/lib/tankInterventionSimulator.ts'
      - 'src/lib/conflictActionEngine.ts'
      - 'src/lib/tankDecisionSupportOrchestrator.ts'
      - 'src/lib/diagnosisConflictEvidence.ts'
      - 'src/data/compatibilityEvidence.ts'
      - 'scripts/test-reviewed-severe-risk-regression.ts'
      - '.github/workflows/reviewed-severe-risk-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reviewed-severe-risk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Reviewed severe-risk cross-layer regression
        run: node --import tsx scripts/test-reviewed-severe-risk-regression.ts
      - name: Diagnosis conflict regression
        run: node --import tsx scripts/test-diagnosis-conflict-evidence.ts
      - name: Community conflict graph regression
        run: node --import tsx scripts/test-community-conflict-graph.ts
      - name: Type check
        run: npm run lint
