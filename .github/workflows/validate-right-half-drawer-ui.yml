name: Validate right-half drawer UI

on:
  push:
    branches:
      - agent/right-half-drawer-ui

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Responsive drawer regression
        run: npm run test:responsive-detail-surface
      - name: TypeScript lint
        run: npm run lint
      - name: Build
        run: npm run build
