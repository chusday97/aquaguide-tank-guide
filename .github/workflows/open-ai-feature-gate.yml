name: Open AI feature gate

on:
  push:
    paths:
      - 'scripts/open-ai-feature-gate.mjs'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply source migration
        run: node scripts/open-ai-feature-gate.mjs
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run lint
      - name: Commit source change
        run: |
          if git diff --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/layout/WorkspaceNavigationProvider.tsx
          git commit -m "feat(ai): reopen production AI interactions"
          git push
