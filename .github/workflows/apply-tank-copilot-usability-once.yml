name: Apply Tank Copilot Usability Once

on:
  pull_request:
    branches:
      - agent/uiux-system-refactor-v1

permissions:
  contents: write

concurrency:
  group: aquaguide-tank-copilot-usability-once
  cancel-in-progress: false

jobs:
  apply:
    if: github.repository == 'chusday97/aquaguide-tank-guide' && github.event.pull_request.head.ref == 'agent/result-ux-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/result-ux-v1
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply prompt usefulness repair
        run: node scripts/patch-tank-copilot-prompt-once.mjs

      - name: Validate Tank Copilot contracts
        run: |
          npm ci
          node --import tsx scripts/test-tank-copilot-usability.ts
          npm run test:copilot-contract
          npm run lint

      - name: Commit validated repair and self-remove
        shell: bash
        run: |
          git config user.name 'aquaguide-ai-usability-bot'
          git config user.email 'aquaguide-ai-usability-bot@users.noreply.github.com'
          git add server/index.mjs src/modules/copilot/copilot.policy.ts scripts/test-tank-copilot-usability.ts .github/workflows/result-ux-v1.yml
          git rm scripts/patch-tank-copilot-prompt-once.mjs
          git rm .github/workflows/apply-tank-copilot-usability-once.yml
          git diff --cached --stat
          git commit -m 'Make Tank Copilot parsed results actionable'
          git push origin HEAD:agent/result-ux-v1
