name: Finalize GP-002 evaluation

on:
  push:
    branches:
      - agent/golden-path-e2e-v1

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Finalize evaluation and durable gates
        run: node scripts/finalize-gp002-evaluation.mjs
      - name: Validate diff
        run: git diff --check
      - name: Commit finalized evaluation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No finalization needed."
            exit 0
          fi
          git commit -m "eval: promote GP-002 to covered"
          git push
