name: Apply Legacy Aquarium Editor Removal

on:
  push:
    branches: [agent/fix-aquarium-completion-state]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-aquarium-completion-state
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Remove disabled legacy editor
        run: node scripts/patch-remove-legacy-aquarium-editor.mjs
      - name: Validate removal
        run: |
          git diff --check
          ! grep -q "Legacy fish detail modal" src/pages/Aquarium.tsx
          ! grep -q "handleUpdateEntryDate" src/pages/Aquarium.tsx
          ! grep -q "handleUpdateQuantity" src/pages/Aquarium.tsx
          ! grep -q "const isSelected = Boolean((settingsForm.equipment as any)?.\[device.key\])" src/pages/Aquarium.tsx
      - name: Commit removal and clean temporary tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Aquarium.tsx
          git rm scripts/patch-remove-legacy-aquarium-editor.mjs .github/workflows/apply-remove-legacy-aquarium-editor.yml
          git commit -m "refactor: remove disabled aquarium detail editor"
          git push origin HEAD:agent/fix-aquarium-completion-state
