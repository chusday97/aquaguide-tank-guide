name: PR23 final UI validation

on:
  push:
    branches:
      - agent/right-half-drawer-ui
    paths:
      - '.github/workflows/pr23-final-validation.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Static UI contracts
        run: |
          npm run test:responsive-detail-surface
          npm run test:typography-system
          npm run test:collection-swipe-cards
          npm run test:livestock-state-surface
      - name: Type check
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/aquaguide-preview.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/aquaguide-preview.log
          exit 1
      - name: Collection browser regression
        env:
          PREVIEW_URL: http://127.0.0.1:4173
        run: npm run test:collection-hub-ui
      - name: Livestock drawer browser regression
        env:
          PREVIEW_URL: http://127.0.0.1:4173
        run: npm run test:livestock-state-drawer-ui
      - name: Guided navigation regression
        env:
          PREVIEW_URL: http://127.0.0.1:4173
        run: npm run test:guided-navigation-ui
      - name: Remove temporary validation workflow
        run: rm -f .github/workflows/pr23-final-validation.yml
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/pr23-final-validation.yml
          git commit -m "chore: remove PR23 validation workflow"
          git push
