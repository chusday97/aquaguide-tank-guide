name: Production Security Boundary V1

on:
  pull_request:
    branches:
      - agent/uiux-system-refactor-v1
      - integration/aquaguide-rc1

permissions:
  contents: read

jobs:
  validate-production-security-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/result-ux-v1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Product evaluation registry contract
        run: npm run test:product-evaluation

      - name: Share-report secret boundary
        run: npm run test:share-report-contract

      - name: API type check
        run: npm run check:api

      - name: API boundary contract
        run: npm run test:api-boundary

      - name: Business API contract
        run: npm run test:business-api-contract
