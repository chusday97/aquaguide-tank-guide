name: Apply Relocation Confirmation Trigger Once

on:
  push:
    branches:
      - agent/relocation-confirmation-surface
    paths:
      - '.github/workflows/apply-relocation-confirmation-trigger-once.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/relocation-confirmation-surface
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Confirm trigger regression fails before patch
        shell: bash
        run: |
          set +e
          node scripts/test-relocation-confirmation-trigger.mjs
          status=$?
          set -e
          test "$status" -ne 0
      - name: Apply exact-anchor trigger patch
        run: node scripts/apply-relocation-confirmation-trigger-once.mjs
      - name: Confirmation trigger regression
        run: node scripts/test-relocation-confirmation-trigger.mjs
      - name: Confirmation state regression
        run: node --import tsx scripts/test-relocation-confirmation-state.ts
      - name: Confirmation UI static contract
        run: node scripts/verify-relocation-confirmation-surface.mjs
      - name: Fresh execution policy regression
        run: node --import tsx scripts/test-relocation-execution-policy.ts
      - name: Ambiguous mutation outcome regression
        run: node --import tsx scripts/test-relocation-mutation-uncertainty.ts
      - name: Product evaluation registry
        run: npm run test:product-evaluation
      - name: TypeScript
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Mark PUI-BC-023 verified and append handoff checkpoints
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const badcasePath = 'evaluation/product/badcases.v1.jsonl';
          let text = fs.readFileSync(badcasePath, 'utf8');
          const before = '"id":"PUI-BC-023","featureId":"compatibility","discoveredAt":"2026-08-17","source":"execution_surface_audit","severity":"critical","symptom":"迁移目标卡片如果直接把先前显示的 compatible verdict 当成执行授权，用户可能在鱼缸状态已经变化后仍看到可执行迁移入口，形成 stale-verdict mutation 风险。","trigger":"先打开群落调整比较并看到某目标缸为 compatible_by_current_evidence；随后源缸或目标缸状态变化，再从旧卡片发起迁移。","expected":"比较面板只能打开独立迁移确认层；真正 mutation 必须重新读取 canonical state 并经过 executeFreshRelocation。只有 formal relocation option 且当前卡片 verdict 为 compatible_by_current_evidence 时才允许显示‘打开确认’入口，其他状态不得暴露执行 CTA。","actual":"当前比较面板仍是只读，没有确认入口；下一步接线若直接调用 repository 或把缓存 verdict 当授权，会绕过 #63 fresh revalidation。","rootCauseLayer":"ui_execution_boundary","status":"open","regression":"test:relocation-confirmation-trigger + relocation confirmation surface CI + canonical confirmation integration audit"';
          const after = '"id":"PUI-BC-023","featureId":"compatibility","discoveredAt":"2026-08-17","source":"execution_surface_audit","severity":"critical","symptom":"迁移目标卡片如果直接把先前显示的 compatible verdict 当成执行授权，用户可能在鱼缸状态已经变化后仍看到可执行迁移入口，形成 stale-verdict mutation 风险。","trigger":"先打开群落调整比较并看到某目标缸为 compatible_by_current_evidence；随后源缸或目标缸状态变化，再从旧卡片发起迁移。","expected":"比较面板只能打开独立迁移确认层；真正 mutation 必须重新读取 canonical state 并经过 executeFreshRelocation。只有 formal relocation option 且当前卡片 verdict 为 compatible_by_current_evidence 时才允许显示‘打开确认’入口，其他状态不得暴露执行 CTA。","actual":"比较面板现在只对 formal relocation option 下的 compatible_by_current_evidence 目标缸暴露‘打开迁移确认’，并仅发送 confirmation intent；面板本身不 import/call repository、API、Supabase 或 executeFreshRelocation。","rootCauseLayer":"ui_execution_boundary","status":"regression_verified","fixedBy":"agent/relocation-confirmation-surface","regression":"test:relocation-confirmation-trigger + relocation confirmation surface CI + canonical confirmation integration audit","verification":"fail-before-fix trigger contract + confirmation/policy uncertainty regressions + lint + build"';
          if (!text.includes(before)) throw new Error('PUI-BC-023 open record anchor missing');
          fs.writeFileSync(badcasePath, text.replace(before, after));
          NODE
          cat >> HANDOFF.md <<'EOF'

          ## 2026-08-17 Relocation confirmation CTA wiring — checkpoint 1.5

          - 第一次 guarded apply 的产品代码与全部回归均通过，但最终 push 被 GitHub 拒绝：GitHub App token 没有 `workflows` 权限，不能在 runner push 中修改 `.github/workflows/relocation-confirmation-surface.yml`。
          - 这是发布/写入权限边界，不是产品逻辑失败。修复方式是不扩大 token 权限：runner 只提交已验证的产品代码、测试、HANDOFF 与 Badcase；永久 workflow gate 由 GitHub connector 单独更新。

          ## 2026-08-17 Relocation confirmation CTA wiring — checkpoint 2

          - `InterventionComparisonPanel` 已增加 mutation-free confirmation intent callback；比较面板本身仍不 import/call Repository、API、Supabase 或 `executeFreshRelocation()`。
          - 入口只存在于 formal relocation option 的 destination evaluation，且仅当卡片状态为 `compatible_by_current_evidence` 时显示“打开迁移确认 / Open relocation confirmation”。`conditional / insufficient_data / not_recommended` 没有执行入口。
          - 点击入口只传递 `subjectSpeciesId / subjectName / quantity / destinationAquariumId / destinationAquariumName`，不携带 oldVerdict/isSafe/expectedCompatibility 等授权字段；真正 mutation 仍必须由上层构造 request 并进入 PR #63 fresh execution policy。
          - `PUI-BC-023` 已从 `open` 更新为 `regression_verified`：新增 trigger contract 先在旧面板上失败，再在 patch 后通过；confirmation state/UI、fresh execution policy、mutation uncertainty、product eval、TypeScript 与 production build 同步通过。
          - 当前仍未完成：Care 页面尚未把 confirmation intent 转成真实 `RelocationExecutionRequest`；因此用户仍不能从正式产品路径执行迁移。下一步只做 request-builder + dialog-open wiring，并继续禁止 destination card 直接 mutation。
          EOF
      - name: Revalidate product registry after status update
        run: npm run test:product-evaluation
      - name: Commit verified product and journal changes only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/compatibility/InterventionComparisonPanel.tsx scripts/test-relocation-confirmation-trigger.mjs evaluation/product/badcases.v1.jsonl HANDOFF.md
          git commit -m "Wire safe relocation confirmation trigger"
          git push origin HEAD:agent/relocation-confirmation-surface
