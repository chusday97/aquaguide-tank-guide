name: Phase0 Observation Entry Patch

on:
  push:
    branches:
      - agent/fix-aquarium-completion-state
    paths:
      - scripts/phase0-patch-observation-entry.mjs
      - .github/workflows/phase0-observation-entry-patch.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-aquarium-completion-state
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply guarded observation-entry patch
        run: node scripts/phase0-patch-observation-entry.mjs
      - name: Observation canonical + reachability regression
        run: npx tsx scripts/test-observation-canonical-state.ts
      - name: Type check
        run: npm run lint
      - name: Commit verified patch
        run: |
          if git diff --quiet -- src/pages/Aquarium.tsx; then
            echo "No Aquarium.tsx change required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Aquarium.tsx
          git commit -m "Make observation recording reachable"
          git push origin HEAD:agent/fix-aquarium-completion-state
