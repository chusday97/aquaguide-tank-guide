name: Admin Quality Inbox V1

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/main.tsx'
      - 'src/pages/AdminFeedback.tsx'
      - 'src/services/admin/feedback-admin.service.ts'
      - 'apps/api/src/routes/feedback.ts'
      - 'scripts/verify-admin-quality-inbox-contract.mjs'
      - 'scripts/verify-admin-quality-inbox-browser.mjs'
      - '.github/workflows/admin-quality-inbox.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Admin Quality Inbox contract
        run: node scripts/verify-admin-quality-inbox-contract.mjs
      - name: Type check
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Build synthetic unauthenticated preview
        env:
          VITE_SUPABASE_URL: https://synthetic-auth.supabase.co
          VITE_SUPABASE_ANON_KEY: synthetic-anon-key-for-browser-contract
        run: npm run build
      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/aquaguide-admin-preview.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/aquaguide-admin-preview.log
          exit 1
      - name: Admin Quality Inbox browser contract
        env:
          PREVIEW_URL: http://127.0.0.1:4173
        run: node scripts/verify-admin-quality-inbox-browser.mjs
