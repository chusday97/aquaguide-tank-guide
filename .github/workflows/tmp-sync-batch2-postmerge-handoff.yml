name: Temporary Sync Batch 2 Post-merge Handoff

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/tmp-sync-batch2-postmerge-handoff.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Patch final Batch 2 Handoff state
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'HANDOFF-2026-08-17.md';
          let source = fs.readFileSync(path, 'utf8');

          const oldHeading = '### Evidence Batch 2 — direct pair research';
          const newHeading = '### Evidence Batch 2 — direct pair research — 已合入 main';
          const headingCount = source.split(oldHeading).length - 1;
          if (headingCount !== 1) throw new Error(`Expected one Batch 2 direct-pair heading, found ${headingCount}`);
          source = source.replace(oldHeading, newHeading);

          const oldBranch = '最终分支：`agent/compatibility-evidence-batch-2-final`，从包含 PUI-BC-023 Challenge expansion 的 latest main 重建，不覆盖其 connected/regression/challenge 证据。';
          const newBranch = 'PR #81 `Expand reviewed compatibility evidence batch 2` 已 squash merge 到 main，merge commit：`87251111f467cdd282595e5e07c872779fdd47a5`。最终分支 `agent/compatibility-evidence-batch-2-final` 从包含 PUI-BC-023 Challenge expansion 的 main 重建，因此没有覆盖其 connected/regression/challenge 证据。';
          const branchCount = source.split(oldBranch).length - 1;
          if (branchCount !== 1) throw new Error(`Expected one Batch 2 branch line, found ${branchCount}`);
          source = source.replace(oldBranch, newBranch);

          const oldRegression = 'Compatibility evidence regression 已锁定 pair-rule floor >=3、audit 中必须存在 Oscar–zebrafish direct pair rule、authoritative decision=`not_recommended`、reviewed citations 保留、direct evidence 不得被错误标成“并非直接配对实验”、且必须保留 lab→home-aquarium 限制。';
          const newRegression = `${oldRegression}\n\n最终 current-main merge-ref Product Golden Path **#567 / run 32039779091** 验证 head \`9c499e56d976c2a784db67f6f1f168b6208faf78\` + base \`9576cb81bb8932e382f42efe0d6e8b10c6a4aa0e\`：18 features / 108 states / 27 Badcases；7 reviewed profiles / 3 reviewed pair rules；132 priority directions / recordable=2；statuses=108 \`insufficient_data\` / 22 \`not_recommended\` / 2 \`caution\`；session telemetry privacy、research-only audit、Daily Check、typecheck、build、GP-001～GP-005 全 PASS。`;
          const regressionCount = source.split(oldRegression).length - 1;
          if (regressionCount !== 1) throw new Error(`Expected one Batch 2 regression paragraph, found ${regressionCount}`);
          source = source.replace(oldRegression, newRegression);

          const old027 = '回归证据：direct-pair guard `32037647831`、Product Golden Path #552 以及 clean merge-ref Product Golden Path #565 均通过；#565 记录 27 Badcases / 7 profiles / 3 pair rules / priority recordable=2 / statuses 108-22-2，GP-001～GP-005 全 PASS。';
          const new027 = '回归证据：direct-pair guard `32037647831`、Product Golden Path #552，以及最终 current-main merge-ref Product Golden Path **#567 / run 32039779091** 均通过；#567 记录 27 Badcases / 7 profiles / 3 pair rules / priority recordable=2 / statuses 108-22-2，GP-001～GP-005 全 PASS。';
          const puiCount = source.split(old027).length - 1;
          if (puiCount !== 1) throw new Error(`Expected one PUI-BC-027 regression line, found ${puiCount}`);
          source = source.replace(old027, new027);

          const oldNext = `1. **Evidence Batch 2 已完成首条 direct pair research，进入最终合并门禁**：地图鱼 \`sp_0451\` + 斑马鱼 \`sp_0435\` 已有 reviewed \`not_recommended / predation_threat / basis=pair_rule\`；最终 PR 必须在 current main merge-ref 上保持 27 Badcases / 7 profiles / 3 pair rules / recordable=2 / statuses 108-22-2 / GP-001～GP-005 全 PASS。\n2. 后续在 PostHog 查询 \`compatibility_pair_evaluated\`，优先统计 \`status=insufficient_data\` 的 pairKey；样本不足时明确标注不足，不制造“高频用户需求”。\n3. \`PUI-BC-025\` 继续 investigating；只有真实 reviewed evidence 扩张后才更新 coverage 数字。\n4. **PUI-BC-023 已进入 Challenge expansion**：Regression 保持稳定；EvalPilot \`be6a7078…\` / CI \`32039192110\` 已生成并校正 3 个 Challenge candidates。下一条优先 \`case-challenge-blind-daily-check-risk-persona\`，但当前仍是 \`candidate_not_run\`，不得计入 verified coverage。\n5. Golden Path 维持 5 / 5 regression maintenance，不再以新增路径数量作为进度指标。`;
          const newNext = `1. **Evidence Batch 2 已合入 main**：PR #81 / merge \`87251111f467cdd282595e5e07c872779fdd47a5\`；地图鱼 \`sp_0451\` + 斑马鱼 \`sp_0435\` 为 reviewed \`not_recommended / predation_threat / basis=pair_rule\`，实验到家庭长期同缸的限制继续保留。\n2. 下一轮先查询 PostHog \`compatibility_pair_evaluated\`，优先统计 \`status=insufficient_data\` 的 pairKey；只有样本量足够时才按真实用户需求排序。若样本仍不足，则 fallback research queue 转到 **\`Channa argus\`**，继续优先寻找 pair-level evidence。\n3. \`PUI-BC-025\` 继续 \`investigating\`；7 profiles / 3 pair rules / recordable 2/132 仍属于 limited knowledge coverage，不能因本批合并而关闭。\n4. **PUI-BC-023 保持 regression_verified → challenge_expansion**：3 个 Challenge candidates 仍是 \`candidate_not_run\`；后续执行走独立授权/评测流程，不把 candidate 当 verified coverage。\n5. \`PUI-BC-027\` 保持 \`regression_verified\`；后续新增 direct pair evidence 必须继续通过 provenance regression。\n6. Golden Path 维持 5 / 5 regression maintenance，不再以新增路径数量作为进度指标。`;
          const nextCount = source.split(oldNext).length - 1;
          if (nextCount !== 1) throw new Error(`Expected one compatibility next-step block, found ${nextCount}`);
          source = source.replace(oldNext, newNext);

          fs.writeFileSync(path, source);
          NODE
      - name: Verify registry and compatibility evidence
        run: |
          npm run test:product-evaluation
          npm run test:compatibility-evidence-coverage
      - name: Commit Handoff and self-delete temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-sync-batch2-postmerge-handoff.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HANDOFF-2026-08-17.md .github/workflows/tmp-sync-batch2-postmerge-handoff.yml
          git diff --cached --check
          git commit -m "Record merged compatibility evidence Batch 2"
          git push origin HEAD:main
