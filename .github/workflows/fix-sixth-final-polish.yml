name: Fix Sixth UI Copy Audit Final Polish

on:
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  cleanup:
    if: github.event.pull_request.head.ref == 'agent/sixth-copy-audit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply final polish
        run: node scripts/fix-sixth-final-polish.mjs
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Verify copy regressions are gone
        run: |
          ! grep -RIn '个的候选，不写入真实鱼缸' src/pages/Aquarium.tsx
          ! grep -RIn "{''}" src/pages/CareEncyclopedia.tsx
          ! grep -RIn --include='*.ts' --include='*.tsx' 'error\.message' src/pages src/components
      - name: Remove one-time files
        run: rm -f scripts/fix-sixth-final-polish.mjs .github/workflows/fix-sixth-final-polish.yml
      - name: Commit final polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No final polish changes to commit"
          else
            git commit -m "fix(ui): polish sixth copy audit"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
