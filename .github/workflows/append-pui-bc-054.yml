name: Append PUI-BC-054

on:
  push:
    branches:
      - agent/result-ux-v1

permissions:
  contents: write

jobs:
  append-product-badcase:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/result-ux-v1
          fetch-depth: 0

      - name: Append canonical product badcase once
        shell: bash
        run: |
          set -euo pipefail
          file='evaluation/product/badcases.v1.jsonl'
          if grep -q '"id":"PUI-BC-054"' "$file"; then
            echo 'PUI-BC-054 already present; nothing to append.'
            exit 0
          fi
          cat >> "$file" <<'EOF'
{"id":"PUI-BC-054","featureId":"tank_copilot","discoveredAt":"2026-08-20","source":"result_ux_fail_before","severity":"high","symptom":"Aquarium 已显示 AI 建缸助手 quick action，且真实 Copilot dialog 实现已存在，但点击入口只触发 feature-preview，正式 Copilot 任务面不可达。","trigger":"从 /aquarium 的更多操作展开并点击 AI 建缸助手。","expected":"点击已发布的 AI 建缸助手入口应直接打开真实 Copilot dialog；生成结果中本地规则继续拥有兼容、风险和是否允许加入的最终权威。","actual":"openTankBuildCopilot 仅 dispatch aquaguide:feature-preview，没有 setIsTankCopilotOpen(true)，用户无法从 live 入口进入已经存在的 Copilot。","rootCauseLayer":"feature_entry_wiring","status":"regression_verified","fixedBy":"582e9e341b0231ae30c6d37fa6536ef0d0498de7","regression":"Fail-before Result UX V1 run 32358918838：前六个 consumers 与 deterministic Copilot contract 全 PASS，Tank Copilot 唯一 FAIL 等待真实 dialog。Final Result UX V1 run 32359908856 on 4a4388f41ffafa902bf6f9bc25e2d2130cd09498 PASS：live entry、local-rule-owned primary action、candidate AI evidence、collapsed explanations、AI/local-rule authority boundary 全通过。"}
EOF
          stats="$(git diff --numstat -- "$file")"
          test "$stats" = $'1\t0\tevaluation/product/badcases.v1.jsonl'
          test "$(grep -c '"'"'"id"'"'":"'"'"PUI-BC-054"'"'"' "$file")" -eq 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Product evaluation registry contract
        run: npm run test:product-evaluation

      - name: Commit guarded append
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- evaluation/product/badcases.v1.jsonl; then
            echo 'No registry change to commit.'
            exit 0
          fi
          test "$(git diff --name-only)" = 'evaluation/product/badcases.v1.jsonl'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- evaluation/product/badcases.v1.jsonl
          git commit -m 'Append PUI-BC-054 Tank Copilot reachability badcase'
          git push origin HEAD:agent/result-ux-v1
