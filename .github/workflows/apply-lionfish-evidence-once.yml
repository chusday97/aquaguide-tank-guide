name: Apply Lionfish Evidence Once

on:
  push:
    branches:
      - agent/reviewed-lionfish-predation-evidence
    paths:
      - '.github/workflows/apply-lionfish-evidence-once.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reviewed-lionfish-predation-evidence
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply exact-anchor evidence hook
        run: node scripts/apply-lionfish-evidence-hook.mjs
      - name: Lionfish reviewed evidence regression
        run: node --import tsx scripts/test-lionfish-reviewed-evidence.ts
      - name: Five-fixture reviewed severe-risk regression
        run: node --import tsx scripts/test-reviewed-severe-risk-regression.ts
      - name: Contextual evidence non-escalation regression
        run: node --import tsx scripts/test-contextual-compatibility-evidence.ts
      - name: Type check
        run: npm run lint
      - name: Commit verified product/test patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/compatibilityEvidence.ts scripts/test-reviewed-severe-risk-regression.ts
          git diff --cached --quiet && exit 0
          git commit -m "Hook reviewed lionfish predation evidence"
          git push origin HEAD:agent/reviewed-lionfish-predation-evidence
