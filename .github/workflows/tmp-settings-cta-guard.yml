name: Temporary Settings CTA guard
on:
  push:
    branches:
      - agent/functional-cta-audit-v2
permissions:
  contents: write
jobs:
  validate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/functional-cta-audit-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply patch
        run: |
          python scripts/tmp_settings_cta_ui.py
          python scripts/tmp_settings_cta_meta.py
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Validate contracts
        run: |
          npm run test:product-evaluation
          npm run test:product-actions
          npm run lint
          npm run build
      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/preview.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/preview.log
          exit 1
      - name: Runtime action regression
        run: AQUAGUIDE_PREVIEW_URL=http://127.0.0.1:4173 npm run test:product-actions-runtime
      - name: Commit verified patch
        run: |
          rm scripts/tmp_settings_cta_ui.py scripts/tmp_settings_cta_meta.py .github/workflows/tmp-settings-cta-guard.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix Settings building feature affordance"
          git push origin HEAD:agent/functional-cta-audit-v2