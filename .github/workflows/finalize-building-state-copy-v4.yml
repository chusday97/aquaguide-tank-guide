name: Finalize Building State Copy V4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-building-state-copy-v4.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply final cleanup
        run: node scripts/finalize-building-state-copy-v4.mjs
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Remove one-time files
        run: rm -f scripts/finalize-building-state-copy-v4.mjs .github/workflows/finalize-building-state-copy-v4.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(ui): finalize muted feature states"
          git push
