name: Product evaluation branch validation
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  validate:
    if: github.head_ref == 'agent/evaluation-states-responsive-drawer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:product-evaluation
      - run: npm run test:responsive-detail-surface
      - run: npm run lint
      - run: npm run build
