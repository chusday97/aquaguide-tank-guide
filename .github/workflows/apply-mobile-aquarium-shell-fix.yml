name: Apply Mobile Aquarium Shell Fix

on:
  push:
    branches:
      - agent/ui-v2-aquarium-foundation
    paths:
      - .github/workflows/apply-mobile-aquarium-shell-fix.yml
      - scripts/apply-mobile-aquarium-shell-fix.mjs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ui-v2-aquarium-foundation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply deterministic source migration
        run: node scripts/apply-mobile-aquarium-shell-fix.mjs
      - name: Commit source changes
        shell: bash
        run: |
          if git diff --quiet -- src/App.tsx src/pages/Aquarium.tsx; then
            echo "Migration already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/pages/Aquarium.tsx
          git commit -m "Unify mobile Aquarium toolbar"
          git push origin HEAD:agent/ui-v2-aquarium-foundation
