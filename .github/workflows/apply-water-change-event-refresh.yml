name: Apply Water Change Event Refresh

on:
  push:
    branches: [agent/fix-aquarium-completion-state]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-aquarium-completion-state
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/patch-water-change-event-refresh.mjs
      - run: |
          git diff --check
          grep -q "const events = await repository.getCareEvents();" src/pages/Aquarium.tsx
          ! grep -q "const events = await repository.getCareEvents(activeAquarium.id);" src/pages/Aquarium.tsx
      - name: Commit refresh and remove temporary tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Aquarium.tsx
          git rm scripts/patch-water-change-event-refresh.mjs .github/workflows/apply-water-change-event-refresh.yml
          git commit -m "fix: preserve care event cache after water change"
          git push origin HEAD:agent/fix-aquarium-completion-state
