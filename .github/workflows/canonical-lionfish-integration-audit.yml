name: Canonical Decision Integration Audit

on:
  push:
    branches:
      - integration/canonical-decision-support-audit
    paths:
      - '.github/workflows/canonical-lionfish-integration-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-run-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/canonical-decision-support-audit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dry-run merge current Care browser-Golden-Path stack
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "integration-audit"
          git config user.email "integration-audit@users.noreply.github.com"
          git rev-parse HEAD > /tmp/integration_audit_base_head
          git fetch origin agent/care-decision-browser-golden-path

          set +e
          git merge --no-commit --no-ff origin/agent/care-decision-browser-golden-path
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U | sort)
            expected=(
              ".github/workflows/product-golden-path.yml"
              "src/services/aquarium/water-change.service.ts"
            )
            printf '%s\n' "${expected[@]}" | sort > /tmp/expected_conflicts
            printf '%s\n' "${conflicts[@]}" | sort > /tmp/actual_conflicts
            echo "Observed integration conflicts:"
            cat /tmp/actual_conflicts
            diff -u /tmp/expected_conflicts /tmp/actual_conflicts || {
              echo "Unexpected conflict set; audit refuses to guess."
              exit 1
            }

            git checkout --ours .github/workflows/product-golden-path.yml
            cp .integration-audit/water-change.service.resolved.ts src/services/aquarium/water-change.service.ts
            git add .github/workflows/product-golden-path.yml src/services/aquarium/water-change.service.ts
          fi

          test -z "$(git diff --name-only --diff-filter=U)"
          test -f .git/MERGE_HEAD
          echo "Current merged tree resolved locally; no merge commit/push will be created."

      - run: npm ci

      - name: Canonical water-change repository boundary
        run: node --import tsx scripts/test-water-change-repository-boundary.ts
      - name: Future-date water-change regression
        run: node --import tsx scripts/test-water-change-history.ts
      - name: Unresolved livestock contract
        run: node --import tsx scripts/test-unresolved-existing-livestock.ts
      - name: Livestock recording regression
        run: node --import tsx scripts/test-livestock-recording.ts
      - name: Species water-type ambiguity regression
        run: node --import tsx scripts/test-species-water-type-ambiguity.ts
      - name: Legacy marine-category contradiction regression
        run: node --import tsx scripts/test-legacy-marine-category-contradictions.ts
      - name: Taxonomy regression
        run: node --import tsx scripts/assert_taxonomy_rules.ts
      - name: Canonical Care aquarium hydration contract
        run: node --import tsx scripts/test-care-aquarium-hydration.ts
      - name: Canonical Care unknown-facts contract
        run: node --import tsx scripts/test-care-unknown-facts.ts
      - name: Care conflict decision-surface contract
        run: node scripts/test-care-conflict-decision-surface.mjs
      - name: Care relocation destination contract
        run: node scripts/test-care-relocation-destination-surface.mjs
      - name: Tank decision context
        run: node --import tsx scripts/test-tank-decision-context.ts
      - name: Decision support orchestration
        run: node --import tsx scripts/test-tank-decision-support-orchestrator.ts
      - name: Relocation destination evaluator
        run: node --import tsx scripts/test-relocation-destination-evaluator.ts
      - name: Quick Diagnosis augmentation
        run: node --import tsx scripts/test-quick-diagnosis-conflict-augmentation.ts
      - name: Read-only Intervention UI contract
        run: node scripts/test-intervention-comparison-ui-contract.mjs
      - name: Contextual behavior evidence
        run: node --import tsx scripts/test-contextual-compatibility-evidence.ts
      - name: Canonical lionfish reviewed predation
        run: node --import tsx scripts/test-lionfish-reviewed-evidence.ts
      - name: Four-fixture reviewed severe-risk regression
        run: node --import tsx scripts/test-reviewed-severe-risk-regression.ts
      - name: Whole-tree TypeScript
        run: npm run lint
      - name: Production build
        run: npm run build

      - name: Install Chromium for canonical browser acceptance
        run: npx playwright install --with-deps chromium
      - name: Start merged-tree preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/aquaguide-canonical-care-decision-preview.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/aquaguide-canonical-care-decision-preview.log
          exit 1
      - name: Canonical Care decision browser Golden Path
        env:
          PREVIEW_URL: http://127.0.0.1:4173
        run: node scripts/verify-care-decision-browser-golden-path.mjs

      - name: Confirm no merge commit
        shell: bash
        run: |
          set -euo pipefail
          test -f .git/MERGE_HEAD
          test "$(git rev-parse HEAD)" = "$(cat /tmp/integration_audit_base_head)"
          echo "Audit remained uncommitted and unpushed."
