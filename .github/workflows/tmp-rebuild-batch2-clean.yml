name: Temporary Rebuild Batch 2 Clean Branch

on:
  push:
    branches:
      - agent/compatibility-evidence-batch-2-clean
    paths:
      - '.github/workflows/tmp-rebuild-batch2-clean.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/compatibility-evidence-batch-2-clean
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Copy audited Batch 2 permanent files only
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/compatibility-evidence-batch-2-oscar-zebrafish
          git checkout origin/agent/compatibility-evidence-batch-2-oscar-zebrafish -- \
            HANDOFF-2026-08-17.md \
            evaluation/product/badcases.v1.jsonl \
            evaluation/product/compatibility-coverage-v1.json \
            scripts/test-compatibility-evidence-coverage.ts \
            src/data/compatibilityEvidence.ts \
            src/lib/tankCompatibilityEngine.ts
      - name: Verify clean transplant
        run: |
          npm run test:product-evaluation
          npm run test:compatibility-evidence-coverage
          npm run lint
      - name: Commit six-file clean transplant and self-delete workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-rebuild-batch2-clean.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            HANDOFF-2026-08-17.md \
            evaluation/product/badcases.v1.jsonl \
            evaluation/product/compatibility-coverage-v1.json \
            scripts/test-compatibility-evidence-coverage.ts \
            src/data/compatibilityEvidence.ts \
            src/lib/tankCompatibilityEngine.ts \
            .github/workflows/tmp-rebuild-batch2-clean.yml
          git diff --cached --check
          git commit -m "Rebuild compatibility evidence Batch 2 on latest main"
          git push origin HEAD:agent/compatibility-evidence-batch-2-clean
