name: RC1 Apply Modal Surface Cleanup Once

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'integration/aquaguide-rc1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout RC1 branch
        uses: actions/checkout@v4
        with:
          ref: integration/aquaguide-rc1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Apply exact-anchor modal cleanup
        run: node scripts/apply-rc1-modal-surface-cleanup-v1.mjs

      - name: Modal surface contract
        run: node scripts/test-ui-modal-surface-contract.mjs

      - name: Existing UI interaction contract
        run: node scripts/test-ui-interaction-repair-v1.mjs

      - name: Type check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Commit repaired product source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Aquarium.tsx
          if git diff --cached --quiet; then
            echo "No Aquarium modal cleanup changes to commit."
            exit 0
          fi
          git commit -m "Reduce non-blocking Aquarium dialogs"
          git push origin HEAD:integration/aquaguide-rc1
