name: Temporary Pair Evidence Provenance Patch

on:
  push:
    branches:
      - agent/compatibility-evidence-batch-2-oscar-zebrafish

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/compatibility-evidence-batch-2-oscar-zebrafish
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply exact-anchor provenance patch
        run: node scripts/tmp-patch-pair-evidence-provenance.mjs
      - name: Verify direct pair evidence and TypeScript
        run: |
          npm run test:compatibility-evidence-coverage
          npm run lint
      - name: Commit patch and self-delete temporary tooling
        run: |
          rm scripts/tmp-patch-pair-evidence-provenance.mjs
          rm .github/workflows/tmp-pair-evidence-provenance.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/tankCompatibilityEngine.ts scripts/tmp-patch-pair-evidence-provenance.mjs .github/workflows/tmp-pair-evidence-provenance.yml
          git diff --cached --quiet && exit 1
          git commit -m "Preserve reviewed pair evidence provenance"
          git push origin HEAD:agent/compatibility-evidence-batch-2-oscar-zebrafish
