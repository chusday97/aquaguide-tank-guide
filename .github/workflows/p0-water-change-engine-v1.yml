name: P0 Water Change Engine V1

on:
  pull_request:
    paths:
      - 'packages/domain-rules/src/water-change.ts'
      - 'packages/domain-rules/src/index.ts'
      - 'src/services/aquarium/water-change-decision.service.ts'
      - 'src/pages/Aquarium.tsx'
      - 'scripts/test-p0-water-change-engine.ts'
      - 'scripts/test-p0-water-change-authority.ts'
      - 'scripts/verify-p0-water-change-browser.mjs'
      - 'package.json'
      - '.github/workflows/p0-water-change-engine-v1.yml'
  workflow_dispatch:

jobs:
  water-change-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Water Change contracts
        run: |
          npm run test:p0-water-change
          npm run test:p0-existing-tank-authority
          npm run test:p0-tank-evidence
          npm run test:p0-tank-state
          npm run test:p0-compatibility
      - name: Type check
        run: npx tsc --noEmit --pretty false
      - name: Production build
        run: npm run build
      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/aquaguide-p0-water-change.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/aquarium >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/aquaguide-p0-water-change.log
          exit 1
      - name: Water Change browser regression
        env:
          PREVIEW_URL: http://127.0.0.1:4173
        run: npm run test:p0-water-change-ui
      - name: Existing Tank authority browser regression
        env:
          PREVIEW_URL: http://127.0.0.1:4173
        run: npm run test:p0-existing-tank-authority-ui
      - name: GP-003 returning user Daily Check
        env:
          PREVIEW_URL: http://127.0.0.1:4173
        run: npm run test:golden-path-gp003-ui
      - name: GP-004 abnormal care
        env:
          PREVIEW_URL: http://127.0.0.1:4173
        run: npm run test:golden-path-gp004-ui
