name: Patch Plant Internal Evaluators

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/patch-plant-internal-evaluators.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/environment-decision-v1
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Stop animal-only evaluators on plant details
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/SpeciesDetailDialog.tsx')
          source = path.read_text()

          old_sex = "  const sexIdentificationGuide = useMemo(() => fish ? getSexIdentificationGuide(fish) : null, [fish]);"
          new_sex = "  const sexIdentificationGuide = useMemo(() => fish && getLifeType(fish) !== 'plant' ? getSexIdentificationGuide(fish) : null, [fish]);"
          assert old_sex in source, 'sex evaluator declaration not found'
          source = source.replace(old_sex, new_sex, 1)

          old_pairs = "  const compatibilityPairs = useMemo(() => {\n    if (!fish || !aquariumContext) return [];"
          new_pairs = "  const compatibilityPairs = useMemo(() => {\n    if (!fish || !aquariumContext || getLifeType(fish) === 'plant') return [];"
          assert old_pairs in source, 'compatibility evaluator declaration not found'
          source = source.replace(old_pairs, new_pairs, 1)

          marker = "  const compatibilityVisualModel = useMemo<VisualResultViewModel | null>(() => {\n    if (!fish) return null;"
          replacement = "  const compatibilityVisualModel = useMemo<VisualResultViewModel | null>(() => {\n    if (!fish || isPlant) return null;"
          assert marker in source, 'compatibility visual model declaration not found'
          source = source.replace(marker, replacement, 1)

          path.write_text(source)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Commit patch and remove one-shot workflow
        run: |
          rm .github/workflows/patch-plant-internal-evaluators.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/SpeciesDetailDialog.tsx .github/workflows/patch-plant-internal-evaluators.yml
          git commit -m "Skip animal evaluators for plant details"
          git push origin HEAD:agent/environment-decision-v1
