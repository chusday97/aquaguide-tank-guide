name: One-time water evidence audit wiring

on:
  push:
    branches: [fix/marine-invertebrate-water-type]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/marine-invertebrate-water-type
          fetch-depth: 0
      - name: Wire shared water evidence into audit and CI
        run: |
          python3 - <<'PY'
          from pathlib import Path

          audit = Path('scripts/audit-species-water-type-fallback.ts')
          text = audit.read_text(encoding='utf-8')

          import_anchor = "import { getLifeType, getSpeciesWaterType, type SpeciesWaterType } from '../src/modules/species/species.service';\n"
          import_replacement = import_anchor + "import { getSpeciesWaterEvidence } from '../src/modules/species/speciesWaterEvidence';\n"
          if text.count(import_anchor) != 1:
              raise SystemExit(f'Expected one audit import anchor, got {text.count(import_anchor)}')
          text = text.replace(import_anchor, import_replacement, 1)

          ceiling = 'const MAX_CATEGORY_FALLBACK_ONLY = 55;'
          if text.count(ceiling) != 1:
              raise SystemExit(f'Expected one fallback ceiling, got {text.count(ceiling)}')
          text = text.replace(ceiling, 'const MAX_CATEGORY_FALLBACK_ONLY = 0;', 1)

          classify_anchor = "  const canonical = getSpeciesWaterType(species);\n  if (canonical === 'saltwater' || canonical === 'brackish') return canonical;\n\n  const lifeType = getLifeType(species);\n"
          classify_replacement = "  const canonical = getSpeciesWaterType(species);\n  if (canonical === 'saltwater' || canonical === 'brackish') return canonical;\n\n  const explicitEvidence = getSpeciesWaterEvidence(species);\n  if (explicitEvidence) return explicitEvidence.primaryWaterType;\n\n  const lifeType = getLifeType(species);\n"
          if text.count(classify_anchor) != 1:
              raise SystemExit(f'Expected one classifier anchor, got {text.count(classify_anchor)}')
          text = text.replace(classify_anchor, classify_replacement, 1)
          audit.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/product-golden-path.yml')
          text = workflow.read_text(encoding='utf-8')
          test_anchor = "          npx tsx scripts/test-water-type-service-consistency.ts\n          npx tsx scripts/test-thorichthys-taxonomy.ts\n"
          test_replacement = "          npx tsx scripts/test-water-type-service-consistency.ts\n          npx tsx scripts/test-thorichthys-taxonomy.ts\n          npx tsx scripts/test-species-water-evidence.ts\n"
          if text.count(test_anchor) != 1:
              raise SystemExit(f'Expected one taxonomy test anchor, got {text.count(test_anchor)}')
          text = text.replace(test_anchor, test_replacement, 1)
          workflow.write_text(text, encoding='utf-8')
          PY

          rm .github/workflows/patch-water-evidence-audit-once.yml
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' '.github/workflows/patch-water-evidence-audit-once.yml' '.github/workflows/product-golden-path.yml' 'scripts/audit-species-water-type-fallback.ts' | sort)"
          if [ "$changed" != "$expected" ]; then
            echo "Unexpected files changed:"
            printf '%s\n' "$changed"
            exit 1
          fi
      - name: Commit zero-fallback audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/audit-species-water-type-fallback.ts .github/workflows/product-golden-path.yml .github/workflows/patch-water-evidence-audit-once.yml
          git commit -m 'test: enforce zero broad water fallback debt'
          git push origin HEAD:fix/marine-invertebrate-water-type
