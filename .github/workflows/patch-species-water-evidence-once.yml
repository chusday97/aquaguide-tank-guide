name: One-time species water evidence wiring

on:
  push:
    branches: [fix/marine-invertebrate-water-type]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/marine-invertebrate-water-type
          fetch-depth: 0
      - name: Wire explicit water evidence
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/modules/species/species.service.ts')
          text = path.read_text(encoding='utf-8')

          old_import = "import { speciesDetailInputSchema, speciesListInputSchema, SpeciesDetailOutput, SpeciesListOutput } from './species.schema';\n"
          new_import = old_import + "import { getSpeciesWaterEvidence } from './speciesWaterEvidence';\n"
          if text.count(old_import) != 1:
              raise SystemExit(f'Expected exactly one species.schema import anchor, got {text.count(old_import)}')
          text = text.replace(old_import, new_import, 1)

          old_anchor = "  if (/汽水|半咸|brackish/i.test(text)) return 'brackish';\n  if (\n"
          new_anchor = "  if (/汽水|半咸|brackish/i.test(text)) return 'brackish';\n\n  const explicitEvidence = getSpeciesWaterEvidence(fish);\n  if (explicitEvidence) return explicitEvidence.primaryWaterType;\n\n  if (\n"
          if text.count(old_anchor) != 1:
              raise SystemExit(f'Expected exactly one water-type anchor, got {text.count(old_anchor)}')
          text = text.replace(old_anchor, new_anchor, 1)

          path.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/patch-species-water-evidence-once.yml
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' '.github/workflows/patch-species-water-evidence-once.yml' 'src/modules/species/species.service.ts' | sort)"
          if [ "$changed" != "$expected" ]; then
            echo "Unexpected files changed:"
            printf '%s\n' "$changed"
            exit 1
          fi
      - name: Commit wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/modules/species/species.service.ts .github/workflows/patch-species-water-evidence-once.yml
          git commit -m 'feat: consume explicit species water evidence'
          git push origin HEAD:fix/marine-invertebrate-water-type
