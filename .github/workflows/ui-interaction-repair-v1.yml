name: UI Interaction Repair V1

on:
  pull_request:
    branches:
      - agent/ui-v2-aquarium-foundation
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/ui-interaction-repair-v1'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout interaction branch
        uses: actions/checkout@v4
        with:
          ref: agent/ui-interaction-repair-v1
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply compatibility result priority once
        shell: bash
        run: |
          if grep -q 'data-compatibility-result' src/components/CompatibilityRiskCalculator.tsx; then
            echo 'Compatibility result priority already applied.'
          else
            node scripts/apply-compatibility-result-priority-fix.mjs
          fi

      - name: UI interaction source contract
        run: node scripts/test-ui-interaction-repair-v1.mjs

      - name: Type check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Commit result-first layout
        shell: bash
        run: |
          git add src/components/CompatibilityRiskCalculator.tsx \
            scripts/test-ui-interaction-repair-v1.mjs \
            scripts/verify-ui-interaction-repair-v1.mjs
          if git diff --cached --quiet; then
            echo 'No result-priority changes to commit.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Prioritize compatibility verdict before selection'
            git push origin HEAD:agent/ui-interaction-repair-v1
          fi

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Start preview
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/aquaguide-ui-interaction-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/aquarium >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/aquaguide-ui-interaction-preview.log
          exit 1

      - name: UI interaction browser regression
        run: node scripts/verify-ui-interaction-repair-v1.mjs

      - name: Upload interaction screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-interaction-repair-v1-screenshots
          path: output/ui-interaction-repair-v1
          if-no-files-found: ignore
