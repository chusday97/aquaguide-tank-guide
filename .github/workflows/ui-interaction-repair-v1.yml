name: UI Interaction Repair V1

on:
  pull_request:
    branches: [main]
    paths:
      - '.agents/skills/aquaguide-ui-ux/**'
      - 'AGENTS.md'
      - 'src/pages/Aquarium.tsx'
      - 'src/pages/Encyclopedia.tsx'
      - 'src/components/CompatibilityRiskCalculator.tsx'
      - 'src/components/SpeciesDetailDialog.tsx'
      - 'src/components/aquarium/**'
      - 'src/components/common/AdaptiveDetailContent.tsx'
      - 'src/components/layout/WorkspaceNavigationProvider.tsx'
      - 'src/components/visual-results/VisualResultCard.tsx'
      - 'scripts/test-ui-interaction-repair-v1.mjs'
      - 'scripts/verify-ui-interaction-repair-v1.mjs'
      - 'scripts/verify-golden-path-species-to-stocking.mjs'
      - 'scripts/verify-golden-path-returning-user-daily-check.mjs'
      - '.github/workflows/ui-interaction-repair-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: UI interaction source contract
        run: node scripts/test-ui-interaction-repair-v1.mjs

      - name: Product evaluation contracts
        run: |
          npm run test:product-evaluation
          npm run test:golden-path-contract
          npm run test:compatibility-evidence-coverage
          npm run test:compatibility-coverage-scorecard
          npm run test:session-events
          node --import tsx scripts/audit-compatibility-evidence-priority.ts
          npm run test:task-entry
          npm run test:core-flow-state-eval
          npm run test:daily-check

      - name: Type check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Start preview
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/aquaguide-ui-interaction-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/aquarium >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/aquaguide-ui-interaction-preview.log
          exit 1

      - name: UI interaction browser regression
        env:
          PREVIEW_URL: http://127.0.0.1:4173
        run: node scripts/verify-ui-interaction-repair-v1.mjs

      - name: Care card action regression
        env:
          PREVIEW_URL: http://127.0.0.1:4173
        run: npm run test:care-card-action-ui

      - name: GP-001 first tank setup browser path
        env:
          PREVIEW_URL: http://127.0.0.1:4173
        run: npm run test:golden-path-gp001-ui

      - name: GP-002 continuous browser path
        env:
          PREVIEW_URL: http://127.0.0.1:4173
        run: npm run test:golden-path-gp002-ui

      - name: GP-003 returning user Daily Check browser path
        env:
          PREVIEW_URL: http://127.0.0.1:4173
        run: npm run test:golden-path-gp003-ui

      - name: GP-004 abnormal care browser path
        env:
          PREVIEW_URL: http://127.0.0.1:4173
        run: npm run test:golden-path-gp004-ui

      - name: GP-005 collection context browser path
        env:
          PREVIEW_URL: http://127.0.0.1:4173
        run: node scripts/verify-golden-path-collection-context.mjs

      - name: Upload interaction screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-interaction-repair-v1-screenshots
          path: output/ui-interaction-repair-v1
          if-no-files-found: ignore
