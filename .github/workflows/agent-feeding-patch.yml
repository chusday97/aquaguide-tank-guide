name: Agent Feeding Canonical Patch

on:
  push:
    branches:
      - agent/fix-aquarium-completion-state

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-aquarium-completion-state
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply narrow Aquarium feeding patch
        run: python3 scripts/apply-feeding-canonical-patch.py
      - run: npm ci
      - run: npm run test:feeding-canonical
      - run: npm run lint
      - name: Commit repaired source and remove temporary patch machinery
        run: |
          git config user.name "AquaGuide Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/agent-feeding-patch.yml scripts/apply-feeding-canonical-patch.py
          git add src/pages/Aquarium.tsx
          git commit -m "fix: make feeding event canonical"
          git push origin HEAD:agent/fix-aquarium-completion-state
