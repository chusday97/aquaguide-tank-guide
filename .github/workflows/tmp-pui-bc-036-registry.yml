name: Temporary PUI-BC-036 Registry

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  append:
    if: github.head_ref == 'agent/aquarium-delete-repository-closure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aquarium-delete-repository-closure
      - name: Append verified badcase
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          path = Path('evaluation/product/badcases.v1.jsonl')
          text = path.read_text()
          if '"id":"PUI-BC-036"' in text:
              raise SystemExit('PUI-BC-036 already exists')
          record = {
            "id": "PUI-BC-036",
            "featureId": "aquarium",
            "discoveredAt": "2026-08-18",
            "source": "functional_cta_audit",
            "severity": "high",
            "symptom": "删除鱼缸在 UI 中直接重写本地 aquariums 数组并调用 persistAquariums，没有经过当前 local/cloud repository；cloud 模式下界面可立即消失，但服务端鱼缸记录并未删除，刷新或重新同步后可能重新出现。",
            "trigger": "cloud repository 模式且至少有两个鱼缸时，从 Aquarium 菜单删除当前或其他鱼缸，再刷新或重新从 cloud repository 读取鱼缸列表。",
            "expected": "删除必须通过当前 AquaGuideRepository 持久化；cloud 模式调用已有 DELETE /aquariums/:id，local 模式更新本地事实源；只有 repository delete 成功后才更新 UI，失败保持确认上下文并允许重试。",
            "actual": "旧 confirmDeleteAquarium 是同步函数，只执行 aquariums.filter + saveAquariums(updated)；saveAquariums 最终只写 local app state。AquaGuideRepository、LocalAquaGuideRepository、ApiAquaGuideRepository 均没有 deleteAquarium，尽管后端已经存在正式 DELETE /aquariums/:id。",
            "rootCauseLayer": "ui_persistence_contract",
            "status": "regression_verified",
            "fixedBy": "aae0ab7bad8c03d24327dd5712a3b8ede9033642",
            "regression": "Fail-before-fix: Product Golden Path #617 / run 32107365771 — 全部 Product evaluation contracts PASS 后，Aquarium delete repository contract FAIL：AquaGuideRepository must expose a deleteAquarium command instead of letting the UI mutate only local cache. Product fix verification: Product Golden Path #621 / run 32107779534 on cleanup head 1f8a98360cc2bfa622ae2bb80b6589b6f1606b24 — Aquarium delete repository contract、typecheck、build、Care card regression 与 GP-001～GP-005 全 PASS。永久 contract 同时锁定 backend DELETE 存在、repository/local/API 三层 delete 能力、API DELETE method、UI await repository、成功反馈与失败 retry path。该 CI 为 deterministic architecture regression，不等同于 connected cloud E2E。"
          }
          with path.open('a') as f:
              if text and not text.endswith('\n'):
                  f.write('\n')
              f.write(json.dumps(record, ensure_ascii=False, separators=(',', ':')) + '\n')
          PY
      - name: Commit registry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evaluation/product/badcases.v1.jsonl
          git commit -m "test: register PUI-BC-036"
          git push origin HEAD:agent/aquarium-delete-repository-closure
