name: Lionfish Clean State

on:
  push:
    branches:
      - agent/reviewed-lionfish-predation-evidence
    paths:
      - '.github/workflows/lionfish-clean-state.yml'
  pull_request:
    paths:
      - '.github/workflows/lionfish-clean-state.yml'
      - 'src/data/compatibilityEvidenceReviewedPredators.ts'
      - 'src/data/compatibilityEvidence.ts'
      - 'scripts/test-lionfish-reviewed-evidence.ts'
      - 'scripts/test-reviewed-severe-risk-regression.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify one-shot write tooling is absent
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/apply-lionfish-evidence-once.yml
          test ! -e .github/workflows/cleanup-lionfish-patch-once.yml
          test ! -e scripts/apply-lionfish-evidence-hook.mjs
      - run: npm ci
      - name: Lionfish reviewed predation regression
        run: node --import tsx scripts/test-lionfish-reviewed-evidence.ts
      - name: Five-fixture severe-risk regression
        run: node --import tsx scripts/test-reviewed-severe-risk-regression.ts
      - name: Contextual evidence non-escalation
        run: node --import tsx scripts/test-contextual-compatibility-evidence.ts
      - name: Type check
        run: npm run lint
