name: Apply Fifth UI Copy Audit

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  cleanup:
    if: github.event.pull_request.head.ref == 'agent/fifth-copy-audit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Fix audit helper
        run: node scripts/fix-fifth-copy-audit-runner.mjs
      - name: Apply approved copy audit
        run: node scripts/apply-fifth-copy-audit.mjs
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Remove one-time migration files
        run: rm -f scripts/apply-fifth-copy-audit.mjs scripts/fix-fifth-copy-audit-runner.mjs .github/workflows/apply-fifth-copy-audit.yml
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No copy changes to commit"
          else
            git commit -m "refactor(ui): apply fifth copy audit"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
