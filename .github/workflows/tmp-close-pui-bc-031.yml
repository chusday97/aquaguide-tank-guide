name: Temporary close PUI-BC-031
on:
  push:
    branches:
      - agent/functional-cta-audit-v2
permissions:
  contents: write
jobs:
  close:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/functional-cta-audit-v2
      - name: Patch verified status
        shell: python
        run: |
          from pathlib import Path
          bad = Path('evaluation/product/badcases.v1.jsonl')
          text = bad.read_text()
          old = '"id":"PUI-BC-031","featureId":"task_entry_navigation","discoveredAt":"2026-08-18","source":"functional_cta_audit","severity":"medium","symptom":"设置页把明确尚未开放的“分享与隐私”与通用/新手引导/意见反馈并列渲染成普通可点击分类，并显示前进箭头；点击只滚到“功能建设中”说明，没有可完成的分享或隐私任务。","trigger":"桌面进入 /settings，点击左侧“分享与隐私”。","expected":"building feature 不应伪装成 live task navigation；导航层直接标记建设中并取消业务 CTA affordance，说明区只保留“了解功能”等明确元动作。","actual":"旧导航使用与 live settings section 相同的 button + ChevronRight，并调用 focusSection(shared-reports)，视觉上承诺可进入设置任务但实际只有建设中说明。","rootCauseLayer":"ui_affordance","status":"fixed","fixedBy":"agent/functional-cta-audit-v2","regression":"runtime action audit 要求 building surface 内无未声明业务按钮；Settings 分享与隐私导航必须为非 button building row，说明区 Learn action 必须显式 data-building-action=learn。最终 head CI 后升级 regression_verified。"'
          assert text.count(old) == 1
          new = old.replace('"status":"fixed"', '"status":"regression_verified"').replace('runtime action audit 要求 building surface 内无未声明业务按钮；Settings 分享与隐私导航必须为非 button building row，说明区 Learn action 必须显式 data-building-action=learn。最终 head CI 后升级 regression_verified。', 'Guard run 32050367545 PASS：30 Badcases、semantic action audit、typecheck/build、runtime browser action audit；PR #86 Product Golden Path #589 / run 32050580987 在 head c4dd478395d31ee93969c76db3c9364aba1e9ab2 上 contracts、typecheck、build、GP-001～GP-005 全 PASS。')
          bad.write_text(text.replace(old, new, 1))

          hand = Path('HANDOFF-2026-08-17.md')
          h = hand.read_text()
          old_h = '`PUI-BC-031` 先记 `fixed`，待 runtime + final Product Golden Path 后再升级。'
          assert h.count(old_h) == 1
          new_h = '`PUI-BC-031` 已 `regression_verified`：Guard Run `32050367545` 通过 30 Badcases、semantic action audit、typecheck/build 与 runtime browser action audit；PR #86 Product Golden Path **#589 / run `32050580987`** 在 head `c4dd478395d31ee93969c76db3c9364aba1e9ab2` 上 contracts、typecheck、build、GP-001～GP-005 全 PASS。'
          hand.write_text(h.replace(old_h, new_h, 1))
      - run: npm ci
      - run: npm run test:product-evaluation
      - name: Commit and self-delete
        run: |
          rm .github/workflows/tmp-close-pui-bc-031.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add evaluation/product/badcases.v1.jsonl HANDOFF-2026-08-17.md .github/workflows/tmp-close-pui-bc-031.yml
          git commit -m "docs: close PUI-BC-031 regression"
          git push origin HEAD:agent/functional-cta-audit-v2