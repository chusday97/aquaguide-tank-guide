name: Compatibility Stage Risk V1

on:
  pull_request:
    branches:
      - agent/uiux-system-refactor-v1

permissions:
  contents: write

jobs:
  validate-stage-risk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/result-ux-v1
          fetch-depth: 0

      - name: Guarded residual life-stage capture migration
        shell: bash
        run: |
          python3 scripts/migrate-life-stage-ui-residuals.py
          if git diff --quiet -- src/pages/Aquarium.tsx; then
            exit 0
          fi
          changed="$(git diff --name-only)"
          test "$changed" = "src/pages/Aquarium.tsx"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/pages/Aquarium.tsx
          git commit -m "Preserve life stage across residual add-species paths"
          git push origin HEAD:agent/result-ux-v1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Same-species life-stage risk contract
        run: npx tsx scripts/test-same-species-stage-risk.ts

      - name: Life-stage capture UI contract
        run: node scripts/test-life-stage-ui-contract.mjs

      - name: Existing compatibility engine regression
        run: npm run test:compatibility

      - name: Type check
        run: npm run lint

      - name: Production build
        run: npm run build
