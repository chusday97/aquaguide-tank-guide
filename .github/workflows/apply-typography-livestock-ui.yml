name: Apply typography and livestock UI

on:
  push:
    branches:
      - agent/right-half-drawer-ui

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[typography-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/right-half-drawer-ui
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply deterministic UI migration
        run: node scripts/apply-typography-livestock-ui.mjs
      - name: Install dependencies
        run: npm ci
      - name: Typography regression
        run: npm run test:typography-system
      - name: Livestock task surface regression
        run: npm run test:livestock-state-surface
      - name: Existing drawer regression
        run: npm run test:responsive-detail-surface
      - name: TypeScript lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Check diff
        run: git diff --check
      - name: Commit validated UI
        run: |
          if git diff --quiet; then
            echo "No migration changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.css src/pages/Aquarium.tsx src/components/aquarium/LivestockRosterDialog.tsx package.json HANDOFF.md
          git commit -m "fix: unify typography and widen livestock task [typography-applied]"
          git push origin HEAD:agent/right-half-drawer-ui
