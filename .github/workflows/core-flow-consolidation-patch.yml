name: Core flow consolidation patch

on:
  push:
    branches:
      - agent/core-flow-eval-v1-v2-main
    paths:
      - scripts/core-flow-consolidation-trigger.txt

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Scope patch to water calendar
        run: python3 scripts/prepare-core-flow-patch.py
      - name: Apply patch
        run: python3 scripts/apply-core-flow-consolidation-patch.py
      - name: Install dependencies
        run: npm ci
      - name: Core flow eval
        run: npm run test:core-flow-state-eval
      - name: Existing regressions
        run: |
          npm run test:compatibility
          npm run test:livestock-recording
          npm run test:daily-check
      - name: Type check
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Commit validated implementation
        run: |
          rm -f .github/workflows/core-flow-consolidation-patch.yml
          rm -f scripts/core-flow-consolidation-trigger.txt
          rm -f scripts/apply-core-flow-consolidation-patch.py
          rm -f scripts/prepare-core-flow-patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(core-flow): close compatibility water and daily save states"
          git push
