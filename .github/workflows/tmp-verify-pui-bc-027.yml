name: Temporary PUI-BC-027 Verification Update

on:
  push:
    branches:
      - agent/compatibility-evidence-batch-2-oscar-zebrafish

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/compatibility-evidence-batch-2-oscar-zebrafish
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Promote verified Badcase
        run: node scripts/tmp-verify-pui-bc-027.mjs
      - name: Verify registry and compatibility evidence
        run: |
          npm run test:product-evaluation
          npm run test:compatibility-evidence-coverage
      - name: Commit verified registry and self-delete temporary tooling
        run: |
          rm scripts/tmp-verify-pui-bc-027.mjs
          rm .github/workflows/tmp-verify-pui-bc-027.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evaluation/product/badcases.v1.jsonl scripts/tmp-verify-pui-bc-027.mjs .github/workflows/tmp-verify-pui-bc-027.yml
          git diff --cached --quiet && exit 1
          git commit -m "Verify direct pair evidence provenance badcase"
          git push origin HEAD:agent/compatibility-evidence-batch-2-oscar-zebrafish
