name: Apply product UX closure v2

on:
  push:
    paths:
      - 'scripts/apply-product-ux-closure-v2.mjs'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply source migration
        run: node scripts/apply-product-ux-closure-v2.mjs
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run lint
      - name: Commit generated source changes
        run: |
          if git diff --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Aquarium.tsx
          git commit -m "fix(product): remove guessed setup defaults and complete category picker"
          git push
