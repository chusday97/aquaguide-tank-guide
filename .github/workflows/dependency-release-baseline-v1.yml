name: Dependency Release Baseline V1

on:
  pull_request:
    branches:
      - agent/uiux-system-refactor-v1
      - integration/aquaguide-rc1

permissions:
  contents: read

jobs:
  production-dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate types and production build
        run: |
          npm run lint
          npm run build

      - name: Capture production dependency audit
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --json > /tmp/npm-audit-prod.json
          status=$?
          echo "npm audit --omit=dev exit code: $status"
          exit 0

      - name: Capture full dependency audit
        shell: bash
        run: |
          set +e
          npm audit --json > /tmp/npm-audit-all.json
          status=$?
          echo "npm audit exit code: $status"
          exit 0

      - name: Summarize dependency baseline
        run: node scripts/summarize-npm-audit.mjs /tmp/npm-audit-prod.json /tmp/npm-audit-all.json

      - name: Block production high and critical findings
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const summary = JSON.parse(fs.readFileSync('dependency-audit-summary.json', 'utf8'));
          const counts = summary.productionCounts ?? {};
          const critical = Number(counts.critical ?? 0);
          const high = Number(counts.high ?? 0);
          console.log(`Production audit counts: ${JSON.stringify(counts)}`);
          if (critical > 0 || high > 0) {
            console.error(`Release blocked: ${critical} critical / ${high} high production dependency findings.`);
            process.exit(1);
          }
          NODE

      - name: Upload dependency audit summary
        uses: actions/upload-artifact@v4
        with:
          name: dependency-release-baseline
          path: dependency-audit-summary.json
          if-no-files-found: error
          retention-days: 14
