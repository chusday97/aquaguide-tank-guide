name: Apply Replacement Alternatives UI Once

on:
  push:
    branches:
      - agent/replacement-alternatives-ui
    paths:
      - .github/workflows/apply-replacement-alternatives-ui-once.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/replacement-alternatives-ui
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply exact-anchor patch
        run: node scripts/apply-replacement-alternatives-ui-patch.mjs
      - name: Risk and alternatives UI contract
        run: node scripts/test-risk-alternatives-ui-contract.mjs
      - name: Replacement recommendation golden cases
        run: node --import tsx scripts/test-replacement-recommendation-engine.ts
      - name: Type check
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Commit verified product patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/SpeciesDetailDialog.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Wire species risk CTA to real alternatives"
          git push origin HEAD:agent/replacement-alternatives-ui
