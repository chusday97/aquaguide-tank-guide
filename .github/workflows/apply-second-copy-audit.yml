name: Apply Second UI Copy Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-second-copy-audit.yml'
      - 'scripts/apply-second-copy-audit.mjs'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply approved copy audit
        run: node scripts/apply-second-copy-audit.mjs
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Remove one-time migration files
        run: rm -f scripts/apply-second-copy-audit.mjs .github/workflows/apply-second-copy-audit.yml
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "refactor(ui): apply second copy audit"
            git push
          fi
