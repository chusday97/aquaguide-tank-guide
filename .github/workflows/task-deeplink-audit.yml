name: Task deeplink audit
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit generic navigation targets
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          patterns = [
            r"navigate\([^\n]{0,100}['\"]/(aquarium|care|encyclopedia|collection)['\"]",
            r"navigateToRoute\([^\n]{0,100}['\"]/(aquarium|care|encyclopedia|collection)['\"]",
            r"window\.location\.(?:assign|href)[^\n]{0,100}['\"]/(aquarium|care|encyclopedia|collection)['\"]",
            r"href=[{]?['\"]/(aquarium|care|encyclopedia|collection)['\"]",
          ]
          for path in Path('src').rglob('*'):
            if path.suffix not in {'.ts','.tsx'}: continue
            text = path.read_text(encoding='utf-8')
            lines = text.splitlines()
            for i,line in enumerate(lines,1):
              if any(re.search(p,line) for p in patterns):
                print(f'{path}:{i}: {line.strip()}')
          print('\n--- taskRoutes usages ---')
          for path in Path('src').rglob('*'):
            if path.suffix not in {'.ts','.tsx'}: continue
            for i,line in enumerate(path.read_text(encoding='utf-8').splitlines(),1):
              if 'taskRoutes.' in line:
                print(f'{path}:{i}: {line.strip()}')
          PY