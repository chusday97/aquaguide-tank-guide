name: Apply UI Copy Cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-ui-copy-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply cleanup
        run: node scripts/apply-ui-copy-cleanup.mjs
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Remove one-time migration files
        run: rm -f scripts/apply-ui-copy-cleanup.mjs .github/workflows/apply-ui-copy-cleanup.yml
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(ui): remove noisy copy and close unfinished surfaces"
          git push
