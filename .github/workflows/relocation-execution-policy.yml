name: Relocation Execution Policy

on:
  push:
    branches:
      - agent/fresh-relocation-execution-policy
  pull_request:
    paths:
      - 'src/lib/relocationExecutionPolicy.ts'
      - 'scripts/test-relocation-execution-policy.ts'
      - 'src/lib/tankDecisionSupportOrchestrator.ts'
      - 'src/lib/relocationDestinationEvaluator.ts'
      - 'src/lib/relocationDestinationContext.ts'
      - '.github/workflows/relocation-execution-policy.yml'

permissions:
  contents: read

jobs:
  execution-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fresh relocation execution policy
        run: node --import tsx scripts/test-relocation-execution-policy.ts
      - name: Tank decision support regression
        run: node --import tsx scripts/test-tank-decision-support-orchestrator.ts
      - name: Destination evaluator regression
        run: node --import tsx scripts/test-relocation-destination-evaluator.ts
      - name: Reviewed severe-risk regression
        run: node --import tsx scripts/test-reviewed-severe-risk-regression.ts
      - name: TypeScript
        run: npm run lint
      - name: Production build
        run: npm run build
