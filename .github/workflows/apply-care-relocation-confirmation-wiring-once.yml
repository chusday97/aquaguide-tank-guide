name: Apply Care Relocation Confirmation Wiring Once

on:
  push:
    branches:
      - agent/canonical-care-relocation-wiring
    paths:
      - '.github/workflows/apply-care-relocation-confirmation-wiring-once.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/canonical-care-relocation-wiring
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Confirm Care wiring verifier fails before patch
        shell: bash
        run: |
          set +e
          node scripts/verify-care-relocation-confirmation-wiring.mjs
          status=$?
          set -e
          test "$status" -ne 0

      - name: Apply exact-anchor Care wiring patch
        run: node scripts/apply-care-relocation-confirmation-wiring-once.mjs

      - name: Care relocation wiring static contract
        run: node scripts/verify-care-relocation-confirmation-wiring.mjs
      - name: Canonical view/mirror fallback regression
        run: node --import tsx scripts/test-care-relocation-canonical-state.ts
      - name: Care relocation controller regression
        run: node --import tsx scripts/test-care-relocation-confirmation-controller.ts
      - name: Confirmation lifecycle contract
        run: node scripts/verify-relocation-confirmation-surface.mjs
      - name: Confirmation entrypoint regression
        run: node --import tsx scripts/test-relocation-confirmation-entrypoint.ts
      - name: Fresh execution policy
        run: node --import tsx scripts/test-relocation-execution-policy.ts
      - name: Mutation uncertainty
        run: node --import tsx scripts/test-relocation-mutation-uncertainty.ts
      - name: Care hydration regression
        run: node --import tsx scripts/test-care-aquarium-hydration.ts
      - name: Reviewed severe-risk regression
        run: node --import tsx scripts/test-reviewed-severe-risk-regression.ts
      - name: App TypeScript
        run: npm run lint
      - name: API TypeScript
        run: npm run check:api
      - name: Production build
        run: npm run build

      - name: Remove one-shot write tooling
        run: rm .github/workflows/apply-care-relocation-confirmation-wiring-once.yml scripts/apply-care-relocation-confirmation-wiring-once.mjs

      - name: Commit verified Care wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No Care wiring changes to commit"; exit 1; }
          git commit -m "Wire canonical relocation confirmation into Care decision surface"
          git push origin HEAD:agent/canonical-care-relocation-wiring
