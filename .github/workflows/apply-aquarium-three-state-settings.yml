name: Apply Aquarium Three-State Settings

on:
  push:
    branches: [agent/fix-aquarium-completion-state]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-aquarium-completion-state
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact page patch
        run: node scripts/patch-aquarium-three-state-settings.mjs
      - name: Validate patch shape
        run: |
          git diff --check
          grep -q "const settingsFacts = getAquariumSetupFacts(settingsForm);" src/pages/Aquarium.tsx
          grep -q "configured: settingsFacts.filterKnown" src/pages/Aquarium.tsx
          grep -q "selected={currentValue === option.value}" src/pages/Aquarium.tsx
          grep -q "Heater not recorded" src/pages/Aquarium.tsx
      - name: Commit page patch and remove temporary tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Aquarium.tsx
          git rm scripts/patch-aquarium-three-state-settings.mjs .github/workflows/apply-aquarium-three-state-settings.yml
          git commit -m "fix: preserve explicit none in aquarium settings"
          git push origin HEAD:agent/fix-aquarium-completion-state
