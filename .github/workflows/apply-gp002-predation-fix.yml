name: Apply GP-002 predation fix

on:
  push:
    branches:
      - agent/golden-path-e2e-v1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact patch
        run: node scripts/apply-gp002-predation-fix.mjs
      - name: Validate patch diff
        run: git diff --check
      - name: Commit patched product and eval code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/speciesFitEngine.ts scripts/test-core-flow-state-eval-v1.ts evaluation/product/badcases.v1.jsonl
          if git diff --cached --quiet; then
            echo "No patch needed."
            exit 0
          fi
          git commit -m "fix: stop reversing prey wording into predator risk"
          git push
