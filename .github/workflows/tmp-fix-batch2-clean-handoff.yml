name: Temporary Fix Batch 2 Clean Handoff

on:
  push:
    branches:
      - agent/compatibility-evidence-batch-2-clean
    paths:
      - '.github/workflows/tmp-fix-batch2-clean-handoff.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/compatibility-evidence-batch-2-clean
          fetch-depth: 0
      - name: Fix final branch and PR references
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'HANDOFF-2026-08-17.md';
          let source = fs.readFileSync(path, 'utf8');
          const replacements = [
            ['分支：`agent/compatibility-evidence-batch-2-oscar-zebrafish`。', '最终合并分支：`agent/compatibility-evidence-batch-2-clean`；原始 research/guard 分支为 `agent/compatibility-evidence-batch-2-oscar-zebrafish`。'],
            ['这是 PR #79 的最终 merge gate。', '这是 PR #80 的最终 merge gate。'],
            ['通过后将 PR #79 转 Ready，并用最终 head SHA 做 squash merge。', '通过后将 PR #80 转 Ready，并用最终 head SHA 做 squash merge。'],
            ['合并后 main Handoff 写入 PR #79 merge SHA 与最终 CI；', '合并后 main Handoff 写入 PR #80 merge SHA 与最终 CI；'],
          ];
          for (const [from, to] of replacements) {
            const count = source.split(from).length - 1;
            if (count !== 1) throw new Error(`Expected one match for ${from}, found ${count}`);
            source = source.replace(from, to);
          }
          fs.writeFileSync(path, source);
          NODE
      - name: Commit Handoff and self-delete workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-fix-batch2-clean-handoff.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HANDOFF-2026-08-17.md .github/workflows/tmp-fix-batch2-clean-handoff.yml
          git diff --cached --check
          git commit -m "Fix Batch 2 clean handoff references"
          git push origin HEAD:agent/compatibility-evidence-batch-2-clean
