name: Apply GP-001 setup guard fix

on:
  push:
    branches:
      - agent/golden-path-gp001-e2e-v1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact setup guard patch
        run: node scripts/apply-gp001-setup-guard-fix.mjs
      - name: Validate diff
        run: git diff --check
      - name: Commit product guard and Badcase
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Aquarium.tsx evaluation/product/badcases.v1.jsonl
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: require explicit first-tank setup facts before save"
          git push
