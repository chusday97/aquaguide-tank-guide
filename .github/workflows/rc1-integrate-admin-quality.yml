name: RC1 Integrate Admin Quality Inbox

on:
  push:
    branches:
      - integration/aquaguide-rc1

permissions:
  contents: write

jobs:
  integrate-admin-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout RC1
        uses: actions/checkout@v4
        with:
          ref: integration/aquaguide-rc1
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Apply Admin Quality Inbox
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_BRANCH=agent/admin-quality-inbox-v1
          git fetch origin "$SOURCE_BRANCH"
          SOURCE_HEAD="$(git rev-parse FETCH_HEAD)"

          if test -f src/pages/AdminFeedback.tsx \
             && test -f src/services/admin/feedback-admin.service.ts \
             && grep -q 'const isAdminFeedback = pathname === .*/admin/feedback' src/main.tsx; then
            echo 'Admin Quality Inbox already integrated; validating existing RC1 state.'
            exit 0
          fi

          for path in \
            src/pages/AdminFeedback.tsx \
            src/services/admin/feedback-admin.service.ts \
            scripts/verify-admin-quality-inbox-contract.mjs \
            scripts/verify-admin-quality-inbox-browser.mjs; do
            git show "$SOURCE_HEAD:$path" > "$path"
          done

          python - <<'PY'
          from pathlib import Path

          path = Path('src/main.tsx')
          source = path.read_text()

          def replace_once(before: str, after: str, label: str):
              global source
              count = source.count(before)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one anchor, found {count}')
              source = source.replace(before, after, 1)

          replace_once(
              "import {StrictMode} from 'react';\nimport {createRoot} from 'react-dom/client';\n",
              "import { StrictMode, useEffect } from 'react';\nimport { createRoot } from 'react-dom/client';\nimport { BrowserRouter, Route, Routes } from 'react-router-dom';\n",
              'React/router imports',
          )
          replace_once(
              "import App from './App.tsx';\n",
              "import App from './App.tsx';\nimport AdminFeedback from './pages/AdminFeedback';\nimport { ToastProvider } from './components/common/ToastProvider';\n",
              'Admin imports',
          )
          replace_once(
              "initializeSessionAnalytics();\n\ncreateRoot(document.getElementById('root')!).render(\n  <StrictMode>\n    <App />\n  </StrictMode>,\n);\n",
              """initializeSessionAnalytics();

function ReloadIntoPrimaryApp() {
  useEffect(() => {
    window.location.reload();
  }, []);
  return null;
}

function AdminFeedbackEntry() {
  return (
    <BrowserRouter>
      <ToastProvider>
        <Routes>
          <Route path="/admin/feedback" element={<AdminFeedback />} />
          <Route path="*" element={<ReloadIntoPrimaryApp />} />
        </Routes>
      </ToastProvider>
    </BrowserRouter>
  );
}

const pathname = typeof window !== 'undefined' ? window.location.pathname : '/';
const isAdminFeedback = pathname === '/admin/feedback';
const showAdminQualityShortcut = pathname === '/admin/content';

createRoot(document.getElementById('root')!).render(
  <StrictMode>
    {isAdminFeedback ? (
      <AdminFeedbackEntry />
    ) : (
      <>
        <App />
        {showAdminQualityShortcut && (
          <a
            href="/admin/feedback"
            data-admin-quality-link
            className="fixed bottom-5 right-5 z-[220] inline-flex min-h-11 items-center rounded-full border border-emerald-100 bg-emerald-800 px-5 text-sm font-black text-white shadow-[0_14px_36px_rgba(15,23,42,0.16)] transition hover:bg-emerald-900 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-emerald-300"
          >
            用户反馈
          </a>
        )}
      </>
    )}
  </StrictMode>,
);
""",
              'Admin entry render',
          )

          for css in [
              "./styles/ui-v2-foundation.css",
              "./styles/ui-v2-aquarium-components.css",
              "./styles/ui-v2-dashboard.css",
              "./styles/ui-v2-shell.css",
          ]:
              if css not in source:
                  raise SystemExit(f'UI V2 CSS import lost during Admin merge: {css}')
          path.write_text(source)
          PY

      - name: Validate combined RC1 source
        run: |
          node scripts/verify-admin-quality-inbox-contract.mjs
          npm run test:product-evaluation
          node scripts/test-aquarium-delete-repository-contract.mjs
          node scripts/test-aquarium-settings-repository-contract.mjs
          node scripts/test-water-change-cloud-persistence-contract.mjs
          node scripts/test-data-storage-repository-mode-contract.mjs
          node scripts/test-ui-interaction-repair-v1.mjs
          node scripts/verify-ui-v2-dashboard-ia.mjs
          npm run lint
          npm run build

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Build synthetic unauthenticated preview
        env:
          VITE_SUPABASE_URL: https://synthetic-auth.supabase.co
          VITE_SUPABASE_ANON_KEY: synthetic-anon-key-for-browser-contract
        run: npm run build

      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/aquaguide-admin-rc1-preview.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/aquaguide-admin-rc1-preview.log
          exit 1

      - name: Admin Quality Inbox browser contract
        env:
          PREVIEW_URL: http://127.0.0.1:4173
        run: node scripts/verify-admin-quality-inbox-browser.mjs

      - name: Commit Admin Quality Inbox integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.tsx src/pages/AdminFeedback.tsx src/services/admin/feedback-admin.service.ts scripts/verify-admin-quality-inbox-contract.mjs scripts/verify-admin-quality-inbox-browser.mjs
          if git diff --cached --quiet; then
            echo 'Admin Quality Inbox already committed.'
            exit 0
          fi
          git commit -m "Integrate Admin Quality Inbox into RC1"
          git pull --rebase origin integration/aquaguide-rc1
          git push origin HEAD:integration/aquaguide-rc1
