name: Product Golden Path

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-calendar-caller-fix:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'agent/water-change-cloud-persistence' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/water-change-cloud-persistence
      - name: Make calendar save callback async
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/pages/Aquarium.tsx')
          text = path.read_text()
          old = """              onClick={() => {
                if (isWaterChangeSaving || isFutureWaterChangeDate(selectedWaterChangeDate)) {"""
          new = """              onClick={async () => {
                if (isWaterChangeSaving || isFutureWaterChangeDate(selectedWaterChangeDate)) {"""
          if old in text:
              path.write_text(text.replace(old, new, 1))
          elif new not in text:
              raise SystemExit('calendar async callback marker not found')
          PY
      - name: Commit caller fix when needed
        run: |
          if git diff --quiet -- src/pages/Aquarium.tsx; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Aquarium.tsx
          git commit -m "fix: await calendar water-change persistence"
          git push origin HEAD:agent/water-change-cloud-persistence

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Product evaluation contracts
        run: |
          npm run test:product-evaluation
          npm run test:golden-path-contract
          npm run test:compatibility-evidence-coverage
          npm run test:compatibility-coverage-scorecard
          npm run test:session-events
          node --import tsx scripts/audit-compatibility-evidence-priority.ts
          npm run test:task-entry
          npm run test:core-flow-state-eval
          npm run test:daily-check
      - name: Water-change cloud persistence contract
        run: node scripts/test-water-change-cloud-persistence-contract.mjs
      - name: Type check
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/aquaguide-preview.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/aquaguide-preview.log
          exit 1
      - name: Care card action regression
        env:
          PREVIEW_URL: http://127.0.0.1:4173
        run: npm run test:care-card-action-ui
      - name: GP-001 first tank setup browser path
        env:
          PREVIEW_URL: http://127.0.0.1:4173
        run: npm run test:golden-path-gp001-ui
      - name: GP-002 continuous browser path
        env:
          PREVIEW_URL: http://127.0.0.1:4173
        run: npm run test:golden-path-gp002-ui
      - name: GP-003 returning user Daily Check browser path
        env:
          PREVIEW_URL: http://127.0.0.1:4173
        run: npm run test:golden-path-gp003-ui
      - name: GP-004 abnormal care browser path
        env:
          PREVIEW_URL: http://127.0.0.1:4173
        run: npm run test:golden-path-gp004-ui
      - name: GP-005 collection context browser path
        env:
          PREVIEW_URL: http://127.0.0.1:4173
        run: node scripts/verify-golden-path-collection-context.mjs