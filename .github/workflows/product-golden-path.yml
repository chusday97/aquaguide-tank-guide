name: Product Golden Path

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, agent/fix-aquarium-completion-state]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply one-time care checklist progress repair
        if: github.event_name == 'push' && hashFiles('.agent-care-checklist-progress-trigger') != ''
        run: |
          python3 scripts/agent-care-checklist-progress-01-core.py
          python3 scripts/agent-care-checklist-progress-02-api-repo.py
          python3 scripts/agent-care-checklist-progress-03-api-contract.py
          python3 scripts/agent-care-checklist-progress-04-care-page.py
          python3 scripts/agent-care-checklist-progress-05-artifacts.py
          git diff --check
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Product evaluation contracts
        run: |
          npm run test:product-evaluation
          npm run test:golden-path-contract
          npm run test:compatibility-evidence-coverage
          npm run test:task-entry
          npm run test:core-flow-state-eval
          npm run test:aquarium-creation-semantics
          npm run test:onboarding-activation
          npm run test:onboarding-goal-paths
          npm run test:feeding-canonical
          npm run test:observation-canonical
          npm run test:diagnosis-repository
          npm run test:memorial-repository
          npm run test:collection-memorial-hydration
          npm run test:favorites-repository
          node --import tsx scripts/test-collection-hub-hydration.ts
          node --import tsx scripts/test-care-aquarium-hydration.ts
          node --import tsx scripts/test-identify-repository-hydration.ts
          node --import tsx scripts/test-search-aquarium-hydration.ts
          node --import tsx scripts/test-onboarding-history-hydration.ts
          node --import tsx scripts/test-home-repository-hydration.ts
          node --import tsx scripts/test-assistant-favorites-hydration.ts
          node --import tsx scripts/test-care-unknown-facts.ts
          node --import tsx scripts/test-care-operation-canonical.ts
          if [ -f scripts/test-care-checklist-progress-canonical.ts ]; then node --import tsx scripts/test-care-checklist-progress-canonical.ts; fi
          node scripts/test-aquarium-settings-boundary.mjs
          node --import tsx scripts/test-aquarium-delete-boundary.ts
          node --import tsx scripts/test-water-change-repository-boundary.ts
          grep -q "const events = await repository.getCareEvents();" src/pages/Aquarium.tsx
      - name: Type check
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/aquaguide-preview.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/aquaguide-preview.log
          exit 1
      - name: GP-002 continuous browser path
        env:
          PREVIEW_URL: http://127.0.0.1:4173
        run: npm run test:golden-path-gp002-ui
      - name: Commit canonical care checklist progress repair
        if: github.event_name == 'push' && hashFiles('.agent-care-checklist-progress-trigger') != ''
        shell: bash
        run: |
          git config user.name "AquaGuide Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .agent-care-checklist-progress-trigger .agent-care-checklist-progress-patch.gz.b64 scripts/agent-care-checklist-progress-01-core.py scripts/agent-care-checklist-progress-02-api-repo.py scripts/agent-care-checklist-progress-03-api-contract.py scripts/agent-care-checklist-progress-04-care-page.py scripts/agent-care-checklist-progress-05-artifacts.py
          git add src/services/care/care-activity.service.ts src/services/repository/aquaguide.repository.ts src/services/repository/local-aquaguide.repository.ts src/services/repository/api-aquaguide.repository.ts packages/contracts/src/business.ts src/types/database.ts apps/api/src/routes/user-records.ts src/pages/CareEncyclopedia.tsx supabase/migrations/20260816072000_care_checklist_progress.sql scripts/test-care-checklist-progress-canonical.ts
          git commit -m "fix: persist care checklist progress canonically"
          git push origin HEAD:agent/fix-aquarium-completion-state
