name: Product Golden Path

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-water-change-fix:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'agent/water-change-cloud-persistence' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/water-change-cloud-persistence
      - name: Apply focused persistence patch
        run: python3 scripts/apply-water-change-cloud-fix.py
      - name: Restore permanent-only workflow and commit product fix
        run: |
          git fetch origin main --depth=1
          git show origin/main:.github/workflows/product-golden-path.yml > /tmp/product-golden-path.yml
          python3 - <<'PY'
          from pathlib import Path
          path = Path('/tmp/product-golden-path.yml')
          text = path.read_text()
          marker = "          npm run test:daily-check\n      - name: Type check"
          replacement = "          npm run test:daily-check\n      - name: Water-change cloud persistence contract\n        run: node scripts/test-water-change-cloud-persistence-contract.mjs\n      - name: Type check"
          if marker not in text:
              raise SystemExit('permanent workflow insertion marker not found')
          path.write_text(text.replace(marker, replacement, 1))
          PY
          cp /tmp/product-golden-path.yml .github/workflows/product-golden-path.yml
          git rm scripts/apply-water-change-cloud-fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Aquarium.tsx src/services/repository/api-aquaguide.repository.ts packages/contracts/src/business.ts .github/workflows/product-golden-path.yml
          git commit -m "fix: persist water-change history across cloud reloads"
          git push origin HEAD:agent/water-change-cloud-persistence

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Product evaluation contracts
        run: |
          npm run test:product-evaluation
          npm run test:golden-path-contract
          npm run test:compatibility-evidence-coverage
          npm run test:compatibility-coverage-scorecard
          npm run test:session-events
          node --import tsx scripts/audit-compatibility-evidence-priority.ts
          npm run test:task-entry
          npm run test:core-flow-state-eval
          npm run test:daily-check
      - name: Water-change cloud persistence contract
        run: node scripts/test-water-change-cloud-persistence-contract.mjs
      - name: Type check
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/aquaguide-preview.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/aquaguide-preview.log
          exit 1
      - name: Care card action regression
        env:
          PREVIEW_URL: http://127.0.0.1:4173
        run: npm run test:care-card-action-ui
      - name: GP-001 first tank setup browser path
        env:
          PREVIEW_URL: http://127.0.0.1:4173
        run: npm run test:golden-path-gp001-ui
      - name: GP-002 continuous browser path
        env:
          PREVIEW_URL: http://127.0.0.1:4173
        run: npm run test:golden-path-gp002-ui
      - name: GP-003 returning user Daily Check browser path
        env:
          PREVIEW_URL: http://127.0.0.1:4173
        run: npm run test:golden-path-gp003-ui
      - name: GP-004 abnormal care browser path
        env:
          PREVIEW_URL: http://127.0.0.1:4173
        run: npm run test:golden-path-gp004-ui
      - name: GP-005 collection context browser path
        env:
          PREVIEW_URL: http://127.0.0.1:4173
        run: node scripts/verify-golden-path-collection-context.mjs