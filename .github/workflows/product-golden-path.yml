name: Product Golden Path

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, agent/fix-aquarium-completion-state]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply one-time favorites repository repair
        if: github.event_name == 'push' && hashFiles('.agent-favorites-trigger') != ''
        run: |
          python3 scripts/apply-favorites-repository-patch.py
          python3 scripts/fix-favorites-memorial-alias.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Product evaluation contracts
        run: |
          npm run test:product-evaluation
          npm run test:golden-path-contract
          npm run test:compatibility-evidence-coverage
          npm run test:task-entry
          npm run test:core-flow-state-eval
          npm run test:aquarium-creation-semantics
          npm run test:onboarding-activation
          npm run test:onboarding-goal-paths
          npm run test:feeding-canonical
          npm run test:observation-canonical
          npm run test:diagnosis-repository
          npm run test:memorial-repository
          npm run test:collection-memorial-hydration
          if [ -f .agent-favorites-trigger ]; then npm run test:favorites-repository; fi
          node scripts/test-aquarium-settings-boundary.mjs
          node --import tsx scripts/test-aquarium-delete-boundary.ts
          node --import tsx scripts/test-water-change-repository-boundary.ts
          grep -q "const events = await repository.getCareEvents();" src/pages/Aquarium.tsx
      - name: Type check
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/aquaguide-preview.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/aquaguide-preview.log
          exit 1
      - name: GP-002 continuous browser path
        env:
          PREVIEW_URL: http://127.0.0.1:4173
        run: npm run test:golden-path-gp002-ui
      - name: Commit one-time favorites repository repair
        if: github.event_name == 'push' && hashFiles('.agent-favorites-trigger') != ''
        shell: bash
        run: |
          git config user.name "AquaGuide Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .agent-favorites-trigger scripts/apply-favorites-repository-patch.py scripts/fix-favorites-memorial-alias.py
          git add src/services/repository/aquaguide.repository.ts src/services/repository/local-aquaguide.repository.ts src/services/repository/api-aquaguide.repository.ts apps/api/src/routes/user-records.ts src/services/collection/collection.service.ts src/pages/Collection.tsx src/pages/Encyclopedia.tsx src/pages/CareEncyclopedia.tsx package.json scripts/test-favorites-repository-boundary.ts
          git commit -m "fix: persist and hydrate favorites canonically"
          git push origin HEAD:agent/fix-aquarium-completion-state
