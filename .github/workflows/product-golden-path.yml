name: Product Golden Path

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, labeled]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    # Full browser/G​​olden/Visual/history checks are intentionally opt-in for
    # PRs. A normal commit is covered by CI Lite; a critical or merge-ready
    # label, a manual run, or a post-merge main push runs this job.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      contains(github.event.pull_request.labels.*.name, 'critical') ||
      contains(github.event.pull_request.labels.*.name, 'merge-ready')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Product evaluation contracts
        run: |
          npm run test:product-evaluation
          npm run test:golden-path-contract
          npm run test:compatibility-evidence-coverage
          npm run test:compatibility-coverage-scorecard
          npm run test:session-events
          node --import tsx scripts/audit-compatibility-evidence-priority.ts
          npm run test:task-entry
          npm run test:core-flow-state-eval
          npm run test:daily-check
      - name: Type check
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/aquaguide-preview.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/aquaguide-preview.log
          exit 1
      - name: Care card action regression
        env:
          PREVIEW_URL: http://127.0.0.1:4173
        run: npm run test:care-card-action-ui
      - name: Golden, visual and history regression
        env:
          PREVIEW_URL: http://127.0.0.1:4173
          AQUAGUIDE_PREVIEW_URL: http://127.0.0.1:4173
        run: |
          npm run test:core-ui
          npm run test:formal-preview-entry
          npm run test:formal-scenes
          npm run test:responsive-routes
          npm run test:responsive-detail-surface
          npm run test:visual-layout
          npm run test:collection-hub-ui
          npm run test:species-detail-ui
          npm run test:mobile-care-ui
          npm run test:visual-results
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-layout-${{ github.sha }}
          path: artifacts/ci-visual/
          if-no-files-found: ignore
      - name: History interaction regression
        env:
          PREVIEW_URL: http://127.0.0.1:4173
        run: |
          npm run test:interaction-consistency
          npm run test:guided-navigation-ui
          npm run test:disclosures
      - name: GP-001 first tank setup browser path
        env:
          PREVIEW_URL: http://127.0.0.1:4173
        run: npm run test:golden-path-gp001-ui
      - name: GP-002 continuous browser path
        env:
          PREVIEW_URL: http://127.0.0.1:4173
        run: npm run test:golden-path-gp002-ui
      - name: GP-003 returning user Daily Check browser path
        env:
          PREVIEW_URL: http://127.0.0.1:4173
        run: npm run test:golden-path-gp003-ui
      - name: GP-004 abnormal care browser path
        env:
          PREVIEW_URL: http://127.0.0.1:4173
        run: npm run test:golden-path-gp004-ui
      - name: GP-005 collection context browser path
        env:
          PREVIEW_URL: http://127.0.0.1:4173
        run: node scripts/verify-golden-path-collection-context.mjs
