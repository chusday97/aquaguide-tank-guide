name: Product Golden Path

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-settings-fix:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/aquarium-settings-repository-closure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aquarium-settings-repository-closure
      - name: Apply focused settings persistence patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/pages/Aquarium.tsx')
          text = path.read_text()

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one marker, got {count}')
              text = text.replace(old, new, 1)

          replace_once(
              "  const [isSettingsOpen, setIsSettingsOpen] = useState(false);\n",
              "  const [isSettingsOpen, setIsSettingsOpen] = useState(false);\n  const [isSettingsSaving, setIsSettingsSaving] = useState(false);\n",
              'settings saving state',
          )

          handler_marker = "  const handleRenameSubmit = async () => {\n"
          handler = """  const handleSaveAquariumSettings = async () => {
    if (!activeAquarium || isSettingsSaving) return;
    setIsSettingsSaving(true);
    try {
      const repository = await getCurrentAquaGuideRepository();
      const savedAquarium = await repository.saveAquarium({ ...activeAquarium, ...settingsForm });
      setAquariums(current => current.map(aquarium => aquarium.id === savedAquarium.id ? savedAquarium : aquarium));
      markAquariumConfigured();
      setIsSettingsOpen(false);
      showToast(isEn ? 'Aquarium settings saved' : '鱼缸设置已保存');
      try {
        await persistCareTimelineEvent({
          aquariumId: savedAquarium.id,
          eventType: 'settings_updated',
          title: isEn ? 'Updated aquarium settings' : '更新鱼缸设置',
          label: isEn ? 'Environment and equipment settings saved' : '已保存环境与设备配置',
          payload: {},
          occurredAt: new Date().toISOString(),
          sourceType: 'aquarium_settings',
          sourceId: `${savedAquarium.id}:${Date.now()}`,
          isInferred: false,
        });
      } catch (error) {
        showToast(isEn ? 'Settings were saved, but the timeline entry could not be recorded.' : '设置已保存，但设置时间线没有记录成功。', 'error');
      }
    } catch (error) {
      showToast(isEn ? 'Aquarium settings were not saved. Please try again.' : '鱼缸设置没有保存成功，请重试。', 'error');
    } finally {
      setIsSettingsSaving(false);
    }
  };

"""
          replace_once(handler_marker, handler + handler_marker, 'settings handler insertion')

          text, dialog_count = re.subn(
              r'<Dialog open=\{isSettingsOpen\} onOpenChange=\{setIsSettingsOpen\}>',
              "<Dialog open={isSettingsOpen} onOpenChange={(open) => { if (!isSettingsSaving || open) setIsSettingsOpen(open); }}>",
              text,
              count=1,
          )
          if dialog_count != 1:
              raise SystemExit(f'settings dialog guard: expected one replacement, got {dialog_count}')

          old_footer = """          <DialogFooter className=\"shrink-0 border-t border-white bg-white/95 px-5 pb-[calc(20px+env(safe-area-inset-bottom))] pt-3 md:px-6\">
            <Button variant=\"outline\" onClick={() => setIsSettingsOpen(false)} className=\"h-10 min-w-[112px] rounded-full text-sm font-bold\">{isEn ? \"Cancel\" : \"取消\"}</Button>
            <Button onClick={() => {
              const updated = aquariums.map(a => a.id === activeId ? { ...a, ...settingsForm } : a);
              saveAquariums(updated);
              void persistCareTimelineEvent({
                aquariumId: activeAquarium.id,
                eventType: 'settings_updated',
                title: isEn ? 'Updated aquarium settings' : '更新鱼缸设置',
                label: isEn ? 'Environment and equipment settings saved' : '已保存环境与设备配置',
                payload: {},
                occurredAt: new Date().toISOString(),
                sourceType: 'aquarium_settings',
                sourceId: `${activeAquarium.id}:${Date.now()}`,
                isInferred: false,
              }).catch(error => showToast('设置时间线没有保存成功。', 'error'));
              markAquariumConfigured();
              setIsSettingsOpen(false);
            }} className=\"h-10 min-w-[128px] rounded-full bg-accent text-sm font-bold text-white hover:bg-accent/90\">{isEn ? 'Save Settings' : '保存设置'}</Button>
          </DialogFooter>"""
          new_footer = """          <DialogFooter className=\"shrink-0 border-t border-white bg-white/95 px-5 pb-[calc(20px+env(safe-area-inset-bottom))] pt-3 md:px-6\">
            <Button variant=\"outline\" disabled={isSettingsSaving} onClick={() => setIsSettingsOpen(false)} className=\"h-10 min-w-[112px] rounded-full text-sm font-bold\">{isEn ? \"Cancel\" : \"取消\"}</Button>
            <Button
              disabled={isSettingsSaving}
              onClick={() => void handleSaveAquariumSettings()}
              className=\"h-10 min-w-[128px] rounded-full bg-accent text-sm font-bold text-white hover:bg-accent/90 disabled:bg-ink/15 disabled:text-ink/35\"
            >
              {isSettingsSaving && <Loader2 className=\"mr-2 h-4 w-4 animate-spin\" />}
              {isSettingsSaving ? (isEn ? 'Saving…' : '保存中…') : (isEn ? 'Save Settings' : '保存设置')}
            </Button>
          </DialogFooter>"""
          replace_once(old_footer, new_footer, 'settings footer')
          path.write_text(text)
          PY

      - name: Restore clean permanent workflow and commit product fix
        run: |
          cat > .github/workflows/product-golden-path.yml <<'YAML'
          name: Product Golden Path

          on:
            pull_request:
              branches: [main]
            push:
              branches: [main]

          jobs:
            validate:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: 22
                    cache: npm
                - run: npm ci
                - run: npx playwright install --with-deps chromium
                - name: Product evaluation contracts
                  run: |
                    npm run test:product-evaluation
                    npm run test:golden-path-contract
                    npm run test:compatibility-evidence-coverage
                    npm run test:compatibility-coverage-scorecard
                    npm run test:session-events
                    node --import tsx scripts/audit-compatibility-evidence-priority.ts
                    npm run test:task-entry
                    npm run test:core-flow-state-eval
                    npm run test:daily-check
                - name: Aquarium settings repository contract
                  run: node scripts/test-aquarium-settings-repository-contract.mjs
                - name: Type check
                  run: npm run lint
                - name: Build
                  run: npm run build
                - name: Start preview
                  run: |
                    npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/aquaguide-preview.log 2>&1 &
                    for i in $(seq 1 40); do
                      if curl -fsS http://127.0.0.1:4173 >/dev/null; then exit 0; fi
                      sleep 1
                    done
                    cat /tmp/aquaguide-preview.log
                    exit 1
                - name: Care card action regression
                  env:
                    PREVIEW_URL: http://127.0.0.1:4173
                  run: npm run test:care-card-action-ui
                - name: GP-001 first tank setup browser path
                  env:
                    PREVIEW_URL: http://127.0.0.1:4173
                  run: npm run test:golden-path-gp001-ui
                - name: GP-002 continuous browser path
                  env:
                    PREVIEW_URL: http://127.0.0.1:4173
                  run: npm run test:golden-path-gp002-ui
                - name: GP-003 returning user Daily Check browser path
                  env:
                    PREVIEW_URL: http://127.0.0.1:4173
                  run: npm run test:golden-path-gp003-ui
                - name: GP-004 abnormal care browser path
                  env:
                    PREVIEW_URL: http://127.0.0.1:4173
                  run: npm run test:golden-path-gp004-ui
                - name: GP-005 collection context browser path
                  env:
                    PREVIEW_URL: http://127.0.0.1:4173
                  run: node scripts/verify-golden-path-collection-context.mjs
          YAML
          rm -f .github/workflows/tmp-aquarium-settings-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Aquarium.tsx .github/workflows/product-golden-path.yml .github/workflows/tmp-aquarium-settings-fix.yml
          git commit -m "fix: persist aquarium settings through repository"
          git push origin HEAD:agent/aquarium-settings-repository-closure

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Product evaluation contracts
        run: |
          npm run test:product-evaluation
          npm run test:golden-path-contract
          npm run test:compatibility-evidence-coverage
          npm run test:compatibility-coverage-scorecard
          npm run test:session-events
          node --import tsx scripts/audit-compatibility-evidence-priority.ts
          npm run test:task-entry
          npm run test:core-flow-state-eval
          npm run test:daily-check
      - name: Aquarium settings repository contract
        run: node scripts/test-aquarium-settings-repository-contract.mjs
      - name: Type check
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/aquaguide-preview.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/aquaguide-preview.log
          exit 1
      - name: Care card action regression
        env:
          PREVIEW_URL: http://127.0.0.1:4173
        run: npm run test:care-card-action-ui
      - name: GP-001 first tank setup browser path
        env:
          PREVIEW_URL: http://127.0.0.1:4173
        run: npm run test:golden-path-gp001-ui
      - name: GP-002 continuous browser path
        env:
          PREVIEW_URL: http://127.0.0.1:4173
        run: npm run test:golden-path-gp002-ui
      - name: GP-003 returning user Daily Check browser path
        env:
          PREVIEW_URL: http://127.0.0.1:4173
        run: npm run test:golden-path-gp003-ui
      - name: GP-004 abnormal care browser path
        env:
          PREVIEW_URL: http://127.0.0.1:4173
        run: npm run test:golden-path-gp004-ui
      - name: GP-005 collection context browser path
        env:
          PREVIEW_URL: http://127.0.0.1:4173
        run: node scripts/verify-golden-path-collection-context.mjs