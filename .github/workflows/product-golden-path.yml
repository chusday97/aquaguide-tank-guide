name: Product Golden Path

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, agent/fix-aquarium-completion-state]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply one-time diagnosis repository repair
        if: github.event_name == 'push' && hashFiles('.agent-diagnosis-trigger') != ''
        run: |
          python3 scripts/apply-diagnosis-repository-patch.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/services/repository/api-aquaguide.repository.ts')
          text = path.read_text()
          old = """  const source = sourceType === 'manual' || sourceType === 'care_article' || sourceType === 'home'
    ? { type: sourceType, title: sourceTitle }
    : undefined;
"""
          new = """  const source: DiagnosisRecord['source'] = sourceType === 'manual'
    ? { type: 'manual', title: sourceTitle }
    : sourceType === 'care_article'
      ? { type: 'care_article', title: sourceTitle }
      : sourceType === 'home'
        ? { type: 'home', title: sourceTitle }
        : undefined;
"""
          if text.count(old) != 1:
              raise SystemExit(f'diagnosis source typing: expected 1 match, got {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Product evaluation contracts
        run: |
          npm run test:product-evaluation
          npm run test:golden-path-contract
          npm run test:compatibility-evidence-coverage
          npm run test:task-entry
          npm run test:core-flow-state-eval
          npm run test:aquarium-creation-semantics
          npm run test:onboarding-activation
          npm run test:onboarding-goal-paths
          npm run test:feeding-canonical
          npm run test:observation-canonical
          npm run test:diagnosis-repository
          node scripts/test-aquarium-settings-boundary.mjs
          node --import tsx scripts/test-aquarium-delete-boundary.ts
          node --import tsx scripts/test-water-change-repository-boundary.ts
          grep -q "const events = await repository.getCareEvents();" src/pages/Aquarium.tsx
      - name: Type check
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/aquaguide-preview.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/aquaguide-preview.log
          exit 1
      - name: GP-002 continuous browser path
        env:
          PREVIEW_URL: http://127.0.0.1:4173
        run: npm run test:golden-path-gp002-ui
      - name: Commit one-time diagnosis repository repair
        if: github.event_name == 'push' && hashFiles('.agent-diagnosis-trigger') != ''
        shell: bash
        run: |
          git config user.name "AquaGuide Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .agent-diagnosis-trigger scripts/apply-diagnosis-repository-patch.py
          git add src/services/repository/aquaguide.repository.ts src/services/repository/local-aquaguide.repository.ts src/services/repository/api-aquaguide.repository.ts apps/api/src/routes/user-records.ts src/pages/Aquarium.tsx package.json
          git commit -m "fix: persist diagnosis records canonically"
          git push origin HEAD:agent/fix-aquarium-completion-state
