name: Verify Relocation Request Builder Journal Once

on:
  push:
    branches:
      - agent/relocation-confirmation-surface
    paths:
      - '.github/workflows/verify-relocation-request-builder-journal-once.yml'

permissions:
  contents: write

jobs:
  journal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/relocation-confirmation-surface
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Re-run request-builder gate
        run: node --import tsx scripts/test-relocation-confirmation-request-builder.ts
      - name: Update PUI-BC-024 and HANDOFF checkpoint 4
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'evaluation/product/badcases.v1.jsonl';
          let text = fs.readFileSync(path, 'utf8');
          const lines = text.trimEnd().split('\n');
          const idx = lines.findIndex(line => JSON.parse(line).id === 'PUI-BC-024');
          if (idx < 0) throw new Error('PUI-BC-024 not found');
          const record = JSON.parse(lines[idx]);
          record.actual = 'request-builder 现在只有在 canonical formal subject 唯一映射到一个 factual source record，且该 record 只有一个正数量 batch、record/batch 数量都等于完整 formal quantity 时才返回 ready；多 record、多 batch、缺 batch、数量漂移和空 operationId 全部 fail closed。';
          record.status = 'regression_verified';
          record.fixedBy = 'agent/relocation-confirmation-surface';
          record.verification = 'request-builder regression covers ready single-record/single-batch plus multi-record, multi-batch, quantity drift, missing batch, batch mismatch and blank operationId; confirmation trigger/state/UI, fresh policy, mutation uncertainty, TypeScript and production build all passed in the same permanent CI.';
          lines[idx] = JSON.stringify(record);
          fs.writeFileSync(path, `${lines.join('\n')}\n`);
          NODE
          cat >> HANDOFF.md <<'EOF'

          ## 2026-08-17 Relocation request-builder — checkpoint 4

          - `PUI-BC-024` 已完成回归验证并更新为 `regression_verified`。
          - 新增 `buildRelocationConfirmationRequest(...)` 纯 request-builder：它不做安全授权，只把 formal whole-subject intent 映射到 v1 可表达的 factual request。
          - `ready` 只允许：canonical subject 数量未漂移 + 唯一 `sourceRecordId` + record 数量等于 formal quantity + 恰好一个正数量 batch + batch 数量等于 formal quantity + 外部传入稳定非空 `operationId`。
          - fail-closed 已覆盖：多 source record、多 batch、缺 batch、formal quantity 漂移、record/batch 数量不一致、空 operationId。没有 `find-first` / `batches[0]` 兜底。
          - permanent confirmation CI 已同时通过：confirmation trigger、request-builder、confirmation state/UI、fresh execution policy、mutation uncertainty、TypeScript、production build。
          - 下一步暂不直接 Care 接线：发现 Draft PR #65 已存在高度重叠的 factual-source `buildRelocationConfirmationEntrypoint`。必须先比较 #65 与最新 #64，选择唯一 source-scope boundary，避免维护两套 request/entrypoint 逻辑。
          EOF
      - name: Validate product registry
        run: npm run test:product-evaluation
      - name: Commit journal only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HANDOFF.md evaluation/product/badcases.v1.jsonl
          git commit -m "Verify relocation request-builder badcase"
          git push origin HEAD:agent/relocation-confirmation-surface
