name: RC1 Integrate Water Change Persistence

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  integrate-water-change:
    if: github.head_ref == 'integration/aquaguide-rc1'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RC1
        uses: actions/checkout@v4
        with:
          ref: integration/aquaguide-rc1
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply water-change persistence layer
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_BASE=ed0cf38025652db901ee81aa697ca55b1c1584b6
          SOURCE_BRANCH=agent/water-change-cloud-persistence
          git fetch origin "$SOURCE_BRANCH"
          SOURCE_HEAD="$(git rev-parse FETCH_HEAD)"

          if grep -q 'const runWaterChangeRollbacks = async' src/pages/Aquarium.tsx \
             && test -f scripts/test-water-change-cloud-persistence-contract.mjs \
             && grep -q '"id":"PUI-BC-038"' evaluation/product/badcases.v1.jsonl; then
            echo 'Water-change persistence already integrated; validating existing RC1 state.'
            exit 0
          fi

          git show "$SOURCE_HEAD:HANDOFF-2026-08-18-PUI-BC-038.md" > HANDOFF-2026-08-18-PUI-BC-038.md
          git show "$SOURCE_HEAD:scripts/test-water-change-cloud-persistence-contract.mjs" > scripts/test-water-change-cloud-persistence-contract.mjs

          git diff "$SOURCE_BASE" "$SOURCE_HEAD" -- \
            src/pages/Aquarium.tsx \
            src/services/aquarium/water-change.service.ts \
            src/services/repository/api-aquaguide.repository.ts \
            packages/contracts/src/business.ts \
            > /tmp/water-change.patch
          git apply --check /tmp/water-change.patch
          git apply /tmp/water-change.patch

          python - <<'PY'
          from pathlib import Path
          import subprocess

          badcases = Path('evaluation/product/badcases.v1.jsonl')
          current = badcases.read_text()
          if '"id":"PUI-BC-038"' not in current:
              source = subprocess.check_output([
                  'git','show',
                  'FETCH_HEAD:evaluation/product/badcases.v1.jsonl'
              ], text=True)
              matches = [line for line in source.splitlines() if '"id":"PUI-BC-038"' in line]
              if len(matches) != 1:
                  raise SystemExit(f'expected exactly one PUI-BC-038 source line, found {len(matches)}')
              badcases.write_text(current.rstrip('\n') + '\n' + matches[0] + '\n')
          PY

      - name: Validate persistence convergence
        run: |
          npm run test:product-evaluation
          node scripts/test-aquarium-delete-repository-contract.mjs
          node scripts/test-aquarium-settings-repository-contract.mjs
          node scripts/test-water-change-cloud-persistence-contract.mjs
          npm run lint
          npm run build

      - name: Commit RC1 water-change product integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/pages/Aquarium.tsx \
            src/services/aquarium/water-change.service.ts \
            src/services/repository/api-aquaguide.repository.ts \
            packages/contracts/src/business.ts \
            evaluation/product/badcases.v1.jsonl \
            HANDOFF-2026-08-18-PUI-BC-038.md \
            scripts/test-water-change-cloud-persistence-contract.mjs
          if git diff --cached --quiet; then
            echo "No product changes to commit."
            exit 0
          fi
          git commit -m "Integrate water-change persistence into RC1"
          git pull --rebase origin integration/aquaguide-rc1
          git push origin HEAD:integration/aquaguide-rc1
