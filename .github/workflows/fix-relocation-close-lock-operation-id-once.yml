name: Fix Relocation Close Lock And Operation Identity Once

on:
  push:
    branches:
      - agent/canonical-care-relocation-wiring
    paths:
      - '.github/workflows/fix-relocation-close-lock-operation-id-once.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/canonical-care-relocation-wiring
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Add blank operation id regression
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = 'scripts/test-care-relocation-confirmation-controller.ts';
          let source = fs.readFileSync(path, 'utf8');
          const anchor = `\nconsole.log('Care relocation confirmation controller passed: one attempt owns one operation id and one repository session; fresh pre/post loads are repository-backed; reconcile never mutates');\n`;
          const test = `\n// Invalid operation identity must fail before repository resolution or any read/write.\n{\n  let repositoryResolutionCalls = 0;\n  const harness = makeRepository();\n  assert.throws(() => createCareRelocationConfirmationController({\n    candidate: launchCandidate,\n    catalog,\n    createOperationId: () => '   ',\n    getRepository: async () => {\n      repositoryResolutionCalls += 1;\n      return harness.repository;\n    },\n  }), /operation identity/i);\n  assert.equal(repositoryResolutionCalls, 0);\n  assert.equal(harness.calls.getAquariums, 0);\n  assert.equal(harness.calls.relocateLivestock, 0);\n}\n`;
          if ((source.split(anchor).length - 1) !== 1) throw new Error('controller test anchor must be unique');
          source = source.replace(anchor, `${test}${anchor}`);
          fs.writeFileSync(path, source);
          NODE
      - name: Confirm blank operation id regression fails before patch
        shell: bash
        run: |
          set +e
          node --import tsx scripts/test-care-relocation-confirmation-controller.ts
          status=$?
          set -e
          test "$status" -ne 0
      - name: Apply controller and Base UI close-lock patch
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');

          const controllerPath = 'src/services/care/care-relocation-confirmation.controller.ts';
          let controller = fs.readFileSync(controllerPath, 'utf8');
          const opAnchor = `  const operationId = createOperationId();\n  const request: RelocationExecutionRequest = {`;
          const opReplacement = `  const operationId = createOperationId();\n  if (!operationId.trim()) {\n    throw new Error('Relocation operation identity must be a non-empty string.');\n  }\n  const request: RelocationExecutionRequest = {`;
          if ((controller.split(opAnchor).length - 1) !== 1) throw new Error('operation id anchor must be unique');
          controller = controller.replace(opAnchor, opReplacement);
          fs.writeFileSync(controllerPath, controller);

          const dialogPath = 'src/components/compatibility/RelocationConfirmationDialog.tsx';
          let dialog = fs.readFileSync(dialogPath, 'utf8');
          const rootAnchor = `    <Dialog\n      open={open}\n      onOpenChange={(nextOpen) => {\n        if (!nextOpen && !canClose) return;\n        onOpenChange(nextOpen);\n      }}\n    >`;
          const rootReplacement = `    <Dialog\n      open={open}\n      disablePointerDismissal={!canClose}\n      onOpenChange={(nextOpen, eventDetails) => {\n        if (!nextOpen && !canClose) {\n          eventDetails.cancel();\n          return;\n        }\n        onOpenChange(nextOpen);\n      }}\n    >`;
          if ((dialog.split(rootAnchor).length - 1) !== 1) throw new Error('dialog root anchor must be unique');
          dialog = dialog.replace(rootAnchor, rootReplacement);
          fs.writeFileSync(dialogPath, dialog);

          const verifyPath = 'scripts/verify-relocation-confirmation-surface.mjs';
          let verify = fs.readFileSync(verifyPath, 'utf8');
          const verifyAnchor = `assert.match(component, /if \\(!nextOpen && !canClose\\) return/);\n`;
          const verifyReplacement = `assert.match(component, /disablePointerDismissal=\\{!canClose\\}/);\nassert.match(component, /onOpenChange=\\{\\(nextOpen, eventDetails\\) => \\{[\\s\\S]*if \\(!nextOpen && !canClose\\) \\{[\\s\\S]*eventDetails\\.cancel\\(\\)/);\n`;
          if ((verify.split(verifyAnchor).length - 1) !== 1) throw new Error('verification anchor must be unique');
          verify = verify.replace(verifyAnchor, verifyReplacement);
          fs.writeFileSync(verifyPath, verify);
          NODE
      - name: Controller regression
        run: node --import tsx scripts/test-care-relocation-confirmation-controller.ts
      - name: Confirmation surface static contract
        run: node scripts/verify-relocation-confirmation-surface.mjs
      - name: TypeScript
        run: npm run lint
      - name: API TypeScript
        run: npm run check:api
      - name: Production build
        run: npm run build
      - name: Journal verified local gates pending Chromium
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          fs.appendFileSync('HANDOFF.md', [
            '',
            '## 2026-08-17 Relocation topology convergence — checkpoint 9',
            '',
            '- Correct UI-library contract confirmed: project dialog wrapper is `@base-ui/react/dialog` 1.4, and `DialogContent` is a `Dialog.Popup`; the failed Radix-style popup-event patch was discarded.',
            '- PUI-BC-028 fix now uses Base UI Root semantics: `eventDetails.cancel()` cancels blocked close requests (including Escape), while `disablePointerDismissal={!canClose}` blocks outside presses. Both are driven by the existing single `canClose` predicate.',
            '- PUI-BC-027 fix validates generated operationId synchronously before constructing the execution request; its regression first failed on the old controller and now proves zero repository resolution/read/write on blank identity.',
            '- Controller regression, confirmation static contract, app TypeScript, API TypeScript and production build passed before commit. PUI-BC-027/028 remain browser-revalidation pending until latest-head Care relocation Chromium GP-REL-04/05 pass.',
            '',
          ].join('\n'));

          const path = 'evaluation/product/badcases.v1.jsonl';
          const lines = fs.readFileSync(path, 'utf8').trimEnd().split('\n').map(line => {
            const item = JSON.parse(line);
            if (item.id === 'PUI-BC-027') {
              return JSON.stringify({
                ...item,
                actual: 'Blank operationId regression 已先在旧 controller 上失败；修复后 controller 在 repository resolution/read/write 前同步拒绝空 identity，controller regression + TypeScript/build 已通过，等待 latest-head Chromium 总体验收。',
                status: 'fix_committed_revalidation_pending',
              });
            }
            if (item.id === 'PUI-BC-028') {
              return JSON.stringify({
                ...item,
                actual: '已改用项目真实 Base UI Dialog Root contract：blocked close request 调 eventDetails.cancel()，outside press 由 disablePointerDismissal={!canClose} 阻止；静态 contract + TypeScript/build 通过，等待真实 Chromium GP-REL-04 Escape/overlay/reconcile 验证。',
                status: 'fix_committed_revalidation_pending',
              });
            }
            return line;
          });
          fs.writeFileSync(path, `${lines.join('\n')}\n`);
          NODE
      - name: Remove one-shot workflow
        run: rm .github/workflows/fix-relocation-close-lock-operation-id-once.yml
      - name: Commit verified patch and journals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Lock uncertain relocation dialog and validate operation identity"
          git push origin HEAD:agent/canonical-care-relocation-wiring
