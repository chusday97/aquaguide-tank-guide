name: Generate Water Change Migration

on:
  push:
    branches: [agent/fix-aquarium-completion-state]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-aquarium-completion-state
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect Supabase CLI
        run: npx --yes supabase@latest migration new --help
      - name: Generate migration
        run: npx --yes supabase@latest migration new atomic_water_change_record
      - name: Commit generated migration and remove generator workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations
          git rm .github/workflows/generate-water-change-migration.yml
          git commit -m "chore: generate atomic water change migration"
          git push origin HEAD:agent/fix-aquarium-completion-state
