name: Apply Water Change Write Compensation

on:
  push:
    branches:
      - agent/water-change-cloud-persistence
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-compensation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/water-change-cloud-persistence
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply deterministic compensation transform
        run: node scripts/apply-water-change-write-compensation.mjs
      - name: Water-change persistence contract
        run: node scripts/test-water-change-cloud-persistence-contract.mjs
      - run: npm ci
      - name: Type check
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Commit compensation when needed
        run: |
          if git diff --quiet -- src/pages/Aquarium.tsx; then
            echo "Compensating write logic already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Aquarium.tsx
          git commit -m "Compensate partial water-change writes"
          git push origin HEAD:agent/water-change-cloud-persistence
