name: Result UX V1

on:
  pull_request:
    branches:
      - agent/uiux-system-refactor-v1

permissions:
  contents: write

jobs:
  validate-result-ux-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/result-ux-v1
          fetch-depth: 0

      - name: Guarded Procedure Result UX migration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/pages/CareEncyclopedia.tsx')
          text = path.read_text()

          if 'testId="care-procedure-decision"' in text:
              print('Procedure Result UX already migrated; no product rewrite needed')
              raise SystemExit(0)

          knowledge_marker = 'testId="care-knowledge-decision"'
          legacy_marker = '                <section className="mt-3 rounded-[18px] border border-emerald-100 bg-emerald-50/55 p-3.5">'
          knowledge_pos = text.find(knowledge_marker)
          if knowledge_pos == -1:
              raise SystemExit('Knowledge decision marker not found; refusing migration')
          legacy_pos = text.find(legacy_marker, knowledge_pos)
          if legacy_pos == -1:
              raise SystemExit('Legacy lead after Knowledge not found; refusing migration')
          branch_start = text.rfind('              ) : (\n', knowledge_pos, legacy_pos)
          if branch_start == -1:
              raise SystemExit('Knowledge-to-legacy branch boundary not found; refusing migration')
          branch_end_marker = '                </section>\n              )}'
          branch_end = text.find(branch_end_marker, legacy_pos)
          if branch_end == -1:
              raise SystemExit('Legacy lead branch end not found; refusing migration')
          branch_end += len(branch_end_marker)

          procedure_branch = '''              ) : meta.guideType === 'procedure' && procedureSteps.length > 0 ? (
                <section className="mt-3" data-care-procedure-result>
                  <DecisionResultSurface
                    testId="care-procedure-decision"
                    isEn={isEn}
                    tone={meta.urgencyTag === '需要立即处理' ? 'danger' : (meta.urgencyTag === '谨慎操作' || meta.urgencyTag === '建议尽快处理') ? 'warning' : 'info'}
                    eyebrow={isEn ? 'DO THIS FIRST' : '现在先做'}
                    statusLabel={getUrgencyTagLabel(meta.urgencyTag, isEn)}
                    title={procedureSteps[0].title}
                    summary={procedureSteps[0].description}
                    primarySource={careEvidenceSource(immediateEvidence[0])}
                    actions={procedureSteps.slice(1, 3).map((item, index) => ({
                      id: 'procedure-next-' + index,
                      title: item.title,
                      detail: item.description,
                      source: careEvidenceSource(immediateEvidence[index + 1]),
                    }))}
                    watchFor={[getProcedureObservation(topic)]}
                    avoid={procedureReminders.slice(0, 2).map(item => item.title)}
                    sources={careEvidenceSources(careActionEvidence)}
                  />
                </section>
              ) : (
                <section className="mt-3 rounded-[18px] border border-emerald-100 bg-emerald-50/55 p-3.5">
                  <div className="text-[12px] font-black text-emerald-800">{detailLead.label}</div>
                  <p className="mt-1 text-[14px] font-black leading-relaxed text-ink">{detailLead.text}</p>
                </section>
              )}'''
          text = text[:branch_start] + procedure_branch + text[branch_end:]

          old_card_start = text.find("              {meta.guideType === 'procedure' && procedureSteps.length > 0 && (\n")
          first_screen_end = text.find("            </div>\n          </div>\n\n          {meta.guideType === 'diagnosis' ? (", old_card_start)
          if old_card_start == -1 or first_screen_end == -1:
              raise SystemExit('Legacy Procedure card boundary not found; refusing migration')
          text = text[:old_card_start] + text[first_screen_end:]

          required = [
              'testId="care-procedure-decision"',
              'data-care-procedure-result',
              'procedureSteps.slice(1, 3)',
              'careEvidenceSource(immediateEvidence[0])',
              "eyebrow={isEn ? 'DO THIS FIRST' : '现在先做'}",
              "isEn ? 'After you finish' : '做完以后看什么'",
              "isEn ? 'Avoid for now' : '暂时不要'",
              "isEn ? 'Record Water Change in Tank' : '去记录本次换水'",
              'data-disclosure-purpose="secondary_evidence"',
          ]
          for needle in required:
              if needle not in text:
                  raise SystemExit(f'Required Procedure contract missing after migration: {needle}')
          if 'Follow Steps Sequentially' in text or '现在按顺序做' in text:
              raise SystemExit('Legacy Procedure first-screen duplicate still present')

          path.write_text(text)
          PY

          if git diff --quiet -- src/pages/CareEncyclopedia.tsx; then
            exit 0
          fi
          test "$(git status --short | awk '{print $2}')" = "src/pages/CareEncyclopedia.tsx"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/CareEncyclopedia.tsx
          git commit -m "Migrate Procedure to decision-first Result UX"
          git push origin HEAD:agent/result-ux-v1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Result UX contract
        run: node scripts/test-result-ux-contract.mjs

      - name: Type check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/aquaguide-result-ux.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/aquaguide-result-ux.log
          exit 1

      - name: Diagnosis decision-first regression
        env:
          PREVIEW_URL: http://127.0.0.1:4173
        run: node scripts/verify-golden-path-abnormal-care.mjs

      - name: Compatibility decision-first regression
        env:
          PREVIEW_URL: http://127.0.0.1:4173
        run: node scripts/verify-result-ux-compatibility.mjs

      - name: Knowledge decision-first regression
        env:
          PREVIEW_URL: http://127.0.0.1:4173
        run: node scripts/verify-result-ux-knowledge.mjs

      - name: Procedure decision-first regression
        env:
          PREVIEW_URL: http://127.0.0.1:4173
        run: node scripts/verify-result-ux-procedure.mjs

      - name: Upload Result UX evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aquaguide-result-ux-v1
          path: |
            artifacts/result-ux-diagnosis/**
            artifacts/result-ux-compatibility/**
            artifacts/result-ux-knowledge/**
            artifacts/result-ux-procedure/**
          if-no-files-found: warn
          retention-days: 7
