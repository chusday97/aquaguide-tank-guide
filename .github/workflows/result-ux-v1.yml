name: Result UX V1

on:
  pull_request:
    branches:
      - agent/uiux-system-refactor-v1

permissions:
  contents: write

jobs:
  validate-result-ux-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/result-ux-v1
          fetch-depth: 0

      - name: Guarded Identification confirmed-state migration
        shell: bash
        run: |
          python3 scripts/migrate-identification-confirmed-contract.py
          if git diff --quiet -- \
            src/pages/Identify.tsx \
            scripts/verify-result-ux-identification.mjs \
            scripts/test-result-ux-contract.mjs; then
            exit 0
          fi
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            scripts/test-result-ux-contract.mjs \
            scripts/verify-result-ux-identification.mjs \
            src/pages/Identify.tsx | sort)"
          test "$changed" = "$expected"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            src/pages/Identify.tsx \
            scripts/verify-result-ux-identification.mjs \
            scripts/test-result-ux-contract.mjs
          git commit -m "Stabilize Identification confirmed-state contract"
          git push origin HEAD:agent/result-ux-v1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Result UX contract
        run: node scripts/test-result-ux-contract.mjs

      - name: Type check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/aquaguide-result-ux.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/aquaguide-result-ux.log
          exit 1

      - name: Diagnosis decision-first regression
        env:
          PREVIEW_URL: http://127.0.0.1:4173
        run: node scripts/verify-golden-path-abnormal-care.mjs

      - name: Compatibility decision-first regression
        env:
          PREVIEW_URL: http://127.0.0.1:4173
        run: node scripts/verify-result-ux-compatibility.mjs

      - name: Knowledge decision-first regression
        env:
          PREVIEW_URL: http://127.0.0.1:4173
        run: node scripts/verify-result-ux-knowledge.mjs

      - name: Procedure decision-first regression
        env:
          PREVIEW_URL: http://127.0.0.1:4173
        run: node scripts/verify-result-ux-procedure.mjs

      - name: Species Detail decision-first + parent-context regression
        env:
          PREVIEW_URL: http://127.0.0.1:4173
        run: node scripts/verify-result-ux-species-detail.mjs

      - name: Identification uncertainty + explicit-confirmation regression
        env:
          PREVIEW_URL: http://127.0.0.1:4173
        run: node scripts/verify-result-ux-identification.mjs

      - name: Upload Result UX evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aquaguide-result-ux-v1
          path: |
            artifacts/result-ux-diagnosis/**
            artifacts/result-ux-compatibility/**
            artifacts/result-ux-knowledge/**
            artifacts/result-ux-procedure/**
            artifacts/result-ux-species-detail/**
            artifacts/result-ux-identification/**
          if-no-files-found: warn
          retention-days: 7
