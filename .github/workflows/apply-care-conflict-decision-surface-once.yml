name: Apply Care Conflict Decision Surface Once

on:
  push:
    branches:
      - agent/care-conflict-decision-surface
    paths:
      - '.github/workflows/apply-care-conflict-decision-surface-once.yml'

permissions:
  contents: write

jobs:
  patch-verify-and-self-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/care-conflict-decision-surface
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Add required Care icon import
        run: node scripts/apply-care-conflict-icon-import.mjs
      - name: Apply exact Care decision-surface patch
        run: node scripts/apply-care-conflict-decision-surface.mjs
      - name: Static Care decision-surface contract
        run: node scripts/test-care-conflict-decision-surface.mjs
      - name: Quick Diagnosis conflict augmentation regression
        run: node --import tsx scripts/test-quick-diagnosis-conflict-augmentation.ts
      - name: Tank Decision Support regression
        run: node --import tsx scripts/test-tank-decision-support-orchestrator.ts
      - name: Read-only Intervention UI contract
        run: node scripts/test-intervention-comparison-ui-contract.mjs
      - name: Reviewed severe-risk regression
        run: node --import tsx scripts/test-reviewed-severe-risk-regression.ts
      - name: Type check
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Commit verified Care integration and remove write tooling
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/CareEncyclopedia.tsx
          git rm scripts/apply-care-conflict-icon-import.mjs
          git rm scripts/apply-care-conflict-decision-surface.mjs
          git rm .github/workflows/apply-care-conflict-decision-surface-once.yml
          git commit -m "Wire read-only conflict decision support into Quick Diagnosis"
          git push origin HEAD:agent/care-conflict-decision-surface
