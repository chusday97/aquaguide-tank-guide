name: Apply Aquarium Completion Patch

on:
  push:
    branches: [agent/fix-aquarium-completion-state]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-aquarium-completion-state
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact page patch
        run: node scripts/patch-aquarium-completion-state.mjs
      - name: Validate patch shape
        run: |
          git diff --check
          grep -q "const isBasicConfigComplete = aquariumSetupStatus === 'complete';" src/pages/Aquarium.tsx
          grep -q "const savedAquarium = await repository.saveAquarium(nextAquarium);" src/pages/Aquarium.tsx
      - name: Commit page patch and remove temporary patch tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Aquarium.tsx
          git rm scripts/patch-aquarium-completion-state.mjs .github/workflows/apply-aquarium-completion-patch.yml
          git commit -m "fix: route aquarium settings through repository"
          git push origin HEAD:agent/fix-aquarium-completion-state
