name: Apply Sixth UI Copy Audit

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  cleanup:
    if: github.event.pull_request.head.ref == 'agent/sixth-copy-audit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Fix migration helper interpolation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply-sixth-copy-audit.mjs')
          s = p.read_text()
          s = s.replace('${Date.now()}', r'\${Date.now()}')
          s = s.replace('${Math.random().toString(36).slice(2)}', r'\${Math.random().toString(36).slice(2)}')
          p.write_text(s)
          PY
      - name: Apply approved copy audit
        run: node scripts/apply-sixth-copy-audit.mjs
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Audit remaining UI error.message references
        run: |
          echo "Remaining error.message references outside services/api:"
          grep -RIn --include='*.ts' --include='*.tsx' 'error\.message' src/pages src/components src/lib || true
      - name: Remove one-time migration files
        run: rm -f scripts/apply-sixth-copy-audit.mjs .github/workflows/apply-sixth-copy-audit.yml
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No copy changes to commit"
          else
            git commit -m "refactor(ui): apply sixth copy audit"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
