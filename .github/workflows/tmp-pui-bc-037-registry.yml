name: Temporary PUI-BC-037 Registry

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  append:
    if: github.head_ref == 'agent/aquarium-settings-repository-closure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aquarium-settings-repository-closure
      - name: Append verified badcase
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          path = Path('evaluation/product/badcases.v1.jsonl')
          lines = [line for line in path.read_text().splitlines() if line.strip()]
          records = [json.loads(line) for line in lines]
          if any(record.get('id') == 'PUI-BC-037' for record in records):
              raise SystemExit('PUI-BC-037 already exists')
          record = {
              "id": "PUI-BC-037",
              "featureId": "aquarium_setup",
              "discoveredAt": "2026-08-18",
              "source": "functional_cta_audit",
              "severity": "high",
              "symptom": "鱼缸设置的“保存设置”是 live CTA，但旧实现只通过 saveAquariums/persistAquariums 写当前浏览器本地状态；cloud repository 模式下尺寸、水体、温度和设备可以在当前页面看似保存成功，云端鱼缸事实却仍是旧值。",
              "trigger": "cloud repository 模式打开任一鱼缸设置，修改尺寸/水体/目标温度或设备并点击“保存设置”，随后重新从 cloud repository 读取或刷新。",
              "expected": "保存设置必须先通过当前 AquaGuideRepository 持久化真实鱼缸事实；repository save 成功后再更新可见状态和成功反馈，失败保留设置上下文并允许重试；settings_updated 时间线只能作为事实保存成功后的次级记录。",
              "actual": "旧 Save Settings inline handler 先构造 updated aquariums 并调用 local-only saveAquariums(updated)，随后直接 persistCareTimelineEvent(settings_updated)、markAquariumConfigured 并关闭弹窗；因此 cloud fact 可未更新，但 UI/时间线已表达“已保存”。",
              "rootCauseLayer": "ui_persistence_contract",
              "status": "regression_verified",
              "fixedBy": "4001bd9599774d001e36d3075dfbbfb824fb9f53",
              "regression": "Fail-before-fix: Product Golden Path #629 / run 32109567946 — 原 Product evaluation contracts PASS 后，Aquarium settings repository contract FAIL：Aquarium settings must use an explicit async persistence handler instead of an inline local-only save. Product fix verification: Product Golden Path #644 / run 32111424988 on product code containing fix commit 4001bd9599774d001e36d3075dfbbfb824fb9f53 — 18 features/108 states/31 baseline Badcases，Aquarium settings repository contract、typecheck、build、Care card regression 与 GP-001～GP-005 全 PASS。永久 contract 锁定 active repository、await saveAquarium、UI success ordering、duplicate-submit guard 和 failure/retry path。该 CI 为 deterministic repository/architecture regression，不等同于 connected production-cloud E2E。"
          }
          lines.append(json.dumps(record, ensure_ascii=False, separators=(',', ':')))
          path.write_text('\n'.join(lines) + '\n')
          PY
      - name: Commit registry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evaluation/product/badcases.v1.jsonl
          git commit -m "test: register PUI-BC-037"
          git push origin HEAD:agent/aquarium-settings-repository-closure
