name: Post-105 Evaluator Repair Diagnostic

on:
  pull_request:
    branches: [integration/aquaguide-rc1]

permissions:
  contents: read

jobs:
  diagnostic:
    if: github.head_ref == 'agent/rc1-post-105-evaluator-repair'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repair PR
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production cloud runtime source contract
        run: node scripts/test-production-cloud-runtime-contract.mjs

      - name: Production cloud runtime smoke
        run: node --import tsx scripts/test-production-cloud-runtime-smoke.ts

      - name: UI interaction source contract
        run: node scripts/test-ui-interaction-repair-v1.mjs

      - name: Type check
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Start preview
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/aquaguide-post-105-repair.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/aquaguide-post-105-repair.log
          exit 1

      - name: UI interaction browser regression
        env:
          PREVIEW_URL: http://127.0.0.1:4173
        run: node scripts/verify-ui-interaction-repair-v1.mjs

      - name: GP-002 continuous browser path
        env:
          PREVIEW_URL: http://127.0.0.1:4173
        run: node scripts/verify-golden-path-species-to-stocking.mjs
