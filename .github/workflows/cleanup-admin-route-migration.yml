# One-shot cleanup: remove after App/AdminContent match main.
name: Cleanup Admin Route Migration

on:
  push:
    branches:
      - agent/admin-quality-inbox-v1
    paths:
      - .github/workflows/cleanup-admin-route-migration.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/admin-quality-inbox-v1
          fetch-depth: 0
      - name: Restore large App files from main
        shell: bash
        run: |
          git fetch origin main
          git checkout origin/main -- src/App.tsx src/pages/AdminContent.tsx
      - name: Commit cleanup
        shell: bash
        run: |
          if git diff --quiet -- src/App.tsx src/pages/AdminContent.tsx; then
            echo "Large App files already match main."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/pages/AdminContent.tsx
          git commit -m "Keep Quality Inbox routing isolated from App"
          git push origin HEAD:agent/admin-quality-inbox-v1
