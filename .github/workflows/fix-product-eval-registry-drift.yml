name: Fix product eval registry drift

on:
  push:
    branches:
      - agent/product-eval-registry-drift-fix

permissions:
  contents: write

jobs:
  fix-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply registry repair
        run: node scripts/fix-product-eval-registry-drift.mjs
      - name: Validate product evaluation registry
        run: node scripts/test-product-evaluation.mjs
      - name: Validate diff
        run: git diff --check
      - name: Commit registry repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evaluation/product/feature-states.v1.json evaluation/product/badcases.v1.jsonl
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "eval: repair product feature registry drift"
          git push
