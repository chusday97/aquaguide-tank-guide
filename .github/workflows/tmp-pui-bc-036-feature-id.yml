name: Temporary PUI-BC-036 Feature ID Fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  correct:
    if: github.head_ref == 'agent/aquarium-delete-repository-closure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aquarium-delete-repository-closure
      - name: Correct registry metadata only
        run: |
          python3 - <<'PY'
          from pathlib import Path

          registry = Path('evaluation/product/badcases.v1.jsonl')
          text = registry.read_text()
          old = '"id":"PUI-BC-036","featureId":"aquarium"'
          new = '"id":"PUI-BC-036","featureId":"aquarium_setup"'
          if old not in text:
              raise SystemExit('PUI-BC-036 aquarium featureId marker not found')
          registry.write_text(text.replace(old, new, 1))

          handoff = Path('HANDOFF-2026-08-18-PUI-BC-036.md')
          h = handoff.read_text()
          old_line = '- Registry: `PUI-BC-036`, `aquarium`, `high`, `ui_persistence_contract`, `regression_verified`.'
          new_line = '- Registry: `PUI-BC-036`, `aquarium_setup`, `high`, `ui_persistence_contract`, `regression_verified`.'
          if old_line not in h:
              raise SystemExit('handoff registry marker not found')
          h = h.replace(old_line, new_line, 1)
          marker = '- Evidence limitation: this is deterministic repository/architecture regression coverage.'
          note = '- Registry validation note: Product Golden Path #625 / run `32108127302` failed before the Aquarium contract because `featureId=aquarium` was not a registered product feature. The record is now mapped to the existing `aquarium_setup` feature; this was metadata correction only and did not change product code.\n'
          if note.strip() not in h:
              h = h.replace(marker, note + marker, 1)
          handoff.write_text(h)
          PY
          rm .github/workflows/tmp-pui-bc-036-feature-id.yml
      - name: Commit metadata correction and self-cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: align PUI-BC-036 with aquarium setup feature"
          git push origin HEAD:agent/aquarium-delete-repository-closure
