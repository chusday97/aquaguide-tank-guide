name: Core flow browser finalizer

on:
  push:
    branches:
      - agent/core-flow-eval-v1-v2-main
    paths:
      - scripts/core-flow-browser-trigger.txt

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/aquaguide-preview.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/aquaguide-preview.log
          exit 1
      - name: Browser core-flow regression
        env:
          PREVIEW_URL: http://127.0.0.1:4173
        run: node scripts/verify-core-flow-v1-v2-ui.mjs
      - name: Re-run executable and type gates
        run: |
          npm run test:core-flow-state-eval
          npm run test:compatibility
          npm run test:livestock-recording
          npm run test:daily-check
          npm run lint
      - name: Finalize evaluation contracts
        run: python3 scripts/finalize-core-flow-eval.py
      - name: Commit finalization and remove temporary files
        run: |
          rm -f .github/workflows/core-flow-browser-finalize.yml
          rm -f scripts/core-flow-browser-trigger.txt
          rm -f scripts/finalize-core-flow-eval.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(core-flow): finalize executable state coverage"
          git push
