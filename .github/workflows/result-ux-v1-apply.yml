name: Result UX V1 Apply

on:
  push:
    branches:
      - agent/result-ux-v1
    paths:
      - scripts/apply-result-ux-v1.mjs
      - .github/workflows/result-ux-v1-apply.yml
  pull_request:
    branches:
      - agent/uiux-system-refactor-v1
    paths:
      - scripts/apply-result-ux-v1.mjs
      - .github/workflows/result-ux-v1-apply.yml
      - src/components/result/**
      - src/modules/result/**

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/result-ux-v1
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply guarded Result UX patch
        run: node scripts/apply-result-ux-v1.mjs

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

      - name: Diff safety
        run: |
          git diff --check
          git status --short
          changed="$(git diff --name-only)"
          echo "$changed"
          test -n "$changed"
          test "$(printf '%s\n' "$changed" | grep -Ev '^(src/pages/CareEncyclopedia.tsx|src/components/CompatibilityRiskCalculator.tsx|src/components/result/DecisionResultSurface.tsx)$' | wc -l)" -eq 0

      - name: Commit guarded patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/CareEncyclopedia.tsx src/components/CompatibilityRiskCalculator.tsx src/components/result/DecisionResultSurface.tsx
          git commit -m "Apply decision-first Result UX"
          git push origin HEAD:agent/result-ux-v1
