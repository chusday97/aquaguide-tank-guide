name: Temporary CTA effect discovery
on:
  push:
    branches: [agent/functional-cta-audit-v2]
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/functional-cta-audit-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/preview.log 2>&1 &
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/preview.log
          exit 1
      - name: Discover no-effect CTAs
        run: AQUAGUIDE_PREVIEW_URL=http://127.0.0.1:4173 node scripts/tmp_discover_no_effect_ctas.mjs