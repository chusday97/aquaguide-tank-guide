name: Compatibility Pair Telemetry One-Shot Patch

on:
  push:
    branches: [agent/compatibility-pair-telemetry]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/compatibility-pair-telemetry
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply exact-anchor patch and verify
        run: node scripts/patch-compatibility-pair-telemetry.mjs
      - name: Commit verified patch and self-delete tooling
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/CompatibilityRiskCalculator.tsx scripts/patch-compatibility-pair-telemetry.mjs .github/workflows/compatibility-pair-telemetry-patch.yml
          git diff --cached --exit-code && { echo 'No verified patch produced'; exit 1; } || true
          git commit -m "Wire privacy-safe compatibility pair telemetry"
          git push origin HEAD:agent/compatibility-pair-telemetry
