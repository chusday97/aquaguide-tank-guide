name: Apply Admin Quality Inbox Route

on:
  push:
    branches:
      - agent/admin-quality-inbox-v1
    paths:
      - .github/workflows/apply-admin-quality-inbox-route.yml
      - scripts/apply-admin-quality-inbox-route.mjs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/admin-quality-inbox-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply deterministic source migration
        run: node scripts/apply-admin-quality-inbox-route.mjs
      - name: Commit source changes
        shell: bash
        run: |
          if git diff --quiet -- src/App.tsx src/pages/AdminContent.tsx; then
            echo "Migration already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/pages/AdminContent.tsx
          git commit -m "Route Admin Quality Inbox"
          git push origin HEAD:agent/admin-quality-inbox-v1
