name: Temporary PR83 post-merge Handoff sync
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Patch Handoff exact anchor
        shell: python
        run: |
          from pathlib import Path
          path = Path('HANDOFF-2026-08-17.md')
          text = path.read_text()
          old = "PR #83 将 breadth backlog 的“已完成 research group”定义为 **reviewed species profile groups ∪ reviewed pair-rule groups**，再按基础二名法排除整个 group。这个排除只服务 research planning：`runtimeEvidencePropagation=none_research_backlog_only`，不会把某个品系或 pair 的证据外推成其他运行时组合的安全结论。"
          new = old + "\n\nPR #83 `Fix compatibility evidence fallback group exclusion` 已 squash merge 到 main，merge commit：`df4ad1ccf55545e335c4314d89684a0b9503debd`。最终 exact merge-ref Product Golden Path **#580 / run 32044865900** 验证 final head `85d2d4d0aa76bfce1223ed8996ccc787cbb65bbf` + base `ec94f68c108635699b7e57f31e236c87ad5547fa`：18 features / 108 states / **28 Badcases**；contracts / typecheck / build / GP-001～GP-005 全 PASS。"
          count = text.count(old)
          assert count == 1, f'expected exactly one PR83 anchor, got {count}'
          path.write_text(text.replace(old, new, 1))
      - name: Verify registry and selector
        run: |
          npm run test:product-evaluation
          node --import tsx scripts/audit-compatibility-evidence-priority.ts
          npm run test:compatibility-evidence-coverage
      - name: Commit and self-delete
        run: |
          rm .github/workflows/tmp-close-pr83-handoff.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add HANDOFF-2026-08-17.md .github/workflows/tmp-close-pr83-handoff.yml
          git commit -m "docs: close compatibility evidence priority regression"
          git push origin HEAD:main
