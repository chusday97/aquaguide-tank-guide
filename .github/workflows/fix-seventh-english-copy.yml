name: Fix Seventh English Copy

on:
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  cleanup:
    if: github.event.pull_request.head.ref == 'agent/seventh-copy-audit'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply English follow-up
        run: node scripts/fix-seventh-english-copy.mjs
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Verify English alignment
        run: |
          ! grep -nE 'Automatic progress and next steps|Key subjects and relationships|Current focus|No visual subject available|Clear visual features|Moderate visual evidence|Limited visual evidence' src/i18n/index.ts
          echo 'English copy alignment passed.'
      - name: Remove one-time follow-up files
        run: rm -f scripts/fix-seventh-english-copy.mjs .github/workflows/fix-seventh-english-copy.yml
      - name: Commit follow-up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No follow-up changes to commit"
          else
            git commit -m "fix(ui): align seventh English copy"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
