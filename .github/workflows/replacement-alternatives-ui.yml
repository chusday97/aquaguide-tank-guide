name: Replacement Alternatives UI

on:
  pull_request:
    branches:
      - agent/replacement-recommendation-mvp
  push:
    branches:
      - agent/replacement-alternatives-ui

permissions:
  contents: read

jobs:
  alternatives-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Risk and alternatives UI contract
        run: node scripts/test-risk-alternatives-ui-contract.mjs
      - name: Replacement recommendation golden cases
        run: node --import tsx scripts/test-replacement-recommendation-engine.ts
      - name: Catalog grounding regression
        run: node --import tsx scripts/test-catalog-grounding-contract.ts
      - name: Type check
        run: npm run lint
      - name: Build
        run: npm run build
