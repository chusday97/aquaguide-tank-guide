name: RC1 Apply Care Workspace Detail Once

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'integration/aquaguide-rc1'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout RC1 branch
        uses: actions/checkout@v4
        with:
          ref: integration/aquaguide-rc1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Apply exact-anchor Care workspace detail migration
        run: |
          node scripts/apply-rc1-care-workspace-detail-v1.mjs
          node scripts/patch-rc1-care-topic-sync-v2.mjs

      - name: Care workspace detail source contract
        run: node scripts/test-care-workspace-detail-contract.mjs

      - name: Existing UI contracts
        run: |
          node scripts/test-ui-interaction-repair-v1.mjs
          node scripts/test-ui-modal-surface-contract.mjs
          node scripts/test-aquarium-species-detail-surface-contract.mjs

      - name: Type check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Start preview
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/aquaguide-care-workspace-preview.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/care >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/aquaguide-care-workspace-preview.log
          exit 1

      - name: Care workspace detail browser regression
        env:
          PREVIEW_URL: http://127.0.0.1:4173
        run: node scripts/verify-care-workspace-detail.mjs

      - name: Care card action regression
        env:
          PREVIEW_URL: http://127.0.0.1:4173
        run: node scripts/verify-care-card-action.mjs

      - name: Commit repaired Care source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/CareEncyclopedia.tsx
          if git diff --cached --quiet; then
            echo "No Care workspace detail changes to commit."
            exit 0
          fi
          git commit -m "Move Care articles into workspace detail"
          git push origin HEAD:integration/aquaguide-rc1
