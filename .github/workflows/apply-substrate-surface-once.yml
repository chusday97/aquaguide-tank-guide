name: Apply Substrate Surface Once

on:
  push:
    branches:
      - agent/substrate-surface-v1

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Patch substrate renderer contract
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/components/ThreeAquarium.tsx')
          text = path.read_text()

          old_call = "<SubstrateBed length={length} width={width} height={height} substrate={aquarium.substrate || (isSaltwater ? '珊瑚砂' : '河沙')} />"
          new_call = "<SubstrateBed length={length} width={width} height={height} substrate={aquarium.substrate} />"
          if old_call not in text:
              raise SystemExit('expected substrate fallback call not found')
          text = text.replace(old_call, new_call, 1)

          old_wrapper = '<div ref={containerRef} className="relative h-full w-full overflow-hidden bg-[#eef7f5]" style={{ touchAction: \'none\' }}>'
          new_wrapper = '<div ref={containerRef} data-substrate={aquarium.substrate || \'none\'} className="relative h-full w-full overflow-hidden bg-[#eef7f5]" style={{ touchAction: \'none\' }}>'
          if old_wrapper not in text:
              raise SystemExit('expected ThreeAquarium wrapper not found')
          text = text.replace(old_wrapper, new_wrapper, 1)

          start = text.find('  const pebbles = useMemo(() => {')
          end_marker = '  }, [length, width, substrate, config.accent, config.color, config.count, config.particle]);\n'
          if start < 0:
              raise SystemExit('pebble generation block not found')
          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit('pebble generation end marker not found')
          text = text[:start] + text[end + len(end_marker):]

          pebble_render = '''      {pebbles.map((pebble, index) => (\n        <mesh key={index} position={[pebble.x, topY + pebble.yLift, pebble.z]} scale={[pebble.scale * 1.35, pebble.scale * 0.55, pebble.scale]}>\n          <sphereGeometry args={[1, 8, 6]} />\n          <meshStandardMaterial color={pebble.color} roughness={0.95} />\n        </mesh>\n      ))}\n'''
          if pebble_render not in text:
              raise SystemExit('pebble render block not found')
          text = text.replace(pebble_render, '', 1)

          path.write_text(text)

          verify = Path('scripts/verify-substrate-surface-v1.mjs')
          verify.write_text('''import assert from 'node:assert/strict';\nimport fs from 'node:fs';\n\nconst source = fs.readFileSync('src/components/ThreeAquarium.tsx', 'utf8');\n\nassert.match(source, /data-substrate=\\{aquarium\\.substrate \\|\\| ['\"]none['\"]\\}/, '3D aquarium must expose the persisted substrate it consumes');\nassert.match(source, /<SubstrateBed[^>]+substrate=\\{aquarium\\.substrate\\}/, 'SubstrateBed must consume the saved substrate directly');\nassert.doesNotMatch(source, /aquarium\\.substrate \\|\\| \\(isSaltwater/, 'Renderer must not invent river/coral sand before the user selects substrate');\nassert.doesNotMatch(source, /pebbles\\.map|const pebbles = useMemo/, 'Substrate must be a continuous bottom surface, not hundreds of grain meshes');\nassert.match(source, /<boxGeometry args=\\{\\[bedLength, config\\.height, bedWidth\\]\\}/, 'Configured substrate must still fill the tank bottom as a continuous bed');\nassert.match(source, /if \\(!hasSubstrate\\)/, 'Bare-bottom state must remain explicit');\n\nconsole.log('Substrate Surface V1 contract PASS: explicit saved substrate -> continuous full-bed surface, no fake default, no grain-mesh cloud.');\n''')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Substrate surface contract
        run: node scripts/verify-substrate-surface-v1.mjs

      - name: Type check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Commit repair and remove one-time workflow
        run: |
          rm .github/workflows/apply-substrate-surface-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/ThreeAquarium.tsx scripts/verify-substrate-surface-v1.mjs .github/workflows/apply-substrate-surface-once.yml
          git commit -m "Render substrate as explicit tank surface"
          git push origin HEAD:agent/substrate-surface-v1
