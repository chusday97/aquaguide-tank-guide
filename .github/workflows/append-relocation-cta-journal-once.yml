name: Append Relocation CTA Journal Once

on:
  push:
    branches:
      - agent/relocation-confirmation-surface
    paths:
      - '.github/workflows/append-relocation-cta-journal-once.yml'

permissions:
  contents: write

jobs:
  journal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/relocation-confirmation-surface
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Append badcase before implementation
        shell: bash
        run: |
          cat >> evaluation/product/badcases.v1.jsonl <<'EOF'
          {"id":"PUI-BC-023","featureId":"compatibility","discoveredAt":"2026-08-17","source":"execution_surface_audit","severity":"critical","symptom":"迁移目标卡片如果直接把先前显示的 compatible verdict 当成执行授权，用户可能在鱼缸状态已经变化后仍看到可执行迁移入口，形成 stale-verdict mutation 风险。","trigger":"先打开群落调整比较并看到某目标缸为 compatible_by_current_evidence；随后源缸或目标缸状态变化，再从旧卡片发起迁移。","expected":"比较面板只能打开独立迁移确认层；真正 mutation 必须重新读取 canonical state 并经过 executeFreshRelocation。只有 formal relocation option 且当前卡片 verdict 为 compatible_by_current_evidence 时才允许显示‘打开确认’入口，其他状态不得暴露执行 CTA。","actual":"当前比较面板仍是只读，没有确认入口；下一步接线若直接调用 repository 或把缓存 verdict 当授权，会绕过 #63 fresh revalidation。","rootCauseLayer":"ui_execution_boundary","status":"open","regression":"test:relocation-confirmation-trigger + relocation confirmation surface CI + canonical confirmation integration audit"}
          EOF
      - name: Append handoff checkpoint before implementation
        shell: bash
        run: |
          cat >> HANDOFF.md <<'EOF'

          ## 2026-08-17 Relocation confirmation CTA wiring — checkpoint 1

          - 当前执行目标：把 PR #64 的迁移确认层入口接到 `InterventionComparisonPanel`，但比较面板本身继续保持 mutation-free，不 import/call Repository、API 或 Supabase。
          - 新登记 P0 Badcase：`PUI-BC-023`。旧目标缸 verdict 只能决定“是否显示打开确认入口”，绝不能作为 mutation 授权；真正执行必须进入 PR #63 `executeFreshRelocation()` fresh revalidation。
          - CTA 可见性约束：只有当前 formal relocation option 对应的 destination 且卡片状态为 `compatible_by_current_evidence` 才能显示“打开迁移确认”；`conditional / insufficient_data / not_recommended` 一律不显示执行入口。
          - 当前尚未修复：`InterventionComparisonPanel` 仍未提供 confirmation intent callback；本 checkpoint 先登记再改代码，Badcase 状态保持 `open`。
          - 禁止：不得从 destination card 直接调用 `repository.relocateLivestock()`；不得把 cached verdict 传入执行 policy 作为授权字段；不得自动替用户选择目标缸。
          EOF
      - name: Validate product evaluation registry
        run: npm run test:product-evaluation
      - name: Remove one-shot journal workflow
        run: rm .github/workflows/append-relocation-cta-journal-once.yml
      - name: Commit journal checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HANDOFF.md evaluation/product/badcases.v1.jsonl .github/workflows/append-relocation-cta-journal-once.yml
          git commit -m "Journal relocation confirmation CTA boundary"
          git push origin HEAD:agent/relocation-confirmation-surface
