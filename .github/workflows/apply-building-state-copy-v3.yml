name: Apply Building State and Copy Cleanup V3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-building-state-copy-v3.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply migration
        run: node scripts/apply-building-state-copy-v3.mjs
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Remove one-time migration files
        run: rm -f scripts/apply-building-state-copy-v3.mjs .github/workflows/apply-building-state-copy-v3.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(ui): mute unfinished features and trim copy"
          git push
