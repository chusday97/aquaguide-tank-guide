name: Cleanup Lionfish Patch Once

on:
  push:
    branches:
      - agent/reviewed-lionfish-predation-evidence
    paths:
      - '.github/workflows/cleanup-lionfish-patch-once.yml'

permissions:
  contents: write

jobs:
  verify-and-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reviewed-lionfish-predation-evidence
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Reverify lionfish evidence before cleanup
        run: node --import tsx scripts/test-lionfish-reviewed-evidence.ts
      - name: Reverify five-fixture severe-risk suite
        run: node --import tsx scripts/test-reviewed-severe-risk-regression.ts
      - name: Reverify contextual non-escalation
        run: node --import tsx scripts/test-contextual-compatibility-evidence.ts
      - name: Reverify TypeScript
        run: npm run lint
      - name: Remove all one-shot write tooling including this workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-lionfish-evidence-once.yml
          git rm scripts/apply-lionfish-evidence-hook.mjs
          git rm .github/workflows/cleanup-lionfish-patch-once.yml
          git commit -m "Remove verified lionfish write tooling"
          git push origin HEAD:agent/reviewed-lionfish-predation-evidence
