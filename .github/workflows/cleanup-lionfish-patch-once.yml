name: Cleanup Lionfish Patch Once

on:
  push:
    branches:
      - agent/reviewed-lionfish-predation-evidence
    paths:
      - '.github/workflows/cleanup-lionfish-patch-once.yml'

permissions:
  contents: write

jobs:
  patch-verify-and-self-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reviewed-lionfish-predation-evidence
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply canonical lionfish evidence patch
        run: node scripts/apply-lionfish-evidence-hook.mjs
      - name: Verify canonical lionfish evidence
        run: node --import tsx scripts/test-lionfish-reviewed-evidence.ts
      - name: Verify existing reviewed severe-risk suite
        run: node --import tsx scripts/test-reviewed-severe-risk-regression.ts
      - name: Verify contextual non-escalation
        run: node --import tsx scripts/test-contextual-compatibility-evidence.ts
      - name: Verify TypeScript
        run: npm run lint
      - name: Commit verified profile integration and remove all one-shot write tooling
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/compatibilityEvidence.ts
          git rm .github/workflows/apply-lionfish-evidence-once.yml
          git rm scripts/apply-lionfish-evidence-hook.mjs
          git rm .github/workflows/cleanup-lionfish-patch-once.yml
          git commit -m "Integrate canonical lionfish evidence and remove write tooling"
          git push origin HEAD:agent/reviewed-lionfish-predation-evidence
