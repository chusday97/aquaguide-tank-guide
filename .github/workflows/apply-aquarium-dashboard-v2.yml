name: Apply Aquarium Dashboard V2

on:
  push:
    branches:
      - agent/ui-v2-aquarium-foundation
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-dashboard-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ui-v2-aquarium-foundation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply deterministic dashboard layout
        run: node scripts/apply-aquarium-dashboard-v2.mjs
      - name: Verify dashboard information architecture
        run: node scripts/verify-ui-v2-dashboard-ia.mjs
      - run: npm ci
      - name: Type check
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Commit transformed layout when needed
        run: |
          if git diff --quiet -- src/pages/Aquarium.tsx; then
            echo "Dashboard layout already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Aquarium.tsx
          git commit -m "Restructure Aquarium into decision-first dashboard"
          git push origin HEAD:agent/ui-v2-aquarium-foundation
