name: Agent Memorial Repository Patch

on:
  push:
    branches:
      - agent/fix-aquarium-completion-state

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: run memorial repository patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-aquarium-completion-state
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply memorial repository patch
        run: python3 scripts/apply-memorial-repository-patch.py
      - run: npm ci
      - run: npm run test:memorial-repository
      - run: npm run lint
      - name: Commit repaired source and remove temporary patch machinery
        shell: bash
        run: |
          git config user.name "AquaGuide Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/agent-memorial-patch.yml scripts/apply-memorial-repository-patch.py
          git add src/services/repository/aquaguide.repository.ts src/services/repository/local-aquaguide.repository.ts src/services/repository/api-aquaguide.repository.ts src/pages/Aquarium.tsx package.json .github/workflows/product-golden-path.yml scripts/test-memorial-repository-boundary.ts
          git commit -m "fix: hydrate memorial records from repository"
          git push origin HEAD:agent/fix-aquarium-completion-state
