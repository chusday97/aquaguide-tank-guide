name: Apply Livestock Relocation Wiring Once

on:
  push:
    branches:
      - agent/atomic-livestock-relocation-contract
    paths:
      - '.github/workflows/apply-livestock-relocation-wiring-once.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/atomic-livestock-relocation-contract
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply exact-anchor repository/API wiring
        run: node scripts/apply-livestock-relocation-wiring.mjs
      - name: Pure relocation regression
        run: node --import tsx scripts/test-livestock-relocation.ts
      - name: SQL and contract safety regression
        run: node scripts/test-livestock-relocation-contract.mjs
      - name: Repository/API wiring contract
        run: node scripts/test-livestock-relocation-wiring.mjs
      - name: Existing unresolved livestock regression
        run: node --import tsx scripts/test-unresolved-existing-livestock.ts
      - name: Existing livestock recording regression
        run: node --import tsx scripts/test-livestock-recording.ts
      - name: API TypeScript
        run: npm run check:api
      - name: App TypeScript
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Commit verified wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/contracts/src/index.ts src/services/repository/aquaguide.repository.ts src/services/repository/local-aquaguide.repository.ts src/services/repository/api-aquaguide.repository.ts apps/api/src/routes/aquariums.ts
          git diff --cached --quiet && exit 0
          git commit -m "Wire atomic livestock relocation through repository and API"
          git push origin HEAD:agent/atomic-livestock-relocation-contract
