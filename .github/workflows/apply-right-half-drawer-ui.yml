name: Apply right-half drawer UI

on:
  push:
    branches:
      - agent/right-half-drawer-ui

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[drawer-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/right-half-drawer-ui
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply deterministic source migration
        run: node scripts/apply-right-half-drawer-ui.mjs
      - name: Check source diff
        run: git diff --check
      - name: Commit migrated UI
        run: |
          if git diff --quiet; then
            echo "No migration changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Encyclopedia.tsx src/components/CompatibilityRiskCalculator.tsx HANDOFF.md
          git commit -m "fix: use right-half drawers for details and compatibility [drawer-applied]"
          git push origin HEAD:agent/right-half-drawer-ui
