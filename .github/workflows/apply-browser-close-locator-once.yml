name: Apply Browser Close Locator Once

on:
  push:
    branches:
      - agent/canonical-care-relocation-wiring
    paths:
      - '.github/workflows/apply-browser-close-locator-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/canonical-care-relocation-wiring
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact browser Close locator patch
        run: node scripts/apply-browser-close-locator-once.mjs
      - name: Verify locator semantics
        shell: bash
        run: |
          set -euo pipefail
          ! grep -F "getByRole('button', { name: '关闭' })" scripts/test-care-relocation-browser-golden-path.mjs
          test "$(grep -F -c "filter({ hasText: /^关闭$/ })" scripts/test-care-relocation-browser-golden-path.mjs)" -eq 2
      - name: Remove one-shot tooling
        run: rm .github/workflows/apply-browser-close-locator-once.yml scripts/apply-browser-close-locator-once.mjs
      - name: Commit test-only locator correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No locator changes to commit"; exit 1; }
          git commit -m "Disambiguate browser confirmation Close action"
          git push origin HEAD:agent/canonical-care-relocation-wiring
