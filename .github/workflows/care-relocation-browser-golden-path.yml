name: Care Relocation Browser Golden Path

on:
  push:
    branches:
      - agent/canonical-care-relocation-wiring
    paths:
      - 'scripts/test-care-relocation-browser-golden-path.mjs'
      - 'src/pages/CareEncyclopedia.tsx'
      - 'src/components/compatibility/InterventionComparisonPanel.tsx'
      - 'src/components/compatibility/RelocationConfirmationDialog.tsx'
      - 'src/services/care/care-relocation-confirmation.controller.ts'
      - 'src/services/care/care-relocation-canonical-state.ts'
      - 'src/lib/relocationConfirmationEntrypoint.ts'
      - 'src/lib/relocationExecutionPolicy.ts'
      - '.github/workflows/care-relocation-browser-golden-path.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-golden-path:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Confirm tested branch head
        run: git rev-parse HEAD
      - run: npm ci
      - name: Relocation close locator and Base UI lock contract
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const dialog = fs.readFileSync('src/components/compatibility/RelocationConfirmationDialog.tsx', 'utf8');
          const panel = fs.readFileSync('src/components/compatibility/InterventionComparisonPanel.tsx', 'utf8');
          const care = fs.readFileSync('src/pages/CareEncyclopedia.tsx', 'utf8');
          const browser = fs.readFileSync('scripts/test-care-relocation-browser-golden-path.mjs', 'utf8');
          const marker = 'data-close-relocation-confirmation="true"';
          const dialogCount = dialog.split(marker).length - 1;
          const browserCount = browser.split("[data-close-relocation-confirmation=\"true\"]").length - 1;
          if (dialogCount !== 1) throw new Error(`expected one business footer close locator, found ${dialogCount}`);
          if (browserCount !== 2) throw new Error(`expected two browser uses of the unique close locator, found ${browserCount}`);
          if (browser.includes("filter({ hasText: /^关闭$/ })")) throw new Error('text-only Close locator must not return');
          if (!dialog.includes('disablePointerDismissal={!canClose}')) throw new Error('uncertain dialog must disable Base UI pointer dismissal');
          if (!dialog.includes('eventDetails.cancel()')) throw new Error('blocked Base UI confirmation close requests must be canceled at Dialog.Root');
          if (dialog.includes('onEscapeKeyDown=')) throw new Error('Radix-only popup escape handler must not be reintroduced');
          if (!panel.includes('closeLocked?: boolean')) throw new Error('intervention owner must expose an explicit close lock');
          if (!panel.includes('disablePointerDismissal={closeLocked}')) throw new Error('intervention owner must block pointer dismissal while confirmation exists');
          if (!panel.includes('eventDetails.cancel()')) throw new Error('intervention owner must cancel blocked Base UI close requests');
          if (!panel.includes("data-intervention-close-locked={closeLocked ? 'true' : 'false'}")) throw new Error('intervention owner close button must share the same lock predicate');
          if (!care.includes('closeLocked={Boolean(relocationController)}')) throw new Error('Care must derive owner lock from relocationController existence');
          console.log('relocation confirmation + owner Base UI close-lock contract passed');
          NODE
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Start AquaGuide Vite server
        shell: bash
        run: |
          set -euo pipefail
          nohup npx vite --host 127.0.0.1 --port 4173 </dev/null > /tmp/aquaguide-vite.log 2>&1 &
          echo $! > /tmp/aquaguide-vite.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent --max-time 2 http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/aquaguide-vite.log
          exit 1
      - name: Real Care relocation browser Golden Path
        shell: bash
        env:
          AQUAGUIDE_BROWSER_BASE_URL: http://127.0.0.1:4173
          AQUAGUIDE_BROWSER_ARTIFACT_DIR: /tmp/aquaguide-browser-artifacts
        run: |
          set -o pipefail
          node scripts/test-care-relocation-browser-golden-path.mjs 2>&1 | tee /tmp/aquaguide-browser-test.log
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: care-relocation-browser-diagnostics-${{ github.run_id }}
          path: |
            /tmp/aquaguide-browser-artifacts
            /tmp/aquaguide-browser-test.log
            /tmp/aquaguide-vite.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop AquaGuide Vite server
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/aquaguide-vite.pid ]; then
            kill "$(cat /tmp/aquaguide-vite.pid)" 2>/dev/null || true
          fi